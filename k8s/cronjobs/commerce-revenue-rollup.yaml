# Reconciles the commerce daily-revenue rollup (docs/97 §5). Recomputes a
# trailing window of rollup_commerce_daily_revenue from the source-of-truth
# orders, per active tenant, so the Commerce overview's revenue chart reads
# pre-aggregated rows instead of a GROUP BY on the hot path.
#
# Runs nightly after the day has fully closed (and after the CRM jobs, 02–05
# UTC). The work is light — one GROUP BY over the trailing window per tenant —
# but Forbid concurrency so a slow run never overlaps the next. The read
# endpoint live-overlays today, so a late or skipped run only delays correcting
# closed days, never the live figure.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: commerce-revenue-rollup
  namespace: sparx-prod
  labels:
    app: commerce-cron
    job: revenue-rollup
spec:
  schedule: '0 6 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: commerce-cron
            job: revenue-rollup
        spec:
          serviceAccountName: sparx-app
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.10.1
              command: ['sh', '-c']
              args:
                - >
                  curl --fail-with-body --silent --show-error
                  --max-time 300
                  -X POST
                  -H "X-Sparx-Internal-Cron-Token: $SPARX_INTERNAL_CRON_TOKEN"
                  http://api-rest.sparx-prod.svc.cluster.local:3000/internal/commerce/revenue-rollup
              env:
                - name: SPARX_INTERNAL_CRON_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: sparx-app-secrets
                      key: SPARX_INTERNAL_CRON_TOKEN
              resources:
                requests:
                  cpu: '25m'
                  memory: '16Mi'
                limits:
                  cpu: '100m'
                  memory: '32Mi'
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ['ALL']
                seccompProfile:
                  type: RuntimeDefault
