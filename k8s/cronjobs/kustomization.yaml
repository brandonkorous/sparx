apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sparx-prod
resources:
  - crm-partition-rollover.yaml
  - crm-automation-triggers.yaml
  - crm-overdue-reminders.yaml
  - crm-segment-recompute.yaml
  - crm-mailbox-sync.yaml
  # Without this, a support promise is a number in a column nobody ever reads.
  - crm-sla-sweep.yaml
  - commerce-reservation-reaper.yaml
  - commerce-revenue-rollup.yaml
  - commerce-payment-reconcile-sweep.yaml
  # Without this, a subscription can be created but never charges anyone.
  - commerce-subscription-tick.yaml
  - invoicing-collected-rollup.yaml
  - dropship-orders-rollup.yaml
  - automation-runs-rollup.yaml
  - platform-usage-rollup.yaml
  # The engine heartbeat + nightly seed reconcile. These replace the Cloud
  # Scheduler jobs that drove automation-worker on GCP; without them the worker
  # runs but nothing ever ticks.
  - automation-tick.yaml
  - automation-reconcile-seeds.yaml
  # Without this, a purchased domain expires with no warning to its owner — the
  # handler shipped with the domain-worker but was never given a scheduler on
  # either cloud.
  - domain-renewal-check.yaml
  - site-analytics-rollup.yaml
  - search-console-sync.yaml
  # Without this, `onHand == Σ(movements.delta)` is a design guarantee nobody
  # ever re-derives, and a stale feed keeps selling stock that isn't there.
  - inventory-integrity-sweep.yaml
  # Without this, a reorder point stays whatever number somebody typed once and
  # nothing ever measures how fast anything sells or how long a supplier takes.
  - inventory-planning-sweep.yaml
  - inventory-valuation-snapshot.yaml
  # Without this, every report in the module is something you have to remember
  # to go and look at, which is the same as not having it.
  - inventory-report-delivery.yaml
  - channel-order-poll.yaml
  - market-settlement.yaml
  # Finance shipped with no cron file at all, so two capabilities that looked
  # finished did nothing: a repeating cost never generated an expense, and the
  # profit cache the Profit surface READS was only ever written by a manual
  # button.
  - finance-recurring-due.yaml
  - finance-profit-rollup.yaml
  # Without this, an expiry date is recorded and never mentioned again — which
  # is the opposite of what a certification tracker is for.
  - staff-certification-reminders.yaml
  # Without this, `getTrackingUpdate()` is implemented by four supplier adapters
  # and called by nothing: a dropshipped order is submitted and then never asked
  # about again, so the customer is never told their parcel moved.
  - dropship-tracking-poll.yaml
  # Without the first, a funnel's anonymous half is never aggregated and the
  # chart at the top of the ladder stays empty. Without the second,
  # `funnel.abandoned` has no publisher at all — the one funnel signal nobody
  # triggers, and the one a recovery follow-up hangs off.
  - funnels-rollup.yaml
  - funnels-abandonment-sweep.yaml
