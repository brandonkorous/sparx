  - crm-automation-triggers.yaml
  - crm-overdue-reminders.yaml
  - crm-segment-recompute.yaml
  - commerce-reservation-reaper.yaml
  - commerce-revenue-rollup.yaml
  - commerce-payment-reconcile-sweep.yaml
  - invoicing-collected-rollup.yaml
