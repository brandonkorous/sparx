apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sparx-prod
resources:
  - crm-partition-rollover.yaml
  - crm-automation-triggers.yaml
  - crm-overdue-reminders.yaml
  - crm-segment-recompute.yaml
  - crm-mailbox-sync.yaml
  # Without this, a support promise is a number in a column nobody ever reads.
  - crm-sla-sweep.yaml
  - commerce-reservation-reaper.yaml
  - commerce-revenue-rollup.yaml
  - commerce-payment-reconcile-sweep.yaml
  # Without this, a subscription can be created but never charges anyone.
  - commerce-subscription-tick.yaml
  - invoicing-collected-rollup.yaml
  - dropship-orders-rollup.yaml
  - automation-runs-rollup.yaml
  # The engine heartbeat + nightly seed reconcile. These replace the Cloud
  # Scheduler jobs that drove automation-worker on GCP; without them the worker
  # runs but nothing ever ticks.
  - automation-tick.yaml
  - automation-reconcile-seeds.yaml
  # Without this, a purchased domain expires with no warning to its owner — the
  # handler shipped with the domain-worker but was never given a scheduler on
  # either cloud.
  - domain-renewal-check.yaml
  - site-analytics-rollup.yaml
  - search-console-sync.yaml
  # Without this, `onHand == Σ(movements.delta)` is a design guarantee nobody
  # ever re-derives, and a stale feed keeps selling stock that isn't there.
  - inventory-integrity-sweep.yaml
  - inventory-valuation-snapshot.yaml
  - channel-order-poll.yaml
  - market-settlement.yaml
