# Reconciles the dropship daily orders/revenue/cost rollup (docs/97 §5).
# Recomputes a trailing window of rollup_dropship_daily_orders from the
# source-of-truth dropship orders + storefront items, per dropship-active
# tenant, so the Dropship overview's "order volume" chart reads pre-aggregated
# rows instead of expanding line-item JSON and joining order_items ↔ variants on
# the hot path.
#
# Runs nightly at 07:00 UTC — after the day has fully closed and after the
# commerce revenue (06:00) and invoicing collected (06:30) rollups, so the
# nightly reconciles don't pile onto the DB at once. The work is a single
# GROUP-BY-day pass over the trailing window per tenant, but Forbid concurrency
# so a slow run never overlaps the next. The read endpoint live-overlays today,
# so a late or skipped run only delays correcting closed days, never the live
# figure.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dropship-orders-rollup
  namespace: sparx-prod
  labels:
    app: dropship-cron
    job: orders-rollup
spec:
  schedule: '0 7 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: dropship-cron
            job: orders-rollup
        spec:
          serviceAccountName: sparx-app
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.10.1
              command: ['sh', '-c']
              args:
                - >
                  curl --fail-with-body --silent --show-error
                  --max-time 300
                  -X POST
                  -H "X-Sparx-Internal-Cron-Token: $SPARX_INTERNAL_CRON_TOKEN"
                  http://api-rest.sparx-prod.svc.cluster.local:3000/internal/dropship/orders-rollup
              env:
                - name: SPARX_INTERNAL_CRON_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: sparx-app-secrets
                      key: SPARX_INTERNAL_CRON_TOKEN
              resources:
                requests:
                  cpu: '25m'
                  memory: '16Mi'
                limits:
                  cpu: '100m'
                  memory: '32Mi'
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ['ALL']
                seccompProfile:
                  type: RuntimeDefault