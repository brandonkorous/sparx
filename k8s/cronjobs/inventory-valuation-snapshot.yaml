# Captures a daily inventory-valuation snapshot (docs/97 §5) — powers the
# Inventory overview's "value over time" chart. For each active Inventory tenant
# it records today's total units + value at cost/retail into
# rollup_inventory_daily_valuation (point-in-time; stock has no per-day ledger to
# backfill from, so the series builds forward from first capture).
#
# Runs nightly at 05:30 UTC — ahead of the recompute reconciles (commerce 06:00,
# invoicing 06:30, dropship 07:00, automation 08:00) so it captures a clean
# end-of-day stock position before the morning's churn, and the nightly DB work
# stays staggered. Idempotent (upsert on today's row); the read live-overlays the
# current valuation, so a missed run only delays a fixed historical point, never
# today's figure. Forbid concurrency so a slow run never overlaps the next.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: inventory-valuation-snapshot
  namespace: sparx-prod
  labels:
    app: inventory-valuation-cron
    job: valuation-snapshot
spec:
  schedule: '30 5 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: inventory-valuation-cron
            job: valuation-snapshot
        spec:
          serviceAccountName: sparx-app
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.10.1
              command: ['sh', '-c']
              args:
                - >
                  curl --fail-with-body --silent --show-error
                  --max-time 280
                  -X POST
                  -H "X-Sparx-Internal-Cron-Token: $SPARX_INTERNAL_CRON_TOKEN"
                  http://api-rest.sparx-prod.svc.cluster.local:3000/internal/inventory/valuation-snapshot
              env:
                - name: SPARX_INTERNAL_CRON_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: sparx-app-secrets
                      key: SPARX_INTERNAL_CRON_TOKEN
              resources:
                requests:
                  cpu: '25m'
                  memory: '16Mi'
                limits:
                  cpu: '100m'
                  memory: '32Mi'
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ['ALL']
                seccompProfile:
                  type: RuntimeDefault
