# Reconciles the system-seeded automations against every active tenant, so a
# tenant that activated a module after its seeds were written still ends up with
# the automations that module ships. Nightly, matching the GCP schedule it
# replaces (`sparx-prod-automation-reconcile-seeds`, `7 2 * * *`).
#
# 02:07 UTC is kept verbatim rather than rounded: it sits deliberately BEFORE the
# CRM jobs at 02:00-05:00 have finished piling up and off the top of the hour,
# where every other scheduler in the platform bunches. Moving it to :00 would put
# a cross-tenant sweep in the same minute as crm-partition-rollover on a single
# 2-vCPU node.
#
# Same shared-secret auth as automation-tick; see that file for why the OIDC path
# did not survive the move off Cloud Scheduler.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: automation-reconcile-seeds
  namespace: sparx-prod
  labels:
    app: automation-cron
    job: reconcile-seeds
spec:
  schedule: '7 2 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: automation-cron
            job: reconcile-seeds
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.10.1
              command: ['sh', '-c']
              args:
                - >
                  curl --fail-with-body --silent --show-error
                  --max-time 600
                  -X POST
                  -H "X-Sparx-Internal-Cron-Token: $SPARX_INTERNAL_CRON_TOKEN"
                  http://event-worker.sparx-prod.svc.cluster.local:8080/internal/cron/reconcile-seeds
              env:
                - name: SPARX_INTERNAL_CRON_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: sparx-app-secrets
                      key: SPARX_INTERNAL_CRON_TOKEN
              resources:
                requests:
                  cpu: '25m'
                  memory: '16Mi'
                limits:
                  cpu: '100m'
                  memory: '64Mi'
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ['ALL']
                seccompProfile:
                  type: RuntimeDefault
