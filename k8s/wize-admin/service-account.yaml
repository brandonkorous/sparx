# Dedicated KSA for the admin console — NOT the shared sparx-app SA. Bound (via
# Workload Identity, Terraform) to the `wize-admin` GSA, whose only IAM grant is
# Pub/Sub publisher (the operator set-password email.send). It has NO Cloud SQL
# IAM and NO Secret Manager beyond what envFrom injects; it reaches the wize_admin
# schema over the VPC private IP with the wize_operator password.
#
# Annotate after first apply (bootstrap.yml does this):
#   iam.gke.io/gcp-service-account: wize-admin@sparxworks.iam.gserviceaccount.com
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wize-admin
  namespace: wize-admin
