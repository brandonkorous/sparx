# sparx-app-env — non-secret runtime env shared by api-rest, dashboard,
# and future @sparx services. Secrets (DATABASE_URL, JWT secret, Stripe
# keys, etc.) live in `sparx-app-secrets` and are synced from GCP Secret
# Manager via k8s/scripts/sync-secrets.ps1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sparx-app-env
  namespace: sparx-prod
data:
  # Where pods publish events. Empty / absent disables Pub/Sub (dev path).
  # The api-rest publisher uses one topic per EventType (topic name == event
  # type) — no shared/fan-out topic, so there is no PUBSUB_TOPIC to set.
  GCP_PROJECT_ID: sparxworks
  # Better Auth / the workbench (the staff app at app.sparx.works) need the
  # canonical public origin so the OAuth/session cookies scope correctly. NOT a
  # secret.
  BETTER_AUTH_URL: https://app.sparx.works
  # MCP OAuth (docs/07 §5). MCP_RESOURCE_URL is the canonical resource
  # identifier of the MCP server (the audience OAuth tokens target); the
  # workbench validates it at consent + advertises it, and api-mcp echoes it in
  # its protected-resource metadata. MCP_AUTH_SERVER_URL is the authorization
  # server (the workbench / Better Auth origin at app.sparx.works) that api-mcp
  # points clients at. NOT secrets. (AUTH_DATABASE_URL, used by api-mcp to
  # introspect OAuth tokens as sparx_owner, lives in sparx-app-secrets alongside
  # the other DB URLs.)
  MCP_RESOURCE_URL: https://mcp.sparx.works/mcp
  MCP_AUTH_SERVER_URL: https://app.sparx.works
  # Site MCP (docs/113) — the shopper-facing MCP plane (mcp-site).
  # Its canonical public origin, used only to build discovery URLs. The service
  # otherwise reads SPARX_API_REST_URL (below) to reach the public REST API.
  SITE_MCP_PUBLIC_ORIGIN: https://mcp.sparx.zone
  # Customer (Layer 2 shopper) Better Auth instance — runs INSIDE api-rest
  # (docs/27 v2). CUSTOMER_AUTH_URL is api-rest's PUBLIC https origin: Better Auth
  # builds absolute URLs from it and (crucially) derives the cookie Secure prefix
  # from its protocol, so it MUST be https in prod. The matching CUSTOMER_AUTH_SECRET
  # (distinct from BETTER_AUTH_SECRET) lives in sparx-app-secrets. NOT a secret.
  CUSTOMER_AUTH_URL: https://api.sparx.works
  CUSTOMER_MCP_LOGIN_PAGE: /account/login
  # The ONE name for the workbench's public origin — every link a service puts in
  # an email resolves through it (@wizeworks/links/server appOrigin). Four variables
  # used to mean this and each emitter read a different one with its own fallback,
  # so which host an email pointed at depended on which service sent it. The old
  # names still resolve, in a fixed order, so nothing breaks mid-rollout.
  SPARX_APP_URL: https://app.sparx.works
  NEXT_PUBLIC_APP_URL: https://app.sparx.works

  # Piggles' equivalents. `appOrigin(brand)` derives the variable name from the
  # tenant's `platform_brand`, so a second brand is configuration rather than a
  # code change — and without these, every link the platform built for a Piggles
  # tenant pointed at app.sparx.works. An unconfigured origin now THROWS in
  # production rather than guessing, so a missing line fails the rollout instead
  # of quietly mailing somebody another company's URL.
  #
  # Two, not one: mypiggles.com has no sign-in page and never will, so anything
  # an unauthenticated person clicks — a team invitation above all — resolves
  # against the ACCOUNT origin. sparx needs no _ACCOUNT_URL because its
  # workbench mounts Better Auth and the lookup falls through to the same host.
  PIGGLES_APP_URL: https://mypiggles.com
  PIGGLES_ACCOUNT_URL: https://getpiggles.com

  # Who the platform speaks AS, per brand (@wizeworks/brand-core). Shared code —
  # an email worker draining one queue for both brands — cannot import either
  # brand's package, so the identity arrives as configuration keyed by
  # `tenants.platform_brand`.
  #
  # `*_BRAND_NAME` is the case-sensitive product name and is not derivable:
  # sparx is lowercase on purpose, Piggles is capitalised on purpose. It is the
  # wordmark on every platform email to a tenant with no branding of its own —
  # which is most of them early on, and all of which said "sparx" until
  # 2026-08-16.
  #
  # `*_SUPPORT_NAME` defaults to "<name> Support" and only needs setting to say
  # something else.
  SPARX_BRAND_NAME: sparx
  PIGGLES_BRAND_NAME: Piggles

  # PIGGLES_SUPPORT_EMAIL is DELETED, and the deletion is the answer rather than
  # an omission. It was support@meetpiggles.com pending confirmation; checked on
  # 2026-08-17, meetpiggles.com and getpiggles.com have NO MX RECORDS (only
  # mypiggles.com does). That address cannot receive mail, so as a reply-to it
  # bounces every Piggles support reply — invisibly to the sender, who believes
  # they have replied and waits. Unset, brand-core treats it as "this brand has
  # published none" and omits the reply-to and the billing line entirely. To turn
  # it back on: MX on a Piggles domain, or an address on one that has it.

  # The brand's public home — the legal line at the foot of every platform email.
  SPARX_BRAND_URL: https://sparx.works
  PIGGLES_BRAND_URL: https://meetpiggles.com
  # Trailing characters of the name set in the accent color where it is used as a
  # wordmark: sparx is "spar" + an Ember "x". Unset → the name is set plainly.
  SPARX_BRAND_ACCENT_CHARS: '1'
  # The zone a NEW tenant of this brand is minted in (vs SPARX_ZONE_DOMAINS, the
  # zones this deployment serves).
  PIGGLES_ZONE_DOMAIN: piggles.site
  # The attribution badge on every tenant PUBLIC site. A literal hex, not a
  # token — the badge renders on a tenant's own site and must be immune to that
  # tenant's CSS, so it inlines everything it paints.
  SPARX_BRAND_ACCENT: '#e04631'
  PIGGLES_BRAND_ACCENT: '#FF6F86'
  SPARX_CREDIT_URL: https://sparx.works/?utm_source=powered_by&utm_medium=site_badge&utm_campaign=made_with_sparx
  PIGGLES_CREDIT_URL: https://meetpiggles.com/?utm_source=powered_by&utm_medium=site_badge&utm_campaign=made_with_piggles
  PIGGLES_BRAND_ACCENT_CHARS: '0'

  # The colors a PLATFORM email paints itself in — masthead band, the one action,
  # receipt rules, footer well. One JSON object per brand: a palette is ONE
  # decision, and half a palette (this brand's accent on that brand's ink) is the
  # only outcome worse than none. Hex rather than tokens because mail clients
  # strip <style>; six digits only, since 3- and 8-digit forms fail in Outlook.
  #
  # Unset is safe and VISIBLE: that brand sends in an achromatic fallback owned by
  # nobody, and the worker warns naming the variable. Deliberately not sparx's
  # values as the default — that is how the Ember masthead reached every Piggles
  # owner. See wizeworks/packages/brand-core/src/email-palette.ts.
  SPARX_EMAIL_PALETTE: '{"accent":"#e04631","accentContent":"#ffffff","accentEdge":"#c13a28","accentWash":"#fbe9e5","ink":"#0c1433","inkContent":"#ffffff","inkMeta":"#97a0bd","paper":"#ffffff","canvas":"#eceef2","well":"#fafafc","line":"#e8eaf0","lineStrong":"#d3d7e0","heading":"#0c1433","body":"#2b3242","lead":"#3a4152","label":"#4b5563","meta":"#5b6472","success":"#0f8a5f","successWash":"#e7f6ef","warnInk":"#7c3a06","warnWash":"#fbeed9","danger":"#c13a28","dangerWash":"#fdece9","info":"#3b5bdb","infoWash":"#eef2ff","dark":{"background":"#0b1120","foreground":"#e2e8f0","muted":"#111827","border":"#1f2937"}}'
  # Piggles carries only what its approved board states, mapped by ROLE. Four
  # roles (accentEdge, accentWash, inkMeta, lineStrong) are absent because the
  # board has no value for them and deriving one would be inventing a Piggles
  # color; they collapse until Brandon supplies four values.
  PIGGLES_EMAIL_PALETTE: '{"accent":"#ff6f86","accentContent":"#ffffff","ink":"#2d3443","inkContent":"#ffffff","paper":"#ffffff","canvas":"#eef0f3","well":"#f7f8fa","line":"#eef0f3","heading":"#202631","body":"#202631","meta":"#52454f","dark":{"background":"#272d39","foreground":"#f4f5f7","muted":"#1c212c","border":"#151922","primary":"#ff7c91","primaryForeground":"#20151a"}}'

  # What each brand INCLUDES, per tenant. Metering is platform (every tenant is
  # measured nightly); the ceilings are commercial and therefore per brand.
  # A meter absent here is METERED WITHOUT A CEILING: usage is shown because it
  # is measured, and no bar or warning is drawn because there is nothing true to
  # draw them against — which is what lets metering ship ahead of pricing, and it
  # must, since usage history cannot be backfilled.
  #
  # SPARX_CAPACITY is deliberately UNSET: sparx sells per module, not per
  # capacity, so every sparx meter reads unmetered.
  #
  # Piggles carries only the four allowances its pricing sheet states outright.
  # storageBytes and emailSendsPerMonth are ABSENT because that sheet gives them
  # as ranges it has not settled ("10–25 GB", "5,000–10,000 sends/month", under
  # "Final numbers must be validated against infrastructure cost"). Rendering the
  # middle of an undecided range as a limit manufactures a commercial decision,
  # and the owner reading it cannot tell it from a real one.
  PIGGLES_CAPACITY: '{"seats":3,"sites":1,"locations":1,"contacts":10000}'

  NEXT_PUBLIC_API_URL: https://api.sparx.works
  NEXT_PUBLIC_MARKETING_URL: https://sparx.works
  # Staff app → api-rest in-cluster URL. Avoids going out through Caddy.
  SPARX_API_REST_URL: http://api-rest.sparx-prod.svc.cluster.local:3000
  # api-rest → staff-app in-cluster URL, used ONLY for the two internal
  # service-to-service calls that must run where Better Auth lives: partner
  # account provisioning (POST /api/internal/partner-provision, docs/114 §B.2)
  # and staff password reset (POST /api/internal/user-password-reset). Better
  # Auth now lives in the workbench (it replaced the dashboard), so this points
  # at the workbench Service. Authenticated with the shared
  # SPARX_INTERNAL_JWT_SECRET (already in sparx-app-secrets). Private ClusterIP
  # address, distinct from the browser-facing app origin. NOTE: the var name is
  # legacy (predates the dashboard→workbench cutover); its value is the workbench.
  SPARX_DASHBOARD_INTERNAL_URL: http://workbench.sparx-prod.svc.cluster.local:3000
  # PUBLIC origin of api-rest — baked into rendered email media URLs (logos,
  # product images), which resolve via GET /v1/public/media/:id (a REST-only
  # route; GraphQL at graphql.sparx.works doesn't serve bytes). Distinct from the
  # internal SPARX_API_REST_URL, which is unreachable from a mail client/browser.
  SPARX_PUBLIC_API_REST_URL: https://api.sparx.works
  # Media storage. Bucket names match terraform/modules/storage:
  #   GCS_MEDIA_BUCKET        → private bucket — originals
  #   GCS_MEDIA_PUBLIC_BUCKET → public bucket — variants
  #
  # Both buckets are private at the GCS layer (org enforces DRS / no
  # allUsers bindings). Variant bytes are served via api-rest's
  # `GET /v1/public/media/variants/:tenantId/:assetId/:filename` route
  # which streams from GCS using the app SA. Cloudflare in front of
  # api.sparx.works caches the response indefinitely (Cache-Control:
  # public, immutable, max-age=1yr).
  #
  # MEDIA_PUBLIC_URL is the externally-reachable origin used to mint
  # variant URLs (`{MEDIA_PUBLIC_URL}/v1/public/media/variants/...`).
  # media.sparx.works is a Caddy host-match that proxies to api-rest, but
  # CF caches it for a year so the origin only sees a sliver of traffic.
  # The route handler is identical to api.sparx.works, so the path stays
  # the same — only the externally-minted URL prefix changes.
  GCS_MEDIA_BUCKET: sparxworks-sparx-prod-media
  GCS_MEDIA_PUBLIC_BUCKET: sparxworks-sparx-prod-media-public
  MEDIA_PUBLIC_URL: https://media.sparx.works
  # Outbound email — email-worker reads SPARX_EMAIL_PROVIDER and either
  # logs (console) or POSTs to Postal (postal). Flip to "postal" once
  # the postal-api-key secret in sparx-app-secrets is populated.
  #
  # SPARX_POSTAL_URL points at the in-cluster Postal Web service —
  # avoids going out through Caddy + Cloudflare for a hop the worker
  # makes constantly.
  SPARX_EMAIL_PROVIDER: console
  SPARX_POSTAL_URL: http://postal-web.postal.svc.cluster.local:5000
  # Live Chat (docs/56, docs/69 A-2) — the in-cluster Redis StatefulSet
  # (k8s/redis, sparx-prod) backs the socket.io adapter so a chat message
  # delivered to one api-rest replica fans out to chat sockets on every other
  # replica. Unset → in-memory adapter (single-instance only). Caddy's
  # reverse_proxy on api.sparx.works upgrades /ws/chat transparently — no
  # Caddyfile change needed.
  REDIS_URL: redis://redis.sparx-prod.svc.cluster.local:6379
  # Web Push (docs/69 A-6) — the VAPID PUBLIC key. NOT a secret (it's handed to
  # every browser at subscribe time). The dashboard settings page reads this at
  # runtime and passes it to the opt-in toggle; push-worker also needs it (set
  # there via Terraform env). The matching VAPID_PRIVATE_KEY lives in
  # sparx-app-secrets / Secret Manager. Generate a pair once with
  # `npx web-push generate-vapid-keys`; paste the public key here, then re-apply
  # via `bootstrap app-env`. Empty → the toggle shows "not configured yet".
  VAPID_PUBLIC_KEY: 'BBpWC4B-khWME-4XJO2ubCXo9vqZYEMIz3b21Ef2J3VruF6bldk7u8V5a4urFPG5V6uEZlRlSipfjrUJVzBMcvs'
  LOG_LEVEL: info
  # Platform dogfood tenant (docs/80 §2) — Sparx/WizeWorks running as a
  # tenant-of-record. SPARX_PLATFORM_TENANT_ID is the IMMUTABLE tenant UUID allowed
  # to claim a reserved brand slug (the carve-out in api-rest PATCH /v1/tenant/slug).
  # Keyed on the id so it stays valid across the korous-store → wizeworks rename.
  # FILL with the korous-store tenant id BEFORE doing the rename; empty → carve-out
  # off (safe default — reserved slugs blocked for everyone).
  SPARX_PLATFORM_TENANT_ID: 1bfef66a-a489-4e0f-99fd-f041adc7ffaa
  # The slug the sparx/apps/web /early waitlist writes into
  # (POST /v1/public/newsletter?tenant=…) — the final brand slug after the rename.
  SPARX_PLATFORM_TENANT_SLUG: wizeworks
  # Meta review-gated social features (wizeworks/packages/social/src/adapters/_meta.ts).
  # Each flag turns its feature ON *and* adds its scopes to the connect-time OAuth
  # request. NOT secrets — they are on/off switches, not credentials.
  #
  # These must be 'true' BEFORE the Meta App Review submission, not after it: Meta
  # will not approve a permission until the app has made one successful call with
  # it, and that call is impossible while the scope goes unrequested. With the app
  # unpublished this is safe — Standard Access grants an app admin the app's
  # configured permissions on their own Pages/IG accounts, which is exactly what
  # produces the required test call.
  #
  # META_INBOX_ENABLED  → pages_read_user_content, pages_manage_engagement,
  #                       instagram_manage_comments (the engagement inbox).
  # META_INSIGHTS_ENABLED → read_insights, instagram_manage_insights (post reach +
  #                       impressions). Like/comment counts ride pages_read_engagement
  #                       and keep working regardless.
  META_INBOX_ENABLED: 'true'
  META_INSIGHTS_ENABLED: 'true'
  # The same review-gated shape for the two platforms whose analytics scope is granted
  # SEPARATELY from their posting scope. Both widen the scope requested at CONNECT, so a
  # token minted while the flag is off can never read metrics later — flip the flag, then
  # have the tenant reconnect. Left OFF until each review clears, because requesting an
  # ungranted scope fails the whole authorize call and would break posting too.
  #
  # THREADS_INSIGHTS_ENABLED → threads_manage_insights. Threads is its own Meta app with
  #                       its own review, so it does NOT ride META_INSIGHTS_ENABLED.
  #                       Unlike Facebook/Instagram there is no counts-vs-insights split:
  #                       every per-post number comes from this one scope.
  # TIKTOK_INSIGHTS_ENABLED → video.list. Separate from video.publish in TikTok's app
  #                       review; without it a published video reports no numbers at all.
  THREADS_INSIGHTS_ENABLED: 'false'
  TIKTOK_INSIGHTS_ENABLED: 'false'
  # Pinterest Trial-access apps CANNOT create Pins in production (`api.pinterest.com`
  # returns 403 "use API Sandbox instead"). PINTEREST_SANDBOX routes token exchange + all
  # Pinterest API calls to api-sandbox.pinterest.com so a Trial app can create (sandbox)
  # Pins — needed to record the demo video the Standard-access upgrade requires. NOT a
  # secret (an on/off switch). MUST mirror the social-worker Terraform env_vars: THIS
  # plane (api-rest) does the OAuth token exchange during reconnect; the worker does the
  # publish. Flip to 'false' once Standard access is granted.
  PINTEREST_SANDBOX: 'true'
