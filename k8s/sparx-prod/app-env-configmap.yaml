# sparx-app-env — non-secret runtime env shared by api-rest, dashboard,
# and future @sparx services. Secrets (DATABASE_URL, JWT secret, Stripe
# keys, etc.) live in `sparx-app-secrets` and are synced from GCP Secret
# Manager via k8s/scripts/sync-secrets.ps1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sparx-app-env
  namespace: sparx-prod
data:
  # Where pods publish events. Empty / absent disables Pub/Sub (dev path).
  # The api-rest publisher uses one topic per EventType (topic name == event
  # type) — no shared/fan-out topic, so there is no PUBSUB_TOPIC to set.
  GCP_PROJECT_ID: sparxworks
  # Better Auth / the workbench (the staff app at app.sparx.works) need the
  # canonical public origin so the OAuth/session cookies scope correctly. NOT a
  # secret.
  BETTER_AUTH_URL: https://app.sparx.works
  # MCP OAuth (docs/07 §5). MCP_RESOURCE_URL is the canonical resource
  # identifier of the MCP server (the audience OAuth tokens target); the
  # workbench validates it at consent + advertises it, and api-mcp echoes it in
  # its protected-resource metadata. MCP_AUTH_SERVER_URL is the authorization
  # server (the workbench / Better Auth origin at app.sparx.works) that api-mcp
  # points clients at. NOT secrets. (AUTH_DATABASE_URL, used by api-mcp to
  # introspect OAuth tokens as sparx_owner, lives in sparx-app-secrets alongside
  # the other DB URLs.)
  MCP_RESOURCE_URL: https://mcp.sparx.works/mcp
  MCP_AUTH_SERVER_URL: https://app.sparx.works
  # Site MCP (docs/113) — the shopper-facing MCP plane (mcp-site).
  # Its canonical public origin, used only to build discovery URLs. The service
  # otherwise reads SPARX_API_REST_URL (below) to reach the public REST API.
  SITE_MCP_PUBLIC_ORIGIN: https://mcp.sparx.zone
  # Customer (Layer 2 shopper) Better Auth instance — runs INSIDE api-rest
  # (docs/27 v2). CUSTOMER_AUTH_URL is api-rest's PUBLIC https origin: Better Auth
  # builds absolute URLs from it and (crucially) derives the cookie Secure prefix
  # from its protocol, so it MUST be https in prod. The matching CUSTOMER_AUTH_SECRET
  # (distinct from BETTER_AUTH_SECRET) lives in sparx-app-secrets. NOT a secret.
  CUSTOMER_AUTH_URL: https://api.sparx.works
  CUSTOMER_MCP_LOGIN_PAGE: /account/login
  NEXT_PUBLIC_APP_URL: https://app.sparx.works
  NEXT_PUBLIC_API_URL: https://api.sparx.works
  NEXT_PUBLIC_MARKETING_URL: https://sparx.works
  # Staff app → api-rest in-cluster URL. Avoids going out through Caddy.
  SPARX_API_REST_URL: http://api-rest.sparx-prod.svc.cluster.local:3000
  # api-rest → staff-app in-cluster URL, used ONLY for the two internal
  # service-to-service calls that must run where Better Auth lives: partner
  # account provisioning (POST /api/internal/partner-provision, docs/114 §B.2)
  # and staff password reset (POST /api/internal/user-password-reset). Better
  # Auth now lives in the workbench (it replaced the dashboard), so this points
  # at the workbench Service. Authenticated with the shared
  # SPARX_INTERNAL_JWT_SECRET (already in sparx-app-secrets). Private ClusterIP
  # address, distinct from the browser-facing app origin. NOTE: the var name is
  # legacy (predates the dashboard→workbench cutover); its value is the workbench.
  SPARX_DASHBOARD_INTERNAL_URL: http://workbench.sparx-prod.svc.cluster.local:3000
  # PUBLIC origin of api-rest — baked into rendered email media URLs (logos,
  # product images), which resolve via GET /v1/public/media/:id (a REST-only
  # route; GraphQL at graphql.sparx.works doesn't serve bytes). Distinct from the
  # internal SPARX_API_REST_URL, which is unreachable from a mail client/browser.
  SPARX_PUBLIC_API_REST_URL: https://api.sparx.works
  # Media storage. Bucket names match terraform/modules/storage:
  #   GCS_MEDIA_BUCKET        → private bucket — originals
  #   GCS_MEDIA_PUBLIC_BUCKET → public bucket — variants
  #
  # Both buckets are private at the GCS layer (org enforces DRS / no
  # allUsers bindings). Variant bytes are served via api-rest's
  # `GET /v1/public/media/variants/:tenantId/:assetId/:filename` route
  # which streams from GCS using the app SA. Cloudflare in front of
  # api.sparx.works caches the response indefinitely (Cache-Control:
  # public, immutable, max-age=1yr).
  #
  # MEDIA_PUBLIC_URL is the externally-reachable origin used to mint
  # variant URLs (`{MEDIA_PUBLIC_URL}/v1/public/media/variants/...`).
  # media.sparx.works is a Caddy host-match that proxies to api-rest, but
  # CF caches it for a year so the origin only sees a sliver of traffic.
  # The route handler is identical to api.sparx.works, so the path stays
  # the same — only the externally-minted URL prefix changes.
  GCS_MEDIA_BUCKET: sparxworks-sparx-prod-media
  GCS_MEDIA_PUBLIC_BUCKET: sparxworks-sparx-prod-media-public
  MEDIA_PUBLIC_URL: https://media.sparx.works
  # Outbound email — email-worker reads SPARX_EMAIL_PROVIDER and either
  # logs (console) or POSTs to Postal (postal). Flip to "postal" once
  # the postal-api-key secret in sparx-app-secrets is populated.
  #
  # SPARX_POSTAL_URL points at the in-cluster Postal Web service —
  # avoids going out through Caddy + Cloudflare for a hop the worker
  # makes constantly.
  SPARX_EMAIL_PROVIDER: console
  SPARX_POSTAL_URL: http://postal-web.postal.svc.cluster.local:5000
  # Live Chat (docs/56, docs/69 A-2) — the in-cluster Redis StatefulSet
  # (k8s/redis, sparx-prod) backs the socket.io adapter so a chat message
  # delivered to one api-rest replica fans out to chat sockets on every other
  # replica. Unset → in-memory adapter (single-instance only). Caddy's
  # reverse_proxy on api.sparx.works upgrades /ws/chat transparently — no
  # Caddyfile change needed.
  REDIS_URL: redis://redis.sparx-prod.svc.cluster.local:6379
  # Web Push (docs/69 A-6) — the VAPID PUBLIC key. NOT a secret (it's handed to
  # every browser at subscribe time). The dashboard settings page reads this at
  # runtime and passes it to the opt-in toggle; push-worker also needs it (set
  # there via Terraform env). The matching VAPID_PRIVATE_KEY lives in
  # sparx-app-secrets / Secret Manager. Generate a pair once with
  # `npx web-push generate-vapid-keys`; paste the public key here, then re-apply
  # via `bootstrap app-env`. Empty → the toggle shows "not configured yet".
  VAPID_PUBLIC_KEY: 'BBpWC4B-khWME-4XJO2ubCXo9vqZYEMIz3b21Ef2J3VruF6bldk7u8V5a4urFPG5V6uEZlRlSipfjrUJVzBMcvs'
  LOG_LEVEL: info
  # Platform dogfood tenant (docs/80 §2) — Sparx/WizeWorks running as a
  # tenant-of-record. SPARX_PLATFORM_TENANT_ID is the IMMUTABLE tenant UUID allowed
  # to claim a reserved brand slug (the carve-out in api-rest PATCH /v1/tenant/slug).
  # Keyed on the id so it stays valid across the korous-store → wizeworks rename.
  # FILL with the korous-store tenant id BEFORE doing the rename; empty → carve-out
  # off (safe default — reserved slugs blocked for everyone).
  SPARX_PLATFORM_TENANT_ID: 1bfef66a-a489-4e0f-99fd-f041adc7ffaa
  # The slug the apps/web /early waitlist writes into
  # (POST /v1/public/newsletter?tenant=…) — the final brand slug after the rename.
  SPARX_PLATFORM_TENANT_SLUG: wizeworks
  # Meta review-gated social features (packages/social/src/adapters/_meta.ts).
  # Each flag turns its feature ON *and* adds its scopes to the connect-time OAuth
  # request. NOT secrets — they are on/off switches, not credentials.
  #
  # These must be 'true' BEFORE the Meta App Review submission, not after it: Meta
  # will not approve a permission until the app has made one successful call with
  # it, and that call is impossible while the scope goes unrequested. With the app
  # unpublished this is safe — Standard Access grants an app admin the app's
  # configured permissions on their own Pages/IG accounts, which is exactly what
  # produces the required test call.
  #
  # META_INBOX_ENABLED  → pages_read_user_content, pages_manage_engagement,
  #                       instagram_manage_comments (the engagement inbox).
  # META_INSIGHTS_ENABLED → read_insights, instagram_manage_insights (post reach +
  #                       impressions). Like/comment counts ride pages_read_engagement
  #                       and keep working regardless.
  META_INBOX_ENABLED: 'true'
  META_INSIGHTS_ENABLED: 'true'
