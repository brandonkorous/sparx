# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-worker
  namespace: sparx-prod
  labels: { app: social-worker, tier: worker }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # maxSurge 0: replace in place, never run two.
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: social-worker }
  template:
    metadata:
      labels: { app: social-worker, tier: worker }
    spec:
      enableServiceLinks: false
      containers:
        - name: social-worker
          image: sparx/social-worker:local
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: sparx-app-env }
            - secretRef: { name: sparx-app-secrets }
          env:
            - { name: NODE_ENV, value: production }
            - { name: SERVICE_NAME, value: social-worker }
            - { name: PORT, value: '8080' }
            # URL-fetch platforms (Instagram/Threads/Pinterest) hand THEIR
            # servers this URL to fetch. Unchanged from prod — but the hostname
            # now earns its name a different way: it was grey-cloud DNS-only so
            # fetchers bypassed Cloudflare and its 206-to-ranged-requests, and a
            # tunnel carries only proxied hostnames so that bypass is gone.
            # cloudflare/media-direct-worker/ restores the guarantee at the edge
            # instead, by stripping `Range` ahead of the cache. Requires that
            # Worker to be deployed — without it, images silently drop from
            # Instagram/Threads/Pinterest posts and they publish text-only.
            - { name: MEDIA_DIRECT_BASE_URL, value: 'https://media-direct.sparx.works' }
          startupProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: social-worker
  namespace: sparx-prod
spec:
  type: ClusterIP
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
  selector: { app: social-worker }
