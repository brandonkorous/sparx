# The worker fleet: THREE Deployments, not fourteen.
#
# WHAT CHANGED AND WHY. There used to be fourteen worker Deployments, one per
# handler. That was not a design — it was inherited from Cloud Run, where each
# worker HAD to be its own service (a container behind a Pub/Sub push
# subscription, scaled to zero, billed per request). Fourteen idle services cost
# the same as one there. On a fixed 8 GiB node they cost 2.15 GiB — fourteen Node
# runtimes at ~153 MiB of baseline heap each, 37% of the node, to do 14
# millicores of work between them. On 2026-08-08 the node ran out of memory,
# evicted api-rest, and the platform served 502s for twelve hours.
#
# The split bought nothing that was being collected: every Deployment was
# `replicas: 1` (no independent scaling), the release builds and rolls every
# image on one SHA (no independent deploy), and only media-worker had a distinct
# runtime. Twelve of them are now handlers inside `event-worker`, each keeping
# its own JetStream durable name so no consumer cursor moved. The reasoning in
# full is in services/event-worker/src/index.ts.
#
# WHY THESE TWO STAYED OUT. Merging trades process isolation for memory, so the
# two most likely to need isolation kept it: media-worker runs sharp over image
# buffers AND is the only worker with a volume; import-worker parses whole
# uploaded files. A leak or a hard crash in either would otherwise take email
# delivery, search indexing and the automation tick down with it.
#
# PROBES. event-worker serves a real `GET /healthz`, so its probes are httpGet.
# The other two are still raw POST-only `node:http` servers with no GET route —
# an httpGet probe would fail on a perfectly healthy pod — so they stay
# tcpSocket. That asymmetry is the reason, not an oversight.
#
# `sparx/<name>:local` image names are placeholders that BOTH overlays rewrite
# (k8s/local to itself, k8s/azure to GHCR). There is deliberately no
# `imagePullPolicy` here: this file is shared, and `Never` — right for a
# workstation reading Docker Desktop's own image store — makes every pod in a
# real cluster fail ErrImageNeverPull with nothing to pull from. The workstation
# case sets it in k8s/local/kustomization.yaml, where it belongs.
#
# RESOURCES. media-worker and import-worker carry none on purpose: they are idle
# almost always, `requests` are what the SCHEDULER reserves rather than what a
# process uses, and reserving for idleness is how a node fills up with nothing.
# Omitting BOTH requests and limits is what makes them BestEffort — you cannot
# keep a limit and drop the request, because Kubernetes defaults a missing
# request to the matching limit and silently reserves it anyway. BestEffort pods
# are evicted first, which is the right pod class to sacrifice for a stateless
# consumer whose in-flight message is redelivered.
#
# event-worker is the exception, and deliberately so. It is no longer one idle
# handler among fourteen; it is every handler the platform has. Leaving it
# BestEffort would put the whole event pipeline first in line for eviction — the
# exact failure this consolidation exists to stop. Its request is what it
# actually uses, so the scheduler stops believing the node has room it does not.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-worker
  namespace: sparx-prod
  labels: { app: event-worker, tier: worker }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # maxSurge 0: replace in place, NEVER run two. Two pods would mean two
    # consumers bound to each of the twelve durables, splitting every stream
    # between them mid-message.
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: event-worker }
  template:
    metadata:
      labels: { app: event-worker, tier: worker }
    spec:
      enableServiceLinks: false
      # Twelve consumers to drain rather than one. The process gives itself a
      # 25s deadline (see src/index.ts), so the pod needs more than that before
      # SIGKILL — the 30s default leaves no margin.
      terminationGracePeriodSeconds: 40
      containers:
        - name: event-worker
          image: sparx/event-worker:local
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: sparx-app-env }
            - secretRef: { name: sparx-app-secrets }
          env:
            - { name: NODE_ENV, value: production }
            - { name: SERVICE_NAME, value: event-worker }
            - { name: PORT, value: '8080' }
          resources:
            requests: { memory: 320Mi, cpu: 50m }
            # No CPU limit — CPU is compressible, so a cap only throttles the
            # cold start. The memory limit is what protects the node.
            limits: { memory: 1Gi }
          startupProbe:
            # Twelve subscriptions are established before the process reports
            # ready, so first boot is slower than a single-handler worker was.
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: event-worker
  namespace: sparx-prod
spec:
  type: ClusterIP
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
  selector: { app: event-worker }
---
# ---------------------------------------------------------------------------
# media-worker — media.uploaded
#
# The ONLY worker with a volume. It transcodes uploads into variants and must
# write to the SAME local-disk media root api-rest streams from, since
# GCS_MEDIA_BUCKET is unset and packages/media falls back to LocalStorage.
# Mismatch here = uploads that transcode successfully and then 404 forever.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-worker
  namespace: sparx-prod
  labels: { app: media-worker, tier: worker }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # RWO PersistentVolume: the replacement pod cannot attach the volume while
    # the outgoing one still holds it, so a RollingUpdate deadlocks.
    type: Recreate
  selector:
    matchLabels: { app: media-worker }
  template:
    metadata:
      labels: { app: media-worker, tier: worker }
    spec:
      enableServiceLinks: false
      containers:
        - name: media-worker
          image: sparx/media-worker:local
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: sparx-app-env }
            - secretRef: { name: sparx-app-secrets }
          env:
            - { name: NODE_ENV, value: production }
            - { name: SERVICE_NAME, value: media-worker }
            - { name: PORT, value: '8080' }
          volumeMounts:
            - { name: media, mountPath: /media }
          startupProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: sparx-media
---
apiVersion: v1
kind: Service
metadata:
  name: media-worker
  namespace: sparx-prod
spec:
  type: ClusterIP
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
  selector: { app: media-worker }
---
# ---------------------------------------------------------------------------
# import-worker — import.job.created
#
# api-rest accepts a CSV from four routes (commerce products, commerce
# customers, b2b accounts, crm), writes an ImportJob at `status: 'pending'`,
# publishes, and returns 202. THIS is what moves the job off pending. It had no
# Deployment on any provider, so every import a tenant submitted was accepted
# and never processed.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: import-worker
  namespace: sparx-prod
  labels: { app: import-worker, tier: worker }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # maxSurge 0: replace in place, never run two. Two consumers on one durable
    # would split the stream between them mid-import.
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: import-worker }
  template:
    metadata:
      labels: { app: import-worker, tier: worker }
    spec:
      enableServiceLinks: false
      containers:
        - name: import-worker
          image: sparx/import-worker:local
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: sparx-app-env }
            - secretRef: { name: sparx-app-secrets }
          env:
            - { name: NODE_ENV, value: production }
            - { name: SERVICE_NAME, value: import-worker }
            - { name: PORT, value: '8080' }
          startupProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: import-worker
  namespace: sparx-prod
spec:
  type: ClusterIP
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
  selector: { app: import-worker }
