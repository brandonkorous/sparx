# ---------------------------------------------------------------------------
# media-worker — media.uploaded
#
# The ONLY worker with a volume. It transcodes uploads into variants and must
# write to the SAME local-disk media root api-rest streams from, since
# GCS_MEDIA_BUCKET is unset and packages/media falls back to LocalStorage.
# Mismatch here = uploads that transcode successfully and then 404 forever.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-worker
  namespace: sparx-prod
  labels: { app: media-worker, tier: worker }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # RWO PersistentVolume: the replacement pod cannot attach the volume while
    # the outgoing one still holds it, so a RollingUpdate deadlocks.
    type: Recreate
  selector:
    matchLabels: { app: media-worker }
  template:
    metadata:
      labels: { app: media-worker, tier: worker }
    spec:
      enableServiceLinks: false
      containers:
        - name: media-worker
          image: sparx/media-worker:local
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: sparx-app-env }
            - secretRef: { name: sparx-app-secrets }
          env:
            - { name: NODE_ENV, value: production }
            - { name: SERVICE_NAME, value: media-worker }
            - { name: PORT, value: '8080' }
          volumeMounts:
            - { name: media, mountPath: /media }
          startupProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: sparx-media
---
apiVersion: v1
kind: Service
metadata:
  name: media-worker
  namespace: sparx-prod
spec:
  type: ClusterIP
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
  selector: { app: media-worker }
---
