# The 11 workers that ran on Cloud Run (terraform/envs/prod/serverless.tf),
# moved into the cluster as ordinary Deployments.
#
# Nothing in the worker SOURCE changes. On Cloud Run each one was a container
# behind a Pub/Sub push subscription; here it is a container behind a ClusterIP
# Service, receiving the identical push envelope from the api-rest publisher via
# SPARX_DEV_WORKER_ROUTES (see app-env-configmap.env). Same HTTP contract, same
# handler, different sender.
#
# WHAT IS LOST relative to Pub/Sub: the broker. No retry, no dead-letter queue,
# no at-least-once delivery, no backlog while a worker restarts. The publisher
# fires and forgets. This is the one place the local deployment is genuinely
# weaker than GKE + Cloud Run, and it is called out again in README.md rather
# than buried here.
#
# Probes are tcpSocket, not httpGet: these are raw `node:http` servers
# (services/*/src/index.ts `createServer`) that handle POST and have no GET
# health route, so an httpGet probe would fail on a perfectly healthy worker.
#
# The `sparx/<name>:local` image names are placeholders that BOTH overlays
# rewrite (k8s/local to itself, k8s/azure to GHCR). There is deliberately no
# `imagePullPolicy` here: this file is shared, and `Never` — which is right for
# a workstation reading Docker Desktop's own image store — makes every pod in a
# real cluster fail ErrImageNeverPull with nothing to pull from. The workstation
# case sets it in k8s/local/kustomization.yaml, where it belongs.
#
# NO `resources` BLOCK ANYWHERE IN THIS FILE — deliberate, on a 16GB host.
#
# `requests` are what the SCHEDULER reserves; the sum of every request on the
# node must fit in allocatable memory or pods simply never schedule, however
# little they actually use. These 11 workers are event-driven and idle
# essentially all the time — a Node process parked on an HTTP listener sits
# around 50-80MB RSS — so reserving 512Mi-1Gi each was reserving ~7GB to do
# nothing. Omitting requests lets them take what they really need.
#
# The non-obvious part: you cannot keep a `limits` block and drop `requests`.
# Kubernetes DEFAULTS a missing request to the value of the matching limit, so
# `limits: {memory: 512Mi}` alone silently reserves 512Mi anyway. Getting a true
# no-minimum pod means omitting BOTH — which is what makes these BestEffort QoS.
#
# The trade that buys: under memory pressure the kubelet evicts BestEffort pods
# FIRST. That is the correct pod class to sacrifice here — a worker is
# stateless, restarts in seconds, and its event delivery is already
# fire-and-forget (see app-env-configmap.env), so an eviction costs at most the
# event in flight. The data services in infra.yaml keep real requests precisely
# so they are never the thing that gets killed.
#
# Editors will flag "containers do not have resources" on every pod here. That
# warning is correct in general and wrong for this file.

# ---------------------------------------------------------------------------
# email-worker — email.send
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-worker
  namespace: sparx-prod
  labels: { app: email-worker, tier: worker }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # maxSurge 0: replace in place, never run two.
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: email-worker }
  template:
    metadata:
      labels: { app: email-worker, tier: worker }
    spec:
      enableServiceLinks: false
      containers:
        - name: email-worker
          image: sparx/email-worker:local
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: sparx-app-env }
            - secretRef: { name: sparx-app-secrets }
          env:
            - { name: NODE_ENV, value: production }
            - { name: SERVICE_NAME, value: email-worker }
            - { name: PORT, value: '8080' }
          startupProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: email-worker
  namespace: sparx-prod
spec:
  type: ClusterIP
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
  selector: { app: email-worker }
---
