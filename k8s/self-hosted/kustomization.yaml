# Shared worker fleet — the parts of a self-hosted deployment that are identical
# whether the cluster runs on a workstation or in a managed cloud.
#
# WHY THIS EXISTS AS A BASE rather than living in one overlay: kustomize will not
# let an overlay reference an individual FILE outside its own directory, only a
# directory with a kustomization. So `k8s/azure` could not borrow `workers.yaml`
# from `k8s/local` — it would need a copy, and two copies drift the first time
# either is edited.
#
# WHAT LEFT THIS DIRECTORY, and why:
#
#   Caddyfile + caddy.yaml → k8s/ingress. They were a SECOND copy of the routing
#   table, forked from k8s/caddy/Caddyfile to strip TLS for the tunnel. The two
#   had already drifted — this copy silently dropped kanninja.com, silicaui.com
#   and admin.wize.works — which is exactly the failure this base was created to
#   prevent, reproduced one level up. There is now one Caddyfile, parameterised
#   by two env vars, and no deployment owns a copy of it.
#
#   cloudflared.yaml → k8s/local. A tunnel answers "this cluster has no public
#   IP", which is true of a laptop and false of every managed cluster. Shipping
#   it in the shared base is what made the tunnel look like the platform's
#   ingress rather than a workstation accommodation.
#
# What belongs here: workloads whose content does NOT depend on where the
# cluster runs. What does NOT: images, storage classes, the app env ConfigMap,
# the backing data services, and anything that exists only because of the local
# network topology.
#
# Consumed by k8s/local (workstation) and k8s/azure (AKS).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # The worker fleet: event-worker + media-worker + import-worker. Plain
  # Deployments, no cloud coupling. It was fourteen — see workers.yaml.
  - workers.yaml
  # The event broker. Belongs in the shared base for the same reason the workers
  # do: it is byte-identical on every provider, which is precisely why NATS was
  # chosen over a managed queue.
  - nats.yaml
