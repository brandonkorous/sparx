# @sparx/web — public marketing site.
# Serves sparx.works + all the module marketing domains (sparxcms.com,
# sparxcrm.com, sparxemail.com, sparxb2b.com, sparx.email apex) via a single
# Next.js app that reads the Host header in middleware.
#
# Phase 1: 2 replicas, no DB or secrets needed. HPA omitted — bring it back
# in if marketing traffic actually justifies autoscaling.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: sparx-prod
  labels:
    app: web
    tier: api
spec:
  replicas: 1 # TEMP: SSD_TOTAL_GB quota at 235/250GB blocks scale-up; restore to 2 after quota bump
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        tier: api
    spec:
      serviceAccountName: sparx-app
      containers:
        - name: web
          image: us-central1-docker.pkg.dev/sparxworks/sparx/web:latest
          # Always — `:latest` is mutable; IfNotPresent risks a stale node-cached
          # image after a bare restart. Full rationale in api-mcp.yaml.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          # Non-secret shared config. The marketing app now makes SERVER-SIDE calls
          # to api-rest — the marketplace catalog and the /early waitlist — so it
          # needs the in-cluster SPARX_API_REST_URL + SPARX_PLATFORM_TENANT_SLUG.
          # Without this, those fetches fall back to http://localhost:3100 and fail
          # in prod. (Secrets stay out — the marketing app needs none.)
          envFrom:
            - configMapRef:
                name: sparx-app-env
          env:
            - name: NODE_ENV
              value: production
            # The key this image was built with, so server-action ids match across releases (SI-2).
            # Optional: without the NEXT_ACTIONS_KEY_WEB secret, Next uses the key baked into the build.
            - name: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: sparx-app-secrets
                  key: NEXT_ACTIONS_KEY_WEB
                  optional: true
            # WizeLens: send-only tracing to WizeLens Cloud. With NODE_ENV=production
            # the add-on serves no dashboard or read API; it only sends. The ingest
            # key is per app (vault `wizelens-key-web`); optional, so a missing key
            # leaves the app running and untraced in the cloud rather than failing.
            - name: WIZELENS_ENABLED
              value: 'true'
            - name: WIZELENS_HUB
              value: https://app.wizelens.com
            - name: WIZELENS_SAMPLE_RATE
              value: '0.25'
            - name: WIZELENS_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sparx-app-secrets
                  key: WIZELENS_KEY_WEB
                  optional: true
            - name: PORT
              value: '3000'
            - name: HOSTNAME
              value: '0.0.0.0'
            - name: NEXT_TELEMETRY_DISABLED
              value: '1'
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
            limits:
              cpu: '1000m'
              memory: '512Mi'
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sh', '-c', 'sleep 5']
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: sparx-prod
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: sparx-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web
