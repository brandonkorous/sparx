# services/api-mcp — production manifest. Mirrors api-rest.yaml; the
# differences are:
#   - Image tag `api-mcp`
#   - Hosts mcp.sparx.works via the Caddy reverse-proxy (configmap.yaml)
#   - Phase-1 cap at 2 replicas matches api-rest (api-mcp throughput is
#     proportional to MCP tool calls — early-stage volume is low)
#
# Pod env hydrates from the same sparx-app-env / sparx-app-secrets that
# api-rest uses. SPARX_INTERNAL_JWT_SECRET is shared so dashboard-issued
# JWTs accepted by api-rest are also accepted here.
#
# UNPARKED — 2026-06-10. Running at a single replica now that the
# SSD_TOTAL_GB quota that forced the 2026-05-29 parking is resolved (the
# regional limit was raised from 250GB to ~41TB; current usage ~420GB). The
# pod is stateless (no PVC), so one replica schedules comfortably.
#
# HPA + PDB are deliberately still omitted at one replica: an HPA needs room
# above the floor to do anything, and a PodDisruptionBudget with
# minAvailable: 1 against a single replica would block every voluntary node
# drain (Autopilot reschedules constantly). bootstrap.yml still deletes any
# leftover api-mcp HPA/PDB — now a harmless no-op. To scale out later: raise
# replicas, re-add an HPA (minReplicas: 1, maxReplicas: 2, CPU 70% like
# api-rest) + PDB (minAvailable: 1), and drop those bootstrap delete steps.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-mcp
  namespace: sparx-prod
  labels:
    app: api-mcp
    tier: api
spec:
  replicas: 1 # unparked 2026-06-10 (SSD quota resolved); single replica, no HPA
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-mcp
  template:
    metadata:
      labels:
        app: api-mcp
        tier: api
    spec:
      serviceAccountName: sparx-app
      containers:
        - name: api-mcp
          image: us-central1-docker.pkg.dev/sparxworks/sparx/api-mcp:latest
          # `:latest` is a MUTABLE tag. With IfNotPresent a node reuses whatever
          # it cached for `:latest`, which can be stale — a bare `rollout restart`
          # (e.g. from `bootstrap app-env`) that reschedules onto a node holding an
          # older `:latest` silently resurrects pre-release code. That bit api-mcp
          # on 2026-07-03 (served pre-`/mcp`-rename code after a configmap roll).
          # `Always` re-resolves the tag to the registry's current digest on every
          # pod start; the immutable `:vX.Y.Z` tags deploy-prod pins re-check
          # cheaply (no layer re-pull when the digest is unchanged). Deterministic
          # releases still come from deploy-prod's version pin — this only makes the
          # `:latest` bootstrap fallback safe instead of a footgun.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: sparx-app-env
            - secretRef:
                name: sparx-app-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: SERVICE_NAME
              value: api-mcp
            - name: PORT
              value: '3000'
            - name: LOG_LEVEL
              value: info
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: '100m'
              memory: '512Mi'
            limits:
              cpu: '1000m'
              memory: '512Mi'
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sh', '-c', 'sleep 10']
---
apiVersion: v1
kind: Service
metadata:
  name: api-mcp
  namespace: sparx-prod
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: api-mcp
# HorizontalPodAutoscaler + PodDisruptionBudget removed while parked:
# stable HPA requires minReplicas >= 1, and a PDB with minAvailable: 1
# against 0 replicas would block every voluntary disruption in the
# namespace. bootstrap.yml deletes any leftover api-mcp HPA/PDB from the
# cluster so the parked state stays consistent across re-applies.
