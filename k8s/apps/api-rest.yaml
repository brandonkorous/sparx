# services/api-rest — production manifest. Mirrors the api-rest.example.yaml
# template; differences from the template:
#   - PORT is set to 3000 (Fastify env default)
#   - Health probe path /health (no envelope — see src/routes/health.ts)
#   - Image is substituted at deploy time by the GitHub Actions workflow
#
# Pod env hydrates from the same sparx-app-env / sparx-app-secrets that the
# dashboard and other services use. The internal-trust JWT secret +
# Pub/Sub project id are expected to be in sparx-app-secrets:
#   - SPARX_INTERNAL_JWT_SECRET — shared with dashboard for the JWT bridge
#   - SPARX_INTERNAL_FURNISH_TOKEN — shared with the app that runs signup; gates
#     POST /internal/tenant/furnish. Unset → 401, which stops onboarding rather
#     than letting businesses arrive unfurnished and look normal.
#   - GCP_PROJECT_ID            — enables the real Pub/Sub publisher
#   - PUBSUB_TOPIC              — defaults to sparx.events
#
# DATABASE_URL is also resolved from sparx-app-secrets and points at the
# in-cluster PgBouncer service. RLS GUCs are set per-request inside the
# service.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-rest
  namespace: sparx-prod
  labels:
    app: api-rest
    tier: api
spec:
  replicas: 2 # 2 for HA: a single replica meant a rolling update ran the lone pod at
  # peak while its replacement started, exhausting the shared PgBouncer pool (P2028,
  # 2026-07-04). SSD_TOTAL_GB quota is no longer a constraint (limit 40960GB, ~320 used).
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-rest
  template:
    metadata:
      labels:
        app: api-rest
        tier: api
    spec:
      serviceAccountName: sparx-app
      # Disable Kubernetes' deprecated Docker-era "service link" env injection. For
      # every Service in the namespace k8s otherwise injects `<SVC>_SERVICE_HOST`,
      # `<SVC>_SERVICE_PORT`, and `<SVC>_PORT=tcp://<clusterIP>:<port>`. That last one
      # collided with the app's own `TYPESENSE_PORT` (a Service named `typesense`
      # exists) and shadowed it → the search client built `http://typesense:null/...`
      # and every storefront `/shop` + search 500'd (BUG-003). We reach all in-cluster
      # dependencies by DNS name + explicit env, never by these link vars, so turning
      # the injection off is free and removes this whole class of collision.
      enableServiceLinks: false
      containers:
        - name: api-rest
          image: us-central1-docker.pkg.dev/sparxworks/sparx/api-rest:latest
          # Always — `:latest` is mutable; IfNotPresent risks a stale node-cached
          # image after a bare restart. Full rationale in api-mcp.yaml.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: sparx-app-env
            - secretRef:
                name: sparx-app-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: SERVICE_NAME
              value: api-rest
            - name: PORT
              value: '3000'
            - name: LOG_LEVEL
              value: info
            # api-rest loads its ~50-package workspace graph at boot via runtime
            # tsx (no precompiled bundle), so its boot heap outgrew Node's default
            # cgroup-derived ceiling (~256MB in a 512Mi container) and the process
            # died with "JavaScript heap out of memory" before Fastify listened
            # (crash-looped every rollout since ~v1.151). Reclaim the container
            # memory Node was leaving unused: cap old-space at 384MB (75% of the
            # 512Mi limit; ~128MB left for tsx's transpiled sources + native
            # buffers). If boot still OOMs at 384, 512Mi is genuinely too small —
            # raise the memory limit rather than this value.
            - name: NODE_OPTIONS
              value: '--max-old-space-size=384'
            # Typesense — api-rest's /v1/search/* read path queries the
            # in-cluster Typesense (ClusterIP Service named `typesense`, the
            # @sparx/search default host). The key matches the secret
            # bootstrap.yml mints from Secret Manager's typesense-api-key. Port
            # (8108) + protocol (http) come from the @sparx/search defaults — no
            # need to pin them here now that `enableServiceLinks: false` (above)
            # stops k8s from injecting a bogus `TYPESENSE_PORT`.
            - name: TYPESENSE_HOST
              value: typesense
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: typesense-secrets
                  key: api-key
            # Search-only parent key for minting tenant-scoped browser keys
            # (GET /v1/search/key). Optional — the endpoint returns 501 if the
            # secret/key is absent. `optional: true` so api-rest still boots
            # before the key is provisioned.
            - name: TYPESENSE_SEARCH_KEY
              valueFrom:
                secretKeyRef:
                  name: typesense-secrets
                  key: search-key
                  optional: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: '100m'
              memory: '512Mi'
            limits:
              cpu: '1000m'
              memory: '512Mi'
          # timeoutSeconds is set explicitly — the k8s default is 1s, and that
          # default is what CrashLooped api-rest for 30h (v1.149.0/.1 deploys,
          # 2026-07-18, ~400 restarts, exit 137 "failed liveness probe").
          # /health is a static handler with no DB roundtrip (src/routes/health.ts),
          # so it can only exceed 1s when the event loop is stalled — which it is,
          # because this pod is guaranteed just 100m CPU on a node packed to 99%
          # of allocatable CPU requests. Ordinary public reads were taking
          # 1.5–2.2s. Restarting never recovered it: startup is the most
          # CPU-hungry phase, so each new container failed the probe again.
          # 5s tolerates event-loop stalls without masking a genuinely wedged
          # process; the liveness failureThreshold of 5 means a real hang still
          # gets killed within ~2.5min.
          # The timeout fix above stopped steady-state crashlooping, but BOOT was still
          # unprotected: liveness gave only initialDelay 30s + 5 × 30s = ~180s, and a
          # cold start on 100m CPU can exceed that on a packed node — so pods landing
          # on a busy node still died at exit 137 while their siblings came up fine
          # (seen again 2026-07-24, and it is what times out `rollout status` in
          # deploy-prod). A startupProbe is the structural fix and costs nothing: it
          # gates liveness/readiness until the app is genuinely listening. Third time
          # this class of bug has bitten (api-mcp 2026-07-03, api-rest 2026-07-18,
          # api-graphql 2026-07-24) — hence the same generous 60 × 5s = 300s window.
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sh', '-c', 'sleep 10']
---
apiVersion: v1
kind: Service
metadata:
  name: api-rest
  namespace: sparx-prod
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: api-rest
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-rest
  namespace: sparx-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-rest
  minReplicas: 2 # pinned at 2 (min == max): steady 2-replica HA, no HPA scale-up
  maxReplicas: 2 # held at 2 per request; SSD quota is no longer the constraint if burst headroom is wanted later
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-rest
  namespace: sparx-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-rest
