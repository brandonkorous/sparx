# sparx/apps/market — the first-party sparx.market storefront (docs/106 §4.7). A single-
# host public Next.js app (sparx.market) that reads the cross-tenant market_listings
# projection via api-rest's /v1/public/market/* and checks out through sparx's OWN
# platform Stripe account (merchant-of-record). Same shape as apps/site.yaml.
#
# Caddy host-matches sparx.market onto this Service.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market
  namespace: sparx-prod
  labels:
    app: market
    tier: web
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: market
  template:
    metadata:
      labels:
        app: market
        tier: web
    spec:
      serviceAccountName: sparx-app
      containers:
        - name: market
          image: us-central1-docker.pkg.dev/sparxworks/sparx/market:latest
          # Always — `:latest` is mutable; IfNotPresent risks a stale node-cached
          # image after a bare restart. Full rationale in api-mcp.yaml.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: sparx-app-env
          env:
            - name: NODE_ENV
              value: production
            - name: SERVICE_NAME
              value: market
            - name: PORT
              value: '3000'
            - name: HOSTNAME
              value: '0.0.0.0'
            - name: SPARX_API_REST_URL
              value: 'http://api-rest.sparx-prod.svc.cluster.local:3000'
            - name: SPARX_MEDIA_CDN_URL
              value: 'https://media.sparx.works'
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: '100m'
              memory: '512Mi'
            limits:
              cpu: '1000m'
              memory: '512Mi'
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sh', '-c', 'sleep 10']
---
apiVersion: v1
kind: Service
metadata:
  name: market
  namespace: sparx-prod
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: market
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: market
  namespace: sparx-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: market
  minReplicas: 1
  maxReplicas: 1 # TEMP: clamped while SSD/CPU quota tight (mirrors site)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: market
  namespace: sparx-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: market
