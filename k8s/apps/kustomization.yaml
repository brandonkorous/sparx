apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sparx-prod
resources:
  - web.yaml
  - api-rest.yaml
  - api-graphql.yaml
  - api-mcp.yaml
  - mcp-site.yaml
  # dashboard.yaml removed 2026-07-22 — the workbench replaced the dashboard at
  # app.sparx.works. `kubectl apply -k` does NOT prune the dropped Deployment;
  # run `bootstrap.yml -f components=dashboard-teardown` once to delete the
  # orphaned in-cluster resources (same pattern as storefront-teardown).
  - workbench.yaml
  - site.yaml
  - market.yaml
  # admin.yaml removed 2026-10-27 — the WizeWorks staff console ships from the
  # wizeworks repo into the `wizeworks` namespace now. The release's label-based
  # prune deletes the old Deployment and Service.
  # ── Piggles ────────────────────────────────────────────────────────────────
  # The sister brand's three surfaces. They share this namespace, the database,
  # api-rest and the secret store — the PLATFORM — and share no application code
  # (piggles/CLAUDE.md RULE #0). Removing these three lines is how Piggles gets
  # deleted, and it actually deletes: the release prunes on its ownership label,
  # so `apply` is not the no-op it would otherwise be.
  #
  # Order matters to nobody here, but it reads as the customer's journey:
  # discover → sign up → operate.
  - piggles-web.yaml
  - piggles-account.yaml
  - piggles-console.yaml
# Add per-app manifests here as they ship to Artifact Registry.
