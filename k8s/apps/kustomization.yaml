apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sparx-prod
resources:
  - web.yaml
  - api-rest.yaml
  - api-graphql.yaml
  - api-mcp.yaml
  - mcp-site.yaml
  # dashboard.yaml removed 2026-07-22 — the workbench replaced the dashboard at
  # app.sparx.works. `kubectl apply -k` does NOT prune the dropped Deployment;
  # run `bootstrap.yml -f components=dashboard-teardown` once to delete the
  # orphaned in-cluster resources (same pattern as storefront-teardown).
  - workbench.yaml
  - site.yaml
  - market.yaml
  # The WizeWorks staff console (admin.wize.works). Added 2026-08-01: it ran in
  # an out-of-band `wize-admin` namespace on GKE that was never recreated on AKS,
  # so the host passed Cloudflare Access and then 502'd at Caddy. It lives in
  # sparx-prod with everything else now.
  - admin.yaml
# Add per-app manifests here as they ship to Artifact Registry.
