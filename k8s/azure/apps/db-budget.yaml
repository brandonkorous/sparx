# Database connection budget for psql-sparx-prod-cus (B1ms: 50 max, 15 reserved, 35 usable).
# One patch per Deployment that opens Postgres. `pnpm check:db-budget` sums these against the cap.
# Per pod = DB_CONNECTION_LIMIT (sparx_app pool) + AUTH_DB_CONNECTION_LIMIT (Better Auth's sparx_owner pool).
#
#   deployment        replicas  app  auth  total
#   api-rest          2         4    1     10
#   workbench         1         2    1     3
#   piggles-console   1         2    1     3
#   piggles-account   2         1    1     4
#   api-graphql       1         1    1     2
#   api-mcp           1         1    1     2
#   event-worker      1         2    0     2
#   media-worker      1         1    0     1
#   import-worker     1         1    0     1
#   admin             1         operator-auth pg pool (code)  5
#   sum                                    33 of 35; 2 left for the role + migrate Jobs
#
# Rollouts surge past this (old and new pods overlap). PgBouncer is the real fix; see ../infra/pgbouncer.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-rest
  namespace: sparx-prod
spec:
  template:
    spec:
      containers:
        - name: api-rest
          env:
            # Per replica; two replicas share the 8 it had at one (see the api-rest patch).
            - { name: DB_CONNECTION_LIMIT, value: '4' }
            - { name: AUTH_DB_CONNECTION_LIMIT, value: '1' }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbench
  namespace: sparx-prod
spec:
  template:
    spec:
      containers:
        - name: workbench
          env:
            - { name: DB_CONNECTION_LIMIT, value: '2' }
            - { name: AUTH_DB_CONNECTION_LIMIT, value: '1' }
---
