---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: sparx-prod
spec:
  template:
    spec:
      containers:
        - name: admin
          env:
            # The operator console's pg pool (wizeworks/packages/operator-auth/src/pool-size.ts).
            - { name: OPERATOR_DB_POOL_MAX, value: '2' }
