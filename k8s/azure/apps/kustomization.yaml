# CONTAINERS — stage 3 of the release. Everything here is an image that is
# replaced wholesale on every deploy; nothing here holds state.
#
# Read ../infra/kustomization.yaml for why the split exists. The short version:
# the data stage runs Jobs that need the namespace, `sparx-app-env` and the
# `sparx-media` PVC to already exist, so those cannot live in the same overlay
# as the Deployments they are supposed to run BEFORE.
#
# What differs from the k8s/local workstation overlay:
#   1. images     → ghcr.io/brandonkorous/sparx/*, pulled from a registry rather
#                   than read out of a local Docker daemon
#   2. Postgres   → MANAGED (psql-sparx-prod-cus). No in-cluster StatefulSet.
#   3. Redis      → dropped entirely
#   4. storage    → Azure Disk via the `managed-csi` StorageClass
#   5. resources  → the node is 16 GiB with a managed database beside it (it was
#                   8 GiB until 2026-08-21), so the apps get more headroom than on
#                   a 16 GiB laptop that is also hosting Postgres
#
# Applied by .github/workflows/release.yml, not by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sparx-prod

# What makes `--prune` possible, and safe.
#
# `kubectl apply` cannot delete: drop a Deployment from this file and the live
# one keeps running, forever, with nothing to say so. That is how consolidating
# fourteen workers into three shipped green and left twelve superseded pods
# running against the same JetStream durables — see the apply step in
# .github/workflows/release.yml.
#
# The release now prunes on this exact label, so only what this overlay emits is
# ever a deletion candidate. Two rules keep that true:
#
#   • The VALUE is unique to this overlay. ../infra applies to the SAME
#     namespace with `sparx-release-infra`; if the two shared a value, applying
#     one would prune everything belonging to the other.
#   • `includeSelectors: false` is REQUIRED. `spec.selector` is immutable on a
#     live Deployment, so folding this label into it would make every subsequent
#     apply fail — the old `commonLabels` field did exactly that, which is why
#     this is `labels:` instead.
labels:
  - pairs:
      app.kubernetes.io/managed-by: sparx-release-apps
    includeSelectors: false

resources:
  - ../../apps
  - ../../cronjobs
  # The 3 workers + the NATS broker. Shared verbatim with the workstation
  # overlay.
  - ../../self-hosted

# The release rewrites every tag to its own commit SHA before applying, so a
# rollout is always to an immutable reference and `kubectl rollout undo` means
# something. `latest` here is a placeholder that should never actually be
# deployed — the release FAILS if any of these survives the rewrite.
images:
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/api-rest
    newName: ghcr.io/brandonkorous/sparx/api-rest
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/api-graphql
    newName: ghcr.io/brandonkorous/sparx/api-graphql
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/api-mcp
    newName: ghcr.io/brandonkorous/sparx/api-mcp
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/mcp-site
    newName: ghcr.io/brandonkorous/sparx/mcp-site
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/workbench
    newName: ghcr.io/brandonkorous/sparx/workbench
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/web
    newName: ghcr.io/brandonkorous/sparx/web
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/site
    newName: ghcr.io/brandonkorous/sparx/site
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/market
    newName: ghcr.io/brandonkorous/sparx/market
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/admin
    newName: ghcr.io/brandonkorous/sparx/admin
    newTag: latest
  # Piggles. Same registry and the same `sparx/` package path — the repository
  # is the unit GHCR names, not the brand, and inventing a second package path
  # would mean a second set of package permissions to keep public.
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/piggles-web
    newName: ghcr.io/brandonkorous/sparx/piggles-web
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/piggles-account
    newName: ghcr.io/brandonkorous/sparx/piggles-account
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/piggles-console
    newName: ghcr.io/brandonkorous/sparx/piggles-console
    newTag: latest
  # The workers carry `sparx/<name>:local` in the shared base, since that base
  # is written for the workstation case. Rewrite them the same way.
  #
  # THREE, not fourteen: twelve worker images collapsed into `event-worker` when
  # the fleet was consolidated (see ../../self-hosted/workers.yaml). Their GHCR
  # packages still exist and are still pullable, which is what makes rolling
  # back to a pre-consolidation SHA work — nothing here references them.
  - name: sparx/event-worker
    newName: ghcr.io/brandonkorous/sparx/event-worker
    newTag: latest
  - name: sparx/media-worker
    newName: ghcr.io/brandonkorous/sparx/media-worker
    newTag: latest
  - name: sparx/import-worker
    newName: ghcr.io/brandonkorous/sparx/import-worker
    newTag: latest

replicas:
  - name: api-rest
    count: 1
  - name: admin
    count: 1
  - name: api-graphql
    count: 1
  - name: api-mcp
    count: 1
  - name: mcp-site
    count: 1
  - name: workbench
    count: 1
  - name: web
    count: 1
  - name: site
    count: 1
  - name: market
    count: 1
  - name: piggles-web
    count: 1
  - name: piggles-account
    count: 1
  - name: piggles-console
    count: 1

patches:
  # --- The broker's JetStream volume ------------------------------------------
  # k8s/self-hosted/nats.yaml omits the storage class so it stays portable;
  # without this patch AKS binds it to the `default` class, which is Standard
  # HDD — the wrong tier for a write-ahead log that every publish on the
  # platform blocks on.
  #
  # A JSON6902 patch, NOT a strategic merge, and that distinction is
  # load-bearing. `volumeClaimTemplates` carries no `patchMergeKey` in the
  # StatefulSet Go type, so it is an ATOMIC list: a strategic-merge patch naming
  # only storageClassName REPLACES the entire template rather than merging into
  # it, and the base's accessModes + resources.requests.storage vanish. The API
  # server then rejects the StatefulSet with "at least 1 access mode is
  # required" — at apply time, in the middle of a rollout, since
  # `kustomize build` renders the broken manifest perfectly happily. Addressing
  # the field by path leaves the rest untouched.
  - target: { kind: StatefulSet, name: nats }
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: managed-csi

  # --- Same deletions as the local overlay, same reasons ----------------------
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: placeholder
      $patch: delete
  - target:
      kind: PodDisruptionBudget
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: placeholder
      $patch: delete

  # --- Workload Identity ServiceAccount ---------------------------------------
  # `sparx-app` is annotated for GCP Workload Identity. It is never created here
  # and nothing in this cluster needs GCP credentials, so a pod referencing it
  # would stay Pending forever.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
      spec:
        template:
          spec:
            serviceAccountName: default
  - target:
      kind: CronJob
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: placeholder
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                serviceAccountName: default

  # --- Registry pull ----------------------------------------------------------
  # There is deliberately NO imagePullSecret here. This repository is public and
  # so are its 23 GHCR packages — an anonymous token pulls every one of them —
  # so the kubelet needs no credential to start a pod.
  #
  # It used to carry `ghcr`, a Secret minted from the release run's
  # GITHUB_TOKEN, and that took production down. A `ghs_` Actions token expires
  # with the run that minted it, so the credential sitting in the cluster is
  # dead within minutes of a release finishing. That is invisible while every
  # pull happens DURING a release — and fatal the moment one does not. On
  # 2026-08-08 the node hit memory pressure, evicted api-rest, and the
  # replacement pod presented the expired token; GHCR answered 403, the pod sat
  # in ImagePullBackOff for twelve hours, and api.sparx.works served Cloudflare
  # 502s (which browsers report as a CORS failure, because an error page carries
  # no Access-Control-Allow-Origin). Every pod restart between releases —
  # eviction, OOMKill, node reboot, scale-up — had the same fate.
  #
  # A credential that expires faster than the pods it serves cannot be the thing
  # standing between a restart and a running platform. Anonymous pull has no
  # expiry to get wrong.
  #
  # If a package is ever made private, do NOT reintroduce the run token: mint a
  # long-lived credential (a PAT or GitHub App installation) so the secret
  # outlives the release that wrote it.
  #
  # imagePullPolicy is left at the base's `Always`: unlike the workstation
  # overlay (which pins `Never` because images are read straight out of the
  # local Docker daemon), here the tag is rewritten to an immutable SHA by the
  # release, so `Always` costs one registry HEAD request and guarantees the node
  # never serves a stale cached layer.

  # --- Requests have to fit ONE node ------------------------------------------
  # The base numbers are tuned for Autopilot, where every request is billed and
  # the pool grows to meet them. Here there is exactly one node, and everything
  # below is sized to it.
  #
  # THE NODE GREW ON 2026-08-21: Standard_D2ads_v7 (2 vCPU / 8 GiB) →
  # Standard_D4ads_v7 (4 vCPU / 16 GiB), because memory ran out. Allocatable went
  # from ~1900m / ~5.5Gi to ~3900m / ~12.7Gi. AKS's own kube-system still takes
  # ~610m and ~0.5Gi of that (two metrics-server replicas at 156m, kube-proxy,
  # two CoreDNS) — it is a fixed tax, so the whole increase is usable.
  #
  # NOT A SECOND NODE, DELIBERATELY, and at identical cost: two D2s and one D4
  # are the same price to the cent, but two nodes pay AKS's regressive memory
  # reservation twice (25% of the first 4 GB, 20% of the next 4), pay a second
  # DaemonSet tax, and split free memory into two pools — while buying no
  # availability at all, since every Deployment here is `replicas: 1` and
  # sku_tier is "Free". Reasoning in terraform/envs/azure/variables.tf.
  #
  # NONE OF THE NUMBERS BELOW CHANGED WITH THE NODE, ON PURPOSE. They are
  # measured steady-state RSS (see the memory note further down), not a division
  # of the node between tenants — so a bigger node does not entitle anything to
  # ask for more. What grew is HEADROOM: room for the surge during a rollout,
  # for CronJob and one-off Job pods, and for new workloads. Raising a request
  # here is still a thing you do because `kubectl top` moved, never because the
  # node has space.
  #
  # CPU stays deliberately small: CPU is compressible, a request is a floor and
  # not a cap, and the scheduler only needs the floors to be honest enough to
  # order admission. CPU limits are dropped entirely — a cap only throttles cold
  # starts, which is the one thing this platform has repeatedly lost to.
  #
  # MEMORY IS NOT CPU, AND THIS FILE USED TO TREAT IT AS IF IT WERE. The rule
  # here read "small requests let everything schedule and then grow into what it
  # needs; the memory LIMIT is what protects the node." The first half is true.
  # The second half is false, and it is what took production down.
  #
  # A limit protects the node from ONE container leaking. It does nothing about
  # the node filling up from every container being honestly, permanently larger
  # than it claimed. When that happens the kubelet evicts, and it ranks victims
  # by USAGE ABOVE REQUEST — not by absolute usage, not by limit, not by age.
  # So the pod that under-requests by the widest margin is chosen first, which
  # is a rule that deliberately selects whoever lied hardest about their size.
  #
  # api-rest requested 128Mi and used ~614Mi. It was the worst offender on the
  # node by 150Mi, so it was first in line every time, and it is the ONE
  # Deployment here running `strategy: Recreate` — its eviction is downtime, not
  # a rolling replace. That is the eviction of 2026-08-08: the node tightened,
  # the kubelet picked the pod that serves every API request, and the expired
  # pull secret above then kept it down for twelve hours.
  #
  # So these are measured numbers, not guesses — steady-state RSS from
  # `kubectl top`, rounded up one step for headroom. Two consequences are the
  # point rather than a side effect:
  #
  #   1. Eviction order becomes meaningful. Every app now sits just UNDER its
  #      request, so none of them is an obvious victim, and the kubelet falls
  #      through to the BestEffort workers — which is what should absorb
  #      pressure and is why they still declare nothing.
  #   2. The scheduler stops lying. Requests summed to ~1.8Gi on a node running
  #      5.3Gi, so it believed the node was half empty and admitted anything.
  #      Honest requests turn "cram it in, then evict something serving traffic"
  #      into "the surge pod waits for room." Pending is recoverable; eviction
  #      is an outage.
  #
  # Rollouts still fit: api-rest is Recreate and the three workers are
  # maxSurge 0, so only the RollingUpdate apps surge, they free their old pod's
  # request as each becomes ready, and the scheduler admits the rest in waves.
  # A release therefore takes longer under pressure instead of failing — well
  # inside the 15m `rollout status` timeout.
  #
  # When an app's real footprint moves, MOVE THE NUMBER. A request that drifts
  # below actual is not a saving; it is a vote for that pod to be killed first.
  #
  # Per-app rather than one patch, because a strategic-merge patch on
  # `containers` merges by container NAME.
  - target: { kind: Deployment, name: api-graphql }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-graphql
      spec:
        template:
          spec:
            containers:
              - name: api-graphql
                resources:
                  # measured 245Mi
                  requests: { cpu: '25m', memory: '288Mi' }
                  limits: { memory: '768Mi' }
  - target: { kind: Deployment, name: api-mcp }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-mcp
      spec:
        template:
          spec:
            containers:
              - name: api-mcp
                resources:
                  # measured 404Mi
                  requests: { cpu: '25m', memory: '448Mi' }
                  limits: { memory: '768Mi' }
  - target: { kind: Deployment, name: mcp-site }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-site
      spec:
        template:
          spec:
            containers:
              - name: mcp-site
                resources:
                  # measured 89Mi — already honest, left alone
                  requests: { cpu: '25m', memory: '96Mi' }
                  limits: { memory: '512Mi' }
  - target: { kind: Deployment, name: workbench }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: workbench
      spec:
        template:
          spec:
            containers:
              - name: workbench
                resources:
                  # measured 232Mi
                  requests: { cpu: '25m', memory: '256Mi' }
                  limits: { memory: '640Mi' }
  - target: { kind: Deployment, name: web }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        template:
          spec:
            containers:
              - name: web
                resources:
                  # measured 419Mi — the marketing site is the second-largest
                  # process here, not the small one its old 96Mi implied.
                  requests: { cpu: '25m', memory: '448Mi' }
                  limits: { memory: '640Mi' }
  - target: { kind: Deployment, name: site }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: site
      spec:
        template:
          spec:
            containers:
              - name: site
                resources:
                  # measured 119Mi, but this is the pod that serves every TENANT
                  # storefront — its footprint grows with traffic and with how
                  # many sites are live, so it gets margin the others don't.
                  requests: { cpu: '25m', memory: '160Mi' }
                  limits: { memory: '640Mi' }
  # --- Piggles: no patch, and that is the point ------------------------------
  # The three Piggles Deployments already declare node-tuned numbers in the base
  # (25m CPU, no CPU limit, a memory request sized to the nearest measured
  # sibling), because they were written after this file existed rather than
  # before it. Patching them here would be restating the same values in a second
  # place for two of them to drift apart later.
  #
  # WHAT THEY COST THIS NODE, said plainly, because adding three pods to a
  # single 2-vCPU / 8 GiB box is a capacity decision and not a formality:
  #
  #   CPU      +75m of a ~1290m budget after kube-system's ~610m.
  #   MEMORY   +800Mi of requests (288 + 256 + 256), against ~2.4Gi already
  #            requested on a node with ~5.3Gi allocatable.
  #
  # That lands the node near 3.2Gi requested — comfortable, but it is the
  # measured-requests discipline above that keeps it so. If any of the three
  # turns out to use materially more than it asks for, it becomes the eviction
  # candidate before anything else does, exactly as api-rest did at 128Mi
  # requested against 614Mi used. Measure them once they serve traffic.
  #
  # If the node cannot take them, the answer is a bigger node or a second one —
  # NOT shaving these requests back below what the pods actually use. That trade
  # has already been made once here and it cost twelve hours of downtime.
  - target: { kind: Deployment, name: market }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: market
      spec:
        template:
          spec:
            containers:
              - name: market
                resources:
                  # measured 88Mi — already honest, left alone
                  requests: { cpu: '25m', memory: '96Mi' }
                  limits: { memory: '640Mi' }

  # --- api-rest ---------------------------------------------------------------
  # Larger ceiling than its siblings: it loads a ~50-package workspace through
  # runtime tsx at boot, which is what made 512Mi crashloop on Autopilot and
  # forced `--max-old-space-size=384`. NODE_OPTIONS must move with the limit or
  # the heap stays capped regardless of what the container is allowed.
  #
  # It also mounts the media volume. That mount is now a FALLBACK, not the store:
  # media moved to Azure Blob once AZURE_STORAGE_ACCOUNT/KEY reached this pod, and
  # api-rest streams variants out of the `media-public` container. The PVC is kept
  # mounted because it still holds the only copy of anything the migration missed,
  # and because the local backend is what the code falls back to if those two
  # variables ever go missing again. The PVC itself is created by the INFRA
  # overlay, one stage earlier — the marketplace ingest mounts it during the data
  # stage, before this pod exists at all.
  #
  # Once Blob has been verified over a few uploads, this mount, the fsGroup below
  # and media-worker's node pinning can all come out together — they exist for a
  # ReadWriteOnce disk that will no longer be in the read path.
  #
  # fsGroup is what makes that volume WRITABLE, and it is not optional here.
  # Every container in this overlay runs as uid 1000, but the media tarball was
  # unpacked by the restore workflow with the uid/gid recorded inside it —
  # 197609, a Windows-side id that exists nowhere in the cluster — at mode 0755.
  # The result was a production volume the apps could READ and never WRITE:
  # every upload, every transcoded variant and every marketplace artifact failed
  # with EACCES, while both pods stayed Running and healthy. fsGroup makes the
  # kubelet take group ownership of the tree at mount time and add group write,
  # which fixes the existing files without a one-off root Job; OnRootMismatch
  # skips the recursive walk once the root already matches, so it costs one
  # pass, not one per restart.
  - target:
      kind: Deployment
      name: api-rest
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-rest
      spec:
        strategy:
          type: Recreate
          rollingUpdate: null
        template:
          spec:
            securityContext:
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch
            containers:
              - name: api-rest
                env:
                  - name: NODE_OPTIONS
                    value: '--max-old-space-size=1024'
                  # Prisma sizes its pool `cpus * 2 + 1`, and this container requests
                  # 50m, so it sees ONE cpu and opens THREE connections. api-rest is not
                  # a worker: it runs eight background ticks (social sweeps, scheduled
                  # publish, email dispatch, sitebuilder publish, webhook delivery, …)
                  # alongside every HTTP request, all contending for those three.
                  #
                  # That produced 154 pool timeouts in 45 minutes with ZERO server-side
                  # rejections — the database was never the constraint, the client pool
                  # was. Each tick died mid-transaction, and since `email-dispatch` is
                  # the only publisher of `email.send`, no transactional email had ever
                  # been sent here: its JetStream consumer read `delivered: 0` for three
                  # days.
                  #
                  # Set HERE and not in DATABASE_URL because that URL lives in the shared
                  # `sparx-app-secrets` that ~20 services mount via envFrom — a limit
                  # there multiplies across all of them. The single-consumer workers are
                  # correctly served by 3.
                  #
                  # 8 is deliberately modest: Postgres is B1ms (~35 max_connections) and
                  # pools are lazy, so this adds at most 5 in-flight connections to a
                  # budget nothing is currently exhausting.
                  - name: DB_CONNECTION_LIMIT
                    value: '8'
                volumeMounts:
                  - name: media
                    mountPath: /media
                resources:
                  requests:
                    # CPU stays 50m: it is what Prisma reads to size its pool
                    # (see DB_CONNECTION_LIMIT above), and the node has ~420m
                    # of CPU left to give.
                    cpu: '50m'
                    # measured 614Mi. This was 128Mi — a 486Mi understatement,
                    # the widest on the node, on the one pod whose eviction is
                    # an outage rather than a rolling replace. See the eviction
                    # note above; this number is the fix for it.
                    memory: '640Mi'
                  limits:
                    memory: '1536Mi'
            volumes:
              - name: media
                persistentVolumeClaim:
                  claimName: sparx-media

  # --- media-worker must land on api-rest's node ------------------------------
  # Both mount the `sparx-media` PVC, which is a ReadWriteOnce Azure Disk — it
  # attaches to exactly ONE node at a time. Sharing is deliberate (media-worker
  # writes the variants api-rest streams; separate volumes would transcode fine
  # and then 404 forever), and it works only while both pods are co-located.
  #
  # node_count is 1, so today that is automatic. It is not guaranteed: an AKS
  # upgrade adds a surge node and a node-pool change rotates through a temporary
  # one, and either can place these two on opposite nodes. The loser then sits
  # in ContainerCreating with `Multi-Attach error for volume` — during an
  # upgrade, with nothing pointing back at this file.
  #
  # `requiredDuringScheduling`, not preferred: a "preference" that silently
  # yields is exactly the failure being prevented. Better Pending, with a
  # scheduler message naming the affinity, than a hung mount.
  - target:
      kind: Deployment
      name: media-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: media-worker
      spec:
        template:
          spec:
            # Same fsGroup as api-rest, for the same reason — this is the pod
            # that WRITES the variants, so without it every transcode ends in
            # EACCES against /media. Both pods must agree on the group or the
            # one that mounts second re-applies ownership on every start.
            securityContext:
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch
            affinity:
              podAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: api-rest
                    topologyKey: kubernetes.io/hostname
