# Marketplace ingest Job — AZURE. Applied by
# .github/workflows/marketplace-ingest-azure.yml, which substitutes ${IMAGE} and
# ${RUN_ID} via `envsubst` before apply. The GCP sibling is
# k8s/sparx-prod/marketplace-ingest-job.yaml.
#
# Runs the api-rest image (marketplace-catalog/ is baked in by its Dockerfile)
# with its entrypoint overridden to the ingest script, hydrated from the same
# sparx-app-env + sparx-app-secrets the live pods use. The script clears tenant
# context (withSystem) to upsert the Sparx-core catalog rows, exactly as the
# running api-rest does.
#
# THE ONE REAL DIFFERENCE FROM THE GCP JOB IS STORAGE, and it is the difference
# that decides whether this works at all. There, GCS_MEDIA_BUCKET was set, so the
# artifact writes went to a bucket and the Job needed no volume. Here that
# variable is deliberately absent (k8s/azure/app-env-configmap.env), which is
# what selects LocalStorage in packages/media — rooted at MEDIA_LOCAL_DIR, i.e.
# the `sparx-media` PVC. Omit the mount and the ingest still reports success: it
# writes every artifact to the container's own filesystem, the catalog rows land
# pointing at keys that resolve to nothing, and the failure only surfaces later
# when someone tries to APPLY a theme. So the volume is mandatory.
#
# Which drags in the RWO constraint with it. sparx-media is a ReadWriteOnce Azure
# Disk, already attached to whichever node api-rest is on, and RWO scopes to a
# NODE. The podAffinity below makes co-location a scheduling requirement instead
# of a single-node assumption — node_count is 1 today, but an AKS upgrade surge
# or a node-pool rotation reaches two, and the loser hangs in ContainerCreating
# with `Multi-Attach error for volume`. Pending with a scheduler message that
# names the affinity is the better failure.
#
# Idempotent: artifacts are immutable per version, so re-running the same bundle
# version is a no-op write. Bump the version in a bundle's sparx.json to publish
# an update, then run the workflow again. The Job name carries ${RUN_ID} so each
# run is a fresh (immutable) Job; TTL of 1h cleans up completed ones.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: marketplace-ingest-${RUN_ID}
  namespace: sparx-prod
  labels:
    app.kubernetes.io/name: marketplace-ingest
    app.kubernetes.io/part-of: sparx
    app.kubernetes.io/component: ingest
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketplace-ingest
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr
      # Matches api-rest + media-worker. The restored media tree is owned by a
      # uid that does not exist in the cluster, so without fsGroup this Job is
      # another EACCES on the first artifact write — see the api-rest patch in
      # k8s/azure/kustomization.yaml for the whole story.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: api-rest }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: ingest
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          # Override the server ENTRYPOINT (node … src/index.ts). WORKDIR in the
          # image is /app/services/api-rest, so this relative path resolves; the
          # script reads /app/marketplace-catalog (repoRoot/marketplace-catalog).
          command: ['node', '--import', 'tsx', 'src/scripts/marketplace-ingest.ts']
          envFrom:
            - configMapRef:
                name: sparx-app-env
            - secretRef:
                name: sparx-app-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: SERVICE_NAME
              value: marketplace-ingest
            - name: LOG_LEVEL
              value: info
          volumeMounts:
            - name: media
              mountPath: /media
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: '200m'
              memory: '512Mi'
            limits:
              cpu: '1000m'
              memory: '1Gi'
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: sparx-media
