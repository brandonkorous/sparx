# AKS overlay — the deployed platform, on `aks-sparx-prod-cus` in centralus.
#
# Same shape as k8s/local and for the same reasons; read that file for the
# decisions both share (why the namespace stays `sparx-prod`, why HPAs and PDBs
# are deleted, why the workers are BestEffort). Only the DIFFERENCES are
# explained here.
#
# What differs from the workstation overlay:
#   1. images     → ghcr.io/brandonkorous/sparx/*, pulled from a registry rather
#                   than read out of a local Docker daemon
#   2. Postgres   → MANAGED (psql-sparx-prod-cus). No in-cluster StatefulSet.
#   3. Redis      → dropped entirely
#   4. storage    → Azure Disk via the `managed-csi` StorageClass
#   5. resources  → the node is 8 GiB with a managed database beside it, so the
#                   apps get slightly more headroom than on a 16 GiB laptop that
#                   is also hosting Postgres
#
# Deployed by .github/workflows/deploy-azure.yml, not by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sparx-prod

resources:
  - namespace.yaml
  - ../apps
  - ../cronjobs
  # The 11 workers. Shared verbatim with the workstation overlay.
  - ../self-hosted
  # The ingress: Caddy + the ONE routing table + a `type: LoadBalancer` Service.
  # Identical to what the GCP bootstrap applies — no Azure-specific ingress
  # config exists, which is the point. AKS provisions a Standard LB and public
  # IP from that Service exactly as GKE provisions a Network LB.
  #
  # This replaced the Cloudflare Tunnel. The tunnel had no inbound path, so
  # Caddy could not complete an ACME challenge and every hostname depended on
  # Cloudflare's single one-label-deep wildcard certificate — which is why
  # `<property>.<tenant>.sparx.zone` returned a handshake failure. On-demand
  # issuance is per hostname at any depth, so that class of problem is gone
  # rather than worked around.
  - ../ingress
  # Typesense + the media volume. NOT Postgres (managed) and NOT Redis.
  - infra.yaml

# CI rewrites the tag to the commit SHA before applying
# (`kustomize edit set image`), so a rollout is always to an immutable digest and
# `kubectl rollout undo` means something. `latest` here is a placeholder that
# should never actually be deployed.
images:
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/api-rest
    newName: ghcr.io/brandonkorous/sparx/api-rest
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/api-graphql
    newName: ghcr.io/brandonkorous/sparx/api-graphql
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/api-mcp
    newName: ghcr.io/brandonkorous/sparx/api-mcp
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/mcp-site
    newName: ghcr.io/brandonkorous/sparx/mcp-site
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/workbench
    newName: ghcr.io/brandonkorous/sparx/workbench
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/web
    newName: ghcr.io/brandonkorous/sparx/web
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/site
    newName: ghcr.io/brandonkorous/sparx/site
    newTag: latest
  - name: us-central1-docker.pkg.dev/sparxworks/sparx/market
    newName: ghcr.io/brandonkorous/sparx/market
    newTag: latest
  # The 11 workers carry `sparx/<name>:local` in the shared base, since that base
  # is written for the workstation case. Rewrite them the same way.
  - name: sparx/email-worker
    newName: ghcr.io/brandonkorous/sparx/email-worker
    newTag: latest
  - name: sparx/push-worker
    newName: ghcr.io/brandonkorous/sparx/push-worker
    newTag: latest
  - name: sparx/markup-recompute-worker
    newName: ghcr.io/brandonkorous/sparx/markup-recompute-worker
    newTag: latest
  - name: sparx/media-worker
    newName: ghcr.io/brandonkorous/sparx/media-worker
    newTag: latest
  - name: sparx/commerce-indexer
    newName: ghcr.io/brandonkorous/sparx/commerce-indexer
    newTag: latest
  - name: sparx/channel-sync-worker
    newName: ghcr.io/brandonkorous/sparx/channel-sync-worker
    newTag: latest
  - name: sparx/social-worker
    newName: ghcr.io/brandonkorous/sparx/social-worker
    newTag: latest
  - name: sparx/legal-seed-worker
    newName: ghcr.io/brandonkorous/sparx/legal-seed-worker
    newTag: latest
  - name: sparx/platform-crm-worker
    newName: ghcr.io/brandonkorous/sparx/platform-crm-worker
    newTag: latest
  - name: sparx/domain-worker
    newName: ghcr.io/brandonkorous/sparx/domain-worker
    newTag: latest
  - name: sparx/dropship-worker
    newName: ghcr.io/brandonkorous/sparx/dropship-worker
    newTag: latest

configMapGenerator:
  - name: sparx-app-env
    behavior: create
    envs:
      - app-env-configmap.env

generatorOptions:
  disableNameSuffixHash: true

replicas:
  - name: api-rest
    count: 1
  - name: api-graphql
    count: 1
  - name: api-mcp
    count: 1
  - name: mcp-site
    count: 1
  - name: workbench
    count: 1
  - name: web
    count: 1
  - name: site
    count: 1
  - name: market
    count: 1

patches:
  # --- Storage class for the ACME certificate volume --------------------------
  # k8s/ingress/pvc.yaml deliberately omits storageClassName so it binds to
  # whatever the cluster's default is — portable, but on AKS the default is
  # `managed-csi` anyway and being explicit documents the choice. StandardSSD,
  # not `managed-csi-premium`: this volume stores a few kilobytes of
  # certificates and its IOPS profile is "written once per issuance".
  - target: { kind: PersistentVolumeClaim, name: caddy-data }
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: caddy-data
      spec:
        storageClassName: managed-csi

  # Same for the broker's JetStream volume. k8s/self-hosted/nats.yaml omits the
  # class so it stays portable; without this patch AKS binds it to the `default`
  # class, which is Standard HDD — the wrong tier for a write-ahead log that
  # every publish on the platform blocks on.
  - target: { kind: StatefulSet, name: nats }
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: nats
      spec:
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              storageClassName: managed-csi

  # --- Same deletions as the local overlay, same reasons ----------------------
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: placeholder
      $patch: delete
  - target:
      kind: PodDisruptionBudget
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: placeholder
      $patch: delete

  # --- Workload Identity ServiceAccount ---------------------------------------
  # `sparx-app` is annotated for GCP Workload Identity. It is never created here
  # and nothing in this cluster needs GCP credentials, so a pod referencing it
  # would stay Pending forever.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
      spec:
        template:
          spec:
            serviceAccountName: default
  - target:
      kind: CronJob
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: placeholder
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                serviceAccountName: default

  # --- Registry pull ----------------------------------------------------------
  # The images live in a PRIVATE GHCR namespace, so every pod needs the pull
  # secret. Created by the deploy workflow from a GitHub token, not committed.
  #
  # imagePullPolicy is left at the base's `Always` for the apps: unlike the
  # workstation overlay (which pins `Never` because images are read straight out
  # of the local Docker daemon), here the tag is rewritten to an immutable SHA by
  # CI, so `Always` costs one registry HEAD request and guarantees the node never
  # serves a stale cached layer.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr

  # --- Requests have to fit ONE 2-vCPU node -----------------------------------
  # The base numbers are tuned for Autopilot, where every request is billed and
  # the pool grows to meet them. Here there is one node with 1900m allocatable,
  # and AKS's own kube-system takes ~610m of it (two metrics-server replicas at
  # 156m, kube-proxy, two CoreDNS). That leaves roughly 1290m for the whole
  # platform, and the base's 100m-per-app is most of it before a single CronJob
  # pod asks for anything.
  #
  # `requests` is what the SCHEDULER reserves, not what a process uses. Small
  # requests let all eight schedule and then grow into whatever they need; the
  # memory LIMIT is what actually protects the node, by OOMKilling one leaking
  # Next process instead of letting it take everything down. CPU limits are
  # dropped — CPU is compressible, so a cap only throttles cold starts.
  #
  # Unlike the workers (no resources at all, BestEffort — see
  # ../self-hosted/workers.yaml), the apps keep an explicit request so they are
  # Burstable: under pressure the kubelet evicts a worker before it evicts
  # something serving traffic.
  #
  # Per-app rather than one patch, because a strategic-merge patch on
  # `containers` merges by container NAME.
  - target: { kind: Deployment, name: api-graphql }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-graphql
      spec:
        template:
          spec:
            containers:
              - name: api-graphql
                resources:
                  requests: { cpu: '25m', memory: '96Mi' }
                  limits: { memory: '768Mi' }
  - target: { kind: Deployment, name: api-mcp }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-mcp
      spec:
        template:
          spec:
            containers:
              - name: api-mcp
                resources:
                  requests: { cpu: '25m', memory: '96Mi' }
                  limits: { memory: '768Mi' }
  - target: { kind: Deployment, name: mcp-site }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-site
      spec:
        template:
          spec:
            containers:
              - name: mcp-site
                resources:
                  requests: { cpu: '25m', memory: '96Mi' }
                  limits: { memory: '512Mi' }
  - target: { kind: Deployment, name: workbench }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: workbench
      spec:
        template:
          spec:
            containers:
              - name: workbench
                resources:
                  requests: { cpu: '25m', memory: '96Mi' }
                  limits: { memory: '640Mi' }
  - target: { kind: Deployment, name: web }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        template:
          spec:
            containers:
              - name: web
                resources:
                  requests: { cpu: '25m', memory: '96Mi' }
                  limits: { memory: '640Mi' }
  - target: { kind: Deployment, name: site }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: site
      spec:
        template:
          spec:
            containers:
              - name: site
                resources:
                  requests: { cpu: '25m', memory: '96Mi' }
                  limits: { memory: '640Mi' }
  - target: { kind: Deployment, name: market }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: market
      spec:
        template:
          spec:
            containers:
              - name: market
                resources:
                  requests: { cpu: '25m', memory: '96Mi' }
                  limits: { memory: '640Mi' }

  # --- api-rest ---------------------------------------------------------------
  # Larger ceiling than its siblings: it loads a ~50-package workspace through
  # runtime tsx at boot, which is what made 512Mi crashloop on Autopilot and
  # forced `--max-old-space-size=384`. NODE_OPTIONS must move with the limit or
  # the heap stays capped regardless of what the container is allowed.
  #
  # It also mounts the media volume, because with GCS_MEDIA_BUCKET unset
  # packages/media resolves to LocalStorage and api-rest STREAMS variants from
  # the same volume media-worker writes them to.
  - target:
      kind: Deployment
      name: api-rest
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-rest
      spec:
        strategy:
          type: Recreate
          rollingUpdate: null
        template:
          spec:
            containers:
              - name: api-rest
                env:
                  - name: NODE_OPTIONS
                    value: '--max-old-space-size=1024'
                volumeMounts:
                  - name: media
                    mountPath: /media
                resources:
                  requests:
                    cpu: '50m'
                    memory: '128Mi'
                  limits:
                    memory: '1536Mi'
            volumes:
              - name: media
                persistentVolumeClaim:
                  claimName: sparx-media

  # --- media-worker must land on api-rest's node ------------------------------
  # Both mount the `sparx-media` PVC, which is a ReadWriteOnce Azure Disk — it
  # attaches to exactly ONE node at a time. Sharing is deliberate (media-worker
  # writes the variants api-rest streams; separate volumes would transcode fine
  # and then 404 forever), and it works only while both pods are co-located.
  #
  # node_count is 1, so today that is automatic. It is not guaranteed: an AKS
  # upgrade adds a surge node and a node-pool change rotates through a temporary
  # one, and either can place these two on opposite nodes. The loser then sits in
  # ContainerCreating with `Multi-Attach error for volume` — during an upgrade,
  # with nothing pointing back at this file.
  #
  # `requiredDuringScheduling`, not preferred: a "preference" that silently
  # yields is exactly the failure being prevented. Better Pending, with a
  # scheduler message naming the affinity, than a hung mount.
  - target:
      kind: Deployment
      name: media-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: media-worker
      spec:
        template:
          spec:
            affinity:
              podAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: api-rest
                    topologyKey: kubernetes.io/hostname
