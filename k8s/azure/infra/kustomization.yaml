# INFRASTRUCTURE — stage 1 of the release, applied before any data is written
# and before any application container rolls.
#
# WHY THIS IS SEPARATE FROM ../apps, which is the whole point of the split:
#
# The release order is infrastructure → data → containers. The data stage runs
# Jobs in this cluster (roles, `prisma migrate deploy`, the platform seed, the
# marketplace ingest), and every one of them needs things that are NOT
# application containers:
#
#   - the namespace to run in
#   - `sparx-app-env`, which every Job pulls via envFrom
#   - the `sparx-media` PVC, which the ingest MOUNTS to write artifacts to
#
# While those lived in one overlay with the Deployments, the only way to have
# them was to roll the whole platform first — which is exactly why the data
# stage used to run last, after the containers it is supposed to precede. On a
# cluster that has never been deployed, that ordering does not merely reorder
# work; the seed Jobs have nowhere to run at all.
#
# The dividing line is REPLACEMENT. Everything here is created once and then
# converges: a namespace, a config map, a disk, a load balancer, a search
# engine holding an index. Everything in ../apps is a container image that is
# thrown away and replaced on every release. They have different lifecycles and
# different blast radii, so they get applied at different times by different
# stages.
#
# This also retires the GCP `bootstrap.yml` concept rather than porting it. That
# workflow existed because "add a platform pod" was a different operation from
# "roll an image" — correct instinct, wrong mechanism: it was a 39 KB dispatch
# with fifteen hand-picked component names that someone had to remember to run.
# The distinction it was drawing is this file, and it now runs on every release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sparx-prod

# The prune scope for THIS overlay. See ../apps/kustomization.yaml for the full
# reasoning; the one thing that must never change is the VALUE. It differs from
# the apps overlay on purpose — both stages apply into `sparx-prod`, so a shared
# value would mean applying infra prunes every app Deployment and applying apps
# prunes Typesense, PgBouncer and the media volume. wize-infrastructure applies
# the ingress into the same namespace under a THIRD value
# (`wize-infrastructure`), for the same reason.
#
# `includeSelectors: false` because `spec.selector` is immutable on live
# workloads.
labels:
  - pairs:
      app.kubernetes.io/managed-by: sparx-release-infra
    includeSelectors: false

resources:
  - namespace.yaml
  # Typesense + the sparx-media volume. NOT Postgres (managed, psql-sparx-prod-cus)
  # and NOT Redis (dropped entirely on this provider; NATS carries its old job).
  - platform.yaml
  # NOT the ingress. Caddy still runs in this namespace, but since 2026-10-29 it
  # is owned and applied by wize-infrastructure (its k8s/azure overlay, labelled
  # `app.kubernetes.io/managed-by: wize-infrastructure`), because it routes every
  # product on the cluster and a route for one of them must not wait on a sparx
  # release. The release's "Hand the ingress over" step relabels any Caddy
  # object still carrying THIS overlay's label before the prune below runs, so
  # dropping it from this list can never delete it.
  # PgBouncer for sparx_app (SI-1); see the file header for when apps use it.
  - pgbouncer.yaml

# The application environment. It lives in the INFRA overlay, not with the apps,
# because the data-stage Jobs consume it (`envFrom: configMapRef: sparx-app-env`)
# and they run before a single Deployment is touched.
configMapGenerator:
  - name: sparx-app-env
    behavior: create
    envs:
      - app-env-configmap.env
  # The Piggles brand's overrides, mounted AFTER the one above by the three
  # Piggles Deployments so its keys win for those pods and only those pods. It
  # lives in this overlay for the same reason its sibling does — generated once,
  # here, rather than hand-written into three manifests where three copies of one
  # origin would drift. Read the file's header before changing a value; every key
  # in it is one somebody has already been bitten by.
  - name: piggles-app-env
    behavior: create
    envs:
      - piggles-app-env.env

generatorOptions:
  disableNameSuffixHash: true

patches:
  # --- Same deletions as every other single-node overlay ----------------------
  # One node cannot satisfy a PodDisruptionBudget, and there is nothing for an
  # HPA to scale onto.
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: placeholder
      $patch: delete
  - target:
      kind: PodDisruptionBudget
      labelSelector: sparx.works/keep-pdb!=true
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: placeholder
      $patch: delete

  # `sparx-app` is annotated for GCP Workload Identity. It is never created on
  # this provider and nothing here needs GCP credentials, so a pod referencing
  # it would stay Pending forever.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
      spec:
        template:
          spec:
            serviceAccountName: default

  # --- Registry pull -----------------------------------------------------------
  # Nothing in THIS overlay pulls from a private registry — Typesense is
  # `typesense/typesense` and PgBouncer is public too — and
  # nothing anywhere else does either, so there is no pull secret to carry.
  #
  # It used to patch `ghcr` onto these Deployments, kept on the argument that
  # the field was ignored here and removing it would roll a single-replica
  # `Recreate` Caddy for no gain. That argument held right up until the same
  # Secret took the platform down from the apps overlay — see the "Registry
  # pull" note in ../apps/kustomization.yaml for the failure. A reference to a
  # credential nothing mints is worse than the one-time blip: it is the next
  # person's evidence that the credential still matters.
  #
  # Removing it rolls Caddy once, so every hostname blips for ~10-30s on the
  # release that lands this. That is the whole cost, paid once.
