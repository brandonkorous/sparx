apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: sparx-prod
  labels:
    app: pgbouncer
spec:
  replicas: 1 # TEMP: SSD_TOTAL_GB quota at 235/250GB blocks scale-up; restore to 2 after quota bump
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      serviceAccountName: pgbouncer
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.25.1-p0
          ports:
            - name: pgbouncer
              containerPort: 5432
          env:
            # edoburu/pgbouncer generates pgbouncer.ini from these env vars at startup.
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-secrets
                  key: POSTGRES_HOST
            - name: DB_PORT
              value: '5432'
            - name: DB_NAME
              value: sparx
            - name: DB_USER
              value: sparx_app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-secrets
                  key: POSTGRES_PASSWORD
            # Transaction mode is REQUIRED for RLS `SET LOCAL`. See docs/03 §8.
            - name: POOL_MODE
              value: transaction
            - name: AUTH_TYPE
              value: scram-sha-256
            - name: MAX_CLIENT_CONN
              value: '500'
            # Server connections to Cloud SQL per (user, db) pair, PER REPLICA. In
            # transaction mode a Prisma interactive transaction pins one slot for its
            # whole BEGIN..COMMIT, so a storefront traffic burst can exhaust the pool
            # → Prisma P2028 "Unable to start a transaction in the given time" (bumped
            # 25→40 during the 2026-07-04 incident, alongside caching the host/property
            # resolvers in api-rest). Ceiling: db-g1-small allows ~100 connections
            # (monitoring alerts >80). Peak = replicas × (DEFAULT_POOL_SIZE +
            # RESERVE_POOL_SIZE) = 1 × 45 today. FOOTGUN: before restoring replicas to
            # 2 (see above), drop this so 2 × (pool + reserve) stays under 80, or the
            # pair will exceed the instance ceiling.
            - name: DEFAULT_POOL_SIZE
              value: '40'
            - name: RESERVE_POOL_SIZE
              value: '5'
            - name: SERVER_TLS_SSLMODE
              value: require
            - name: IGNORE_STARTUP_PARAMETERS
              value: extra_float_digits,search_path
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '256Mi'
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
