apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: sparx-prod
  labels:
    app: caddy
spec:
  replicas: 1
  # RWO PVC for cert storage — Recreate avoids two pods holding the volume.
  # Multi-replica Caddy needs distributed cert storage (caddy-storage-redis). Phase 2.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      serviceAccountName: caddy
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: caddy-config-dir
              mountPath: /config
            # Cloudflare Origin CA cert for admin.wize.works (behind Access, so
            # ACME can't run — see k8s/caddy/Caddyfile admin block + origin-ca.tf).
            # Synced from Secret Manager by bootstrap.yml (components=caddy).
            - name: admin-origin-cert
              mountPath: /certs/admin
              readOnly: true
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          # TCP probe — HTTP probe gets 301-redirected to https://<podIP>/, then fails
          # TLS handshake because Caddy can't mint a cert for an IP. TCP is sufficient
          # here: if Caddy isn't listening on 80, the pod is broken.
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: caddy-config
        - name: caddy-config-dir
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: caddy-data
        # optional:true so a missing secret doesn't wedge scheduling — but the
        # Caddyfile's `tls` directive still needs the files present, so the
        # bootstrap caddy step hard-fails BEFORE rolling if the secret can't be
        # synced (a cert-less roll would take the whole shared ingress down).
        - name: admin-origin-cert
          secret:
            secretName: caddy-admin-origin
            optional: true
