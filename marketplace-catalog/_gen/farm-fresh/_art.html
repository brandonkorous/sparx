<!doctype html>
<!-- Marketplace art generator for the Farm Fresh blueprint. Rendered once and the two
     elements are screenshotted to media/icon.png (512×512) + media/preview.png (1600×1000).
     Not shipped — lives in _gen for regeneration. Colors track theme.ts. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --leaf: #5c7a3d;
        --moss: #3e5c2a;
        --cream: #fbf8f1;
        --berry: #c8324b;
        --mango: #f2a93b;
        --sage: #e8eedf;
        --sand: #f3ecde;
        --ink: #2e3424;
        --body: #54513f;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #888;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        display: flex;
        gap: 40px;
        padding: 40px;
        align-items: flex-start;
      }
      .emoji { font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }

      /* ── Icon 512×512 ───────────────────────────────────────────── */
      #icon {
        width: 512px; height: 512px;
        background: var(--leaf);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 34px;
      }
      #icon .mark { position: relative; width: 250px; height: 180px; }
      /* bowl = a thick white half-circle (top open) */
      #icon .bowl {
        position: absolute; left: 0; bottom: 0;
        width: 250px; height: 125px;
        border: 18px solid var(--cream);
        border-top: none;
        border-radius: 0 0 130px 130px;
        box-sizing: border-box;
      }
      /* rim = the sage rounded bar across the bowl's mouth */
      #icon .rim {
        position: absolute; left: 8px; top: 44px;
        width: 234px; height: 22px;
        background: #8fb46a; border-radius: 999px;
      }
      /* berry = the accent dot resting on the rim */
      #icon .berry {
        position: absolute; right: 22px; top: 26px;
        width: 56px; height: 56px;
        background: var(--berry); border-radius: 999px;
      }
      #icon .initials {
        color: var(--cream); font-weight: 800;
        font-size: 60px; letter-spacing: 16px; text-indent: 16px;
      }

      /* ── Preview 1600×1000 ──────────────────────────────────────── */
      #preview {
        width: 1600px; height: 1000px;
        background: var(--cream);
        position: relative; overflow: hidden;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 30px;
      }
      /* soft decorative blobs */
      #preview .blob { position: absolute; border-radius: 999px; opacity: 0.5; }
      #preview .b1 { width: 520px; height: 520px; background: var(--sage); top: -160px; left: -120px; }
      #preview .b2 { width: 380px; height: 380px; background: var(--sand); bottom: -120px; right: -90px; }
      #preview .pmark { position: relative; width: 150px; height: 108px; z-index: 1; }
      #preview .pbowl {
        position: absolute; left: 0; bottom: 0; width: 150px; height: 75px;
        border: 12px solid var(--leaf); border-top: none;
        border-radius: 0 0 80px 80px; box-sizing: border-box;
      }
      #preview .prim { position: absolute; left: 6px; top: 26px; width: 138px; height: 14px; background: #8fb46a; border-radius: 999px; }
      #preview .pberry { position: absolute; right: 14px; top: 14px; width: 34px; height: 34px; background: var(--berry); border-radius: 999px; }
      #preview .wordmark {
        z-index: 1; font-size: 118px; font-weight: 800; letter-spacing: -3px;
        color: var(--leaf);
      }
      #preview .wordmark b { color: var(--berry); font-weight: 800; }
      #preview .tag {
        z-index: 1; font-size: 40px; color: var(--body); font-weight: 600;
      }
      #preview .rule { z-index: 1; width: 90px; height: 6px; background: var(--berry); border-radius: 999px; margin: 6px 0 4px; }
      #preview .row { z-index: 1; display: flex; gap: 34px; margin-top: 18px; }
      #preview .chip {
        width: 130px; height: 130px; border-radius: 999px;
        display: flex; align-items: center; justify-content: center;
        font-size: 72px; box-shadow: 0 8px 24px rgba(46,52,36,0.12);
      }
      #preview .c-sage { background: var(--sage); }
      #preview .c-berry { background: #f6d4da; }
      #preview .c-mango { background: #fbe6c4; }
      #preview .c-leaf { background: #d8e6c5; }
      #preview .foot {
        z-index: 1; position: absolute; bottom: 54px;
        font-size: 30px; color: var(--leaf); font-weight: 700; letter-spacing: 2px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="icon">
      <div class="mark">
        <div class="bowl"></div>
        <div class="rim"></div>
        <div class="berry"></div>
      </div>
      <div class="initials">FF</div>
    </div>

    <div id="preview">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="pmark">
        <div class="pbowl"></div>
        <div class="prim"></div>
        <div class="pberry"></div>
      </div>
      <div class="wordmark">Farm <b>Fresh</b></div>
      <div class="rule"></div>
      <div class="tag">Here to deliver health.</div>
      <div class="row">
        <div class="chip c-berry emoji">🍓</div>
        <div class="chip c-sage emoji">🥣</div>
        <div class="chip c-leaf emoji">🥗</div>
        <div class="chip c-mango emoji">🥤</div>
        <div class="chip c-sage emoji">🥝</div>
      </div>
      <div class="foot emoji">🌿 Fresh storefront blueprint</div>
    </div>
  </body>
</html>
