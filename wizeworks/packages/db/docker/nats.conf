# JetStream for local development. Mirrors k8s/self-hosted/nats.yaml so the
# transport a laptop exercises is the transport production runs — the entire
# reason NATS was chosen over a managed queue.
#
# Smaller limits than the cluster (256MB/6GB there): a dev stream holds a few
# hundred events, and an unbounded store on a laptop is a surprise nobody wants.
port: 4222
http: 8222

jetstream {
  store_dir: "/data"
  max_memory_store: 64MB
  max_file_store: 1GB
}
