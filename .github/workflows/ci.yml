name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    # 30 (not 15) because the typecheck/test steps below run Turbo with a
    # capped concurrency to stay under the hosted runner's RAM (see those
    # steps). Fewer parallel tsc/vitest processes ⇒ longer wall-clock, so the
    # old 15-min ceiling would itself fail the job. cancel-in-progress still
    # kills superseded runs, so a high ceiling doesn't pile up stale runs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # --concurrency=2 caps how many packages typecheck at once. The default
      # (~10) spawns enough simultaneous `tsc` processes across the 63 workspace
      # packages to exhaust the hosted runner's RAM; the OOM killer takes one
      # out with exit 137 and the runner dies ("operation was canceled" with no
      # actual TSxxxx errors). Two at a time keeps peak memory well under the
      # ceiling while still using both runner cores. Local/pre-push runs are
      # uncapped (dev machines have the headroom). Call turbo directly — piping
      # the flag through `pnpm typecheck -- --concurrency=2` forwards it to tsc
      # ("TS5023: Unknown compiler option"), not to turbo.
      - name: Typecheck
        run: pnpm exec turbo run typecheck --concurrency=2

      # Same memory reasoning as Typecheck — vitest forks workers per package,
      # so cap how many packages test in parallel.
      - name: Test
        run: pnpm exec turbo run test --concurrency=2

      - name: Prettier
        run: pnpm format:check

  event-topics:
    name: Event ↔ topic parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Guards against the drift that has caused four separate silent
    # publish-failure incidents: an event declared in code (EventType OR
    # CrmTopic) with no Pub/Sub topic in terraform. Pure Node, no install —
    # so it fails fast, in parallel with the heavier jobs, on the first PR
    # that adds an event without its topic.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Check event/topic parity
        run: node scripts/check-event-topics.mjs

  workflow-heredocs:
    name: Workflow heredoc safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Guards a failure mode that has already bitten twice in one day. In an
    # UNQUOTED heredoc (`cmd <<EOF`), bash performs command substitution on
    # backticks anywhere in the body — including inside YAML and shell COMMENTS.
    #
    # db-migrate-azure.yml named two Kubernetes fields in backticks inside a
    # `kubectl apply -f - <<YAML` body. bash executed `env`, spliced the whole
    # process environment into the manifest, and the deploy died at the
    # migration step on a YAML parse error pointing at a line nobody wrote.
    #
    # restore-from-export.yml made the identical mistake and PASSED, because its
    # two fragments happened to produce empty output — it restored production
    # data while carrying a live footgun. That silence is why this is CI and not
    # a review checklist. No install needed, so it fails fast beside the heavy
    # jobs.
    steps:
      - uses: actions/checkout@v4

      - name: Lint workflow heredocs
        run: bash .github/scripts/lint-workflow-heredocs.sh

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform
    # Cache downloaded provider plugins across runs so a flaky registry/CDN
    # doesn't re-fetch them every time (the cloudflare provider is served from
    # GitHub release assets, which intermittently 504).
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: tf-providers-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: tf-providers-

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: Validate envs/prod
        working-directory: terraform/envs/prod
        # `init -backend=false` avoids needing GCP creds in CI for validation.
        run: bash "$GITHUB_WORKSPACE/.github/scripts/tf-validate.sh"

      - name: Validate bootstrap
        working-directory: terraform/bootstrap
        run: bash "$GITHUB_WORKSPACE/.github/scripts/tf-validate.sh"
