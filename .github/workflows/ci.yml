name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Prettier
        run: pnpm format:check

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform
    # Cache downloaded provider plugins across runs so a flaky registry/CDN
    # doesn't re-fetch them every time (the cloudflare provider is served from
    # GitHub release assets, which intermittently 504).
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Cache Terraform providers
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: tf-providers-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: tf-providers-

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: Validate envs/prod
        working-directory: terraform/envs/prod
        # `init -backend=false` avoids needing GCP creds in CI for validation.
        run: bash "$GITHUB_WORKSPACE/.github/scripts/tf-validate.sh"

      - name: Validate bootstrap
        working-directory: terraform/bootstrap
        run: bash "$GITHUB_WORKSPACE/.github/scripts/tf-validate.sh"
