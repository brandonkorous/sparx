name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ONE JOB PER TASK, IN PARALLEL, EACH WITH A WARM TURBO CACHE.
#
# This was a single `validate` job running lint → typecheck → test → prettier in
# sequence, and it took ~24 minutes. The measured split was:
#
#     Install    0.7 min
#     Lint       8.5 min
#     Typecheck 13.8 min
#     Test       1.3 min
#
# Two things were wrong, and neither was the tests.
#
#   1. SEQUENTIAL. Lint and typecheck have nothing to say to each other, so the
#      job cost their SUM. Split across jobs, wall-clock is the slowest one.
#   2. NO CACHE. Turbo hashes task inputs and can skip a package whose inputs
#      have not changed, but the cache lived only inside the runner and died
#      with it — so all 63 packages re-linted and re-typechecked on every push,
#      including the many the commit never touched. Persisting `.turbo` means a
#      typical commit does the work for the handful of packages it actually
#      changed.
#
# --concurrency=2 stays on typecheck and test, and is NOT an artifact of the old
# layout: the default (~10) spawns enough simultaneous `tsc`/vitest processes
# across 63 packages to exhaust a hosted runner's RAM. The OOM killer takes one
# out with exit 137 and the job dies as "operation was canceled" with no TSxxxx
# error to explain it. A dedicated job does not add memory, so the cap still
# earns its place. Local/pre-push runs are uncapped — dev machines have the
# headroom. Call turbo directly: `pnpm typecheck -- --concurrency=2` forwards
# the flag to tsc ("TS5023: Unknown compiler option"), not to turbo.
jobs:
  lint:
    name: Lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: packages, scope: './packages/*' }
          - { name: services, scope: './services/*' }
          - { name: apps, scope: './apps/*' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          turbo-cache-key: lint-${{ matrix.name }}
      # -----------------------------------------------------------------------
      # SHARDED, because this job was failing on MEMORY rather than on lint
      # errors — and one runner cannot hold the whole workspace.
      #
      # The symptom hid it. The step reported `cancelled` and the job `failure`
      # with no ESLint output naming a file, which reads as a timeout or a
      # cancelled run. It is neither. The runs died at 6.5 and 9.9 minutes
      # against a 20-then-30-minute limit, and `Typecheck` in the SAME run
      # carried on for another nine minutes afterwards — so the RUN was never
      # cancelled, only this job's runner was lost. The last log line before it
      # goes is `Tasks: 51 successful, 78 total`: it dies partway through, which
      # is what running out of memory looks like from the outside.
      #
      # `lint` dependsOn `^build`, so a single runner was building AND
      # type-aware-linting all 78 packages inside 7 GB. Bounding concurrency and
      # capping the heap was not enough on its own; the fix is to stop asking
      # one runner to hold the whole graph. Three shards by workspace directory
      # cut both peak memory and wall time, and `fail-fast: false` keeps one
      # shard's failure from hiding the other two.
      #
      # `--concurrency=2` bounds how many typed-ESLint processes hold a
      # TypeScript program at once — turbo otherwise fans out to the core count
      # with no memory awareness, and that peak is what does not fit. The heap
      # cap is per worker and deliberately below the box's RAM, so a runaway
      # worker throws a catchable JS heap error naming its package instead of the
      # kernel taking the runner out silently.
      #
      # THE RUNNER IS 4 vCPU / 16 GB, not the 2 vCPU / 7 GB these notes used to
      # assume. This repository is PUBLIC, and GitHub-hosted `ubuntu-latest` on a
      # public repo has been the larger class for a while. The old numbers are
      # why the cap is 5120 rather than something chosen against the real box,
      # and why `--concurrency=2` is set against a core count that is now 4.
      # Neither is wrong — both are simply more conservative than they need to
      # be. Re-tune against 16 GB before assuming either number is a floor.
      #
      # NOTE ON THE CACHE: turbo hashes every file in a package directory, so a
      # commit that touches all 17 service Dockerfiles invalidates all 17 lint
      # entries even though ESLint never reads a Dockerfile. That is why a run
      # can report `Cached: 0 cached, 78 total` and do everything cold. Narrowing
      # each task's `inputs` in turbo.json is the follow-up; sharding is what
      # makes the cold case survivable in the meantime.
      # `pnpm exec turbo run`, NOT `pnpm lint -- …`. The root `lint` script is
      # `turbo run lint`, so `pnpm lint -- --filter X` becomes
      # `turbo run lint -- --filter X` — and everything after turbo's `--` is
      # forwarded to the TASK, so eslint itself received the flag and died with
      # `Invalid option '--filter' - perhaps you meant '--parser'?`. Calling
      # turbo directly keeps the flags on turbo, which is what the Test job
      # above already does.
      - run: pnpm exec turbo run lint --filter "{${{ matrix.scope }}}" --concurrency=2
        env:
          NODE_OPTIONS: --max-old-space-size=5120

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    # The long pole. 20 rather than 15 because a cold cache at --concurrency=2
    # genuinely takes ~14 minutes; cancel-in-progress keeps superseded runs from
    # piling up behind a generous ceiling.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          turbo-cache-key: typecheck
      # The heap cap the lint job has had all along, and this job needed just as
      # much. `@sparx/api-rest` is one `tsc` program over 469 files, and it sits
      # RIGHT ON V8's default old-space ceiling (~4 GB): it type-checks in a
      # shade under 4 GB, so it passes whenever turbo replays it from cache and
      # dies with `FATAL ERROR: Ineffective mark-compacts near heap limit` on the
      # runs that actually execute it. That is why this job looked intermittent
      # rather than broken — a green CI usually meant api-rest was cached, not
      # that it fit.
      #
      # 6144 was measured, not guessed: api-rest completes under it with room,
      # and at `--concurrency=2` the worst case is 12 GB against the runner's 16,
      # which leaves the cap low enough that a runaway throws a catchable JS heap
      # error naming its package instead of the kernel killing the runner
      # silently with exit 137. Do not raise it to 8192 without also dropping
      # concurrency — two workers at 8 GB is the whole box.
      - run: pnpm exec turbo run typecheck --concurrency=2
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          turbo-cache-key: test
      # --continue because turbo otherwise stops scheduling the moment one task
      # fails, and the run reports only what it got to. A single red package hid
      # the other ~58 for days: the summary read "33 successful, 38 total" out of
      # a 96-task graph, so each push looked like one failure and fixing it only
      # uncovered the next. Failing everything at once costs a few minutes on an
      # already-red run and nothing at all on a green one.
      - run: pnpm exec turbo run test --concurrency=2 --continue

  format:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          turbo-cache-key: format
      - run: pnpm format:check

  event-topics:
    name: Event ↔ topic parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Guards against the drift that has caused four separate silent
    # publish-failure incidents: an event declared in code (EventType OR
    # CrmTopic) with no Pub/Sub topic in terraform. Pure Node, no install —
    # so it fails fast, in parallel with the heavier jobs, on the first PR
    # that adds an event without its topic.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Check event/topic parity
        run: node scripts/check-event-topics.mjs

  surface-routes:
    name: Surface ↔ address parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Every workbench surface must have an address in @sparx/links, and every
    # address must name a surface that exists. A surface with no address is a
    # pane nobody can link to and one the URL bar cannot name; an address with no
    # surface is a link that opens nothing — the failure that left
    # `/?surface=social.composer` in production email for months. Pure Node, no
    # install, so it fails on the first PR that adds a surface without a route.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Check surface/address parity
        run: node scripts/check-surface-routes.mjs

  dockerfile-deps:
    name: Dockerfile ↔ workspace deps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The five Next.js app images hand-list their dependency closure and run a
    # FILTERED pnpm install, because copying the whole workspace into each one is
    # what took a release generation to ~18 GB. A hand-written list drifts: a new
    # shared package lands under two schema packages, nobody adds the COPY, and
    # `Module not found` comes back three minutes into the release — for a fact
    # that was knowable from two package.json files. Pure Node, no install, so it
    # fails before anything is built.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Check Dockerfile dependency closure
        run: node scripts/check-dockerfile-deps.mjs

  migration-order:
    name: Migration ordering
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Prisma orders migrations LEXICOGRAPHICALLY by directory name and records
    # each applied one by that name. This repository's timestamp prefixes are
    # hand-authored and run about six months AHEAD of the real clock
    # (20270131… was committed on 2026-07-31), so `prisma migrate dev` — which
    # stamps the real clock — produces a name that sorts BEFORE all 241 applied
    # migrations. `migrate deploy` then refuses the whole release, in the middle
    # of a release, after the roles Job has already run.
    #
    # The drift cannot be renamed away: the directory name is the key in
    # `_prisma_migrations` on every deployed database, so renaming would make
    # Prisma re-run 241 migrations against a schema that already has them. It
    # can only be kept monotonic, which is what this enforces. See
    # scripts/check-migration-order.mjs.
    steps:
      - uses: actions/checkout@v4
        with:
          # The check compares against the base branch, so one commit is not
          # enough history to find it.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Check migration ordering
        run: |
          BASE='${{ github.event_name == 'pull_request'
                    && format('origin/{0}', github.event.pull_request.base.ref)
                    || 'HEAD~1' }}'
          node scripts/check-migration-order.mjs "$BASE"

  workflow-heredocs:
    name: Workflow heredoc safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Guards a failure mode that has already bitten twice in one day. In an
    # UNQUOTED heredoc (`cmd <<EOF`), bash performs command substitution on
    # backticks anywhere in the body — including inside YAML and shell COMMENTS.
    #
    # db-migrate-azure.yml named two Kubernetes fields in backticks inside a
    # `kubectl apply -f - <<YAML` body. bash executed `env`, spliced the whole
    # process environment into the manifest, and the deploy died at the
    # migration step on a YAML parse error pointing at a line nobody wrote.
    #
    # restore-from-export.yml made the identical mistake and PASSED, because its
    # two fragments happened to produce empty output — it restored production
    # data while carrying a live footgun. That silence is why this is CI and not
    # a review checklist. No install needed, so it fails fast beside the heavy
    # jobs.
    steps:
      - uses: actions/checkout@v4

      - name: Lint workflow heredocs
        run: bash .github/scripts/lint-workflow-heredocs.sh

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform
    # Cache downloaded provider plugins across runs so a flaky registry/CDN
    # doesn't re-fetch them every time (the cloudflare provider is served from
    # GitHub release assets, which intermittently 504).
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: tf-providers-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: tf-providers-

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # envs/azure FIRST, because release.yml applies it. Everything below this
      # line is validated so it does not rot; this one is validated because a
      # break in it fails a deployment.
      #
      # `init -backend=false` is what lets this run with no cloud credentials —
      # validation needs the provider schemas, not the state.
      - name: Validate envs/azure
        working-directory: terraform/envs/azure
        run: bash "$GITHUB_WORKSPACE/.github/scripts/tf-validate.sh"

      # The identity and remote state that let the pipeline run Terraform at
      # all. Applied by hand exactly once (a CI runner cannot create the backend
      # it needs to store state in), which is precisely why it needs validating
      # here — nothing else ever exercises it, and it is discovered to be broken
      # at the worst possible moment: while rebuilding after losing it.
      - name: Validate bootstrap-azure
        working-directory: terraform/bootstrap-azure
        run: bash "$GITHUB_WORKSPACE/.github/scripts/tf-validate.sh"

      # GCP. No workflow deploys these any more — the fallback set was deleted
      # when the platform settled on Azure — but the configuration is kept, and
      # kept COMPILING, because "we still have the GKE definition" is only true
      # while it is valid HCL. Both envs call the shared modules/dns, so this
      # also catches a change made for Azure that breaks the other consumer.
      - name: Validate envs/prod
        working-directory: terraform/envs/prod
        run: bash "$GITHUB_WORKSPACE/.github/scripts/tf-validate.sh"

      - name: Validate bootstrap
        working-directory: terraform/bootstrap
        run: bash "$GITHUB_WORKSPACE/.github/scripts/tf-validate.sh"
