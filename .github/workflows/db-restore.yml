# Restores a Postgres dump into the Azure database, from a blob in the private
# `db-restore` container.
#
# WHY THIS EXISTS AS A WORKFLOW rather than a psql command on a laptop:
# psql-sparx-prod-cus has public access DISABLED and lives in the VNet, so the
# only thing that can reach it is something already inside the cluster. That is
# the same constraint that forces `Ensure database roles` and `Run migrations`
# into Jobs in deploy-azure.yml, and the same answer applies here.
#
# WHY THE DUMP IS NOT A KUBERNETES SECRET: a Secret caps at 1 MiB and the first
# real export was 1,093,540 bytes — over the line on day one, and it only grows.
# So the Job streams it from Blob Storage under a short-lived user-delegation
# SAS instead. The SAS is minted per run, read-only, and expires in 30 minutes;
# nothing durable is handed to the cluster and no credential is committed.
#
# DESTRUCTIVE. This drops and recreates the `public` schema. It refuses to run
# against a database that already has tables unless `force` is set, because the
# realistic mistake is not "restored the wrong file" — it is "ran migrations
# first, then tried to restore on top", which fails messily halfway through.
name: Restore database (Azure)

on:
  workflow_dispatch:
    inputs:
      blob:
        description: 'Blob name in the db-restore container'
        required: true
        default: 'sparx-20260731.sql.gz'
        type: string
      confirm:
        description: 'Type RESTORE to confirm this overwrites the database'
        required: true
        type: string
      force:
        description: 'Restore even if the database already has tables'
        required: false
        default: false
        type: boolean

concurrency:
  # Never concurrent with itself OR with a deploy: deploy-azure.yml runs
  # migrations, and a restore racing a migration would interleave DDL.
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: rg-sparx-prod-cus
  CLUSTER: aks-sparx-prod-cus
  NAMESPACE: sparx-prod
  STORAGE_ACCOUNT: stsparxprodcustfstate
  CONTAINER: db-restore

jobs:
  restore:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Check the confirmation
        run: |
          if [ '${{ inputs.confirm }}' != 'RESTORE' ]; then
            echo "::error::confirm must be exactly RESTORE. Nothing was changed."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get cluster credentials
        run: |
          az aks get-credentials --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER" --overwrite-existing

      # ---------------------------------------------------------------------
      # A user-delegation SAS (`--auth-mode login --as-user`) is signed by the
      # workflow's own Entra identity, not by a storage ACCOUNT KEY. That
      # matters: the account key would grant everything forever, including the
      # Terraform state sitting in the same account. This grants read, on one
      # blob, for 30 minutes.
      # ---------------------------------------------------------------------
      - name: Mint a read-only SAS for the dump
        id: sas
        run: |
          if ! az storage blob show --account-name "$STORAGE_ACCOUNT" \
                --container-name "$CONTAINER" --name '${{ inputs.blob }}' \
                --auth-mode login -o none 2>/dev/null; then
            echo "::error::Blob '${{ inputs.blob }}' not found in $CONTAINER. Upload it first:"
            echo "  az storage blob upload --account-name $STORAGE_ACCOUNT \\"
            echo "    --container-name $CONTAINER --name <file> --file <path> --auth-mode login"
            exit 1
          fi

          EXPIRY=$(date -u -d '30 minutes' '+%Y-%m-%dT%H:%MZ')
          SAS=$(az storage blob generate-sas \
            --account-name "$STORAGE_ACCOUNT" --container-name "$CONTAINER" \
            --name '${{ inputs.blob }}' --permissions r --expiry "$EXPIRY" \
            --auth-mode login --as-user -o tsv)

          URL="https://$STORAGE_ACCOUNT.blob.core.windows.net/$CONTAINER/${{ inputs.blob }}?$SAS"
          # Masked so it cannot surface in a log line, an error message, or the
          # `set -x` output of any later step.
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: |
          kubectl create secret generic db-restore-source -n "$NAMESPACE" \
            --from-literal=url='${{ steps.sas.outputs.url }}' \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl delete job db-restore -n "$NAMESPACE" --ignore-not-found

          # FORCE is read inside the container so the guard runs against the
          # database itself, not against something the runner assumed.
          kubectl apply -n "$NAMESPACE" -f - <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-restore
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                enableServiceLinks: false
                containers:
                  - name: restore
                    image: postgres:18-alpine
                    command: ['sh', '-euc']
                    args:
                      - |
                        # pipefail is the load-bearing one. In `curl | gunzip | psql`
                        # a plain `set -e` only inspects psql, so a download that dies
                        # halfway can still end on a statement boundary and exit 0 —
                        # a PARTIAL restore reported as a success. busybox ash
                        # supports this; the guard keeps a stricter /bin/sh from
                        # aborting the script on an unknown option.
                        set -o pipefail 2>/dev/null || echo "warning: no pipefail"

                        apk add --no-cache curl >/dev/null

                        EXISTING=\$(psql "\$AUTH_DATABASE_URL" -tAc \
                          "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
                        echo "public schema currently holds \$EXISTING tables"
                        if [ "\$EXISTING" -gt 0 ] && [ "\$FORCE" != "true" ]; then
                          echo "REFUSING: the database already has \$EXISTING tables."
                          echo "A dump restores a WHOLE schema; layering it over an existing one"
                          echo "fails partway and leaves a mix. Re-run with force=true only if"
                          echo "you intend to discard what is there."
                          exit 1
                        fi

                        # DROP SCHEMA, not --clean in the dump: the export carries no
                        # DROP statements, so a re-run would collide on every CREATE.
                        echo "resetting public schema ..."
                        psql "\$AUTH_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
                          "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;"

                        echo "streaming and restoring ..."
                        # Piped, never staged on disk: the container has no volume
                        # and the dump only grows. gunzip -c handles a plain .sql
                        # too, so the blob can be either.
                        curl -fsSL "\$RESTORE_URL" | gunzip -cf | \
                          psql "\$AUTH_DATABASE_URL" -v ON_ERROR_STOP=1 --quiet

                        echo "--- verification ---"
                        psql "\$AUTH_DATABASE_URL" -tAc \
                          "SELECT 'tables=' || count(*) FROM information_schema.tables WHERE table_schema='public'"
                        psql "\$AUTH_DATABASE_URL" -tAc \
                          "SELECT 'policies=' || count(*) FROM pg_policies WHERE schemaname='public'"
                        psql "\$AUTH_DATABASE_URL" -tAc \
                          "SELECT 'migrations=' || count(*) FROM _prisma_migrations"
                        # The apps connect as sparx_app, and the dump's GRANTs are
                        # what make that work. Prove it rather than assume it.
                        psql "\$AUTH_DATABASE_URL" -tAc \
                          "SELECT 'sparx_app_can_read=' || has_table_privilege('sparx_app','tenants','SELECT')"
                    env:
                      - name: AUTH_DATABASE_URL
                        valueFrom:
                          secretKeyRef: { name: sparx-app-secrets, key: AUTH_DATABASE_URL }
                      - name: RESTORE_URL
                        valueFrom:
                          secretKeyRef: { name: db-restore-source, key: url }
                      - name: FORCE
                        value: '${{ inputs.force }}'
          YAML

          ./.github/scripts/await-job.sh db-restore "$NAMESPACE" 1800

      - name: Drop the SAS secret
        if: always()
        run: |
          # The SAS expires on its own, but there is no reason for it to sit in
          # etcd until then.
          kubectl delete secret db-restore-source -n "$NAMESPACE" --ignore-not-found
