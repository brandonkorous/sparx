# Deploys the platform to AKS (aks-sparx-prod-cus, centralus).
#
# Authenticates to Azure by OIDC — no stored credential. The three `vars` below
# are ids, not secrets; the trust is established by the federated credential in
# terraform/bootstrap-azure, which Entra matches against this repo and ref.
#
# Runs AFTER the image build, not beside it: rolling out a SHA whose images do
# not exist yet is the single most common way this kind of pipeline fails.
name: Deploy to Azure

on:
  workflow_run:
    workflows: ['Build images (GHCR)']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy (blank = the current ref)'
        required: false
        type: string
      run_migrations:
        description: 'Run database migrations before rolling out'
        required: false
        default: true
        type: boolean

concurrency:
  # Never two rollouts at once — the second would fight the first's
  # `rollout status` and could interleave `kubectl apply` writes.
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to request the OIDC token
  packages: read

env:
  RESOURCE_GROUP: rg-sparx-prod-cus
  CLUSTER: aks-sparx-prod-cus
  NAMESPACE: sparx-prod

jobs:
  deploy:
    # Two independent guards.
    #
    # 1. AZURE_DEPLOY_ENABLED — an explicit opt-in repository variable. Until the
    #    `SPARX_APP_SECRETS_ENV` and `TYPESENSE_API_KEY` secrets and the `prod`
    #    Environment exist, an automatic deploy can only fail at the secret step,
    #    having already created a namespace. Rather than let the first push to
    #    main go red for a predictable reason, deployment stays off until it is
    #    turned on:
    #        gh variable set AZURE_DEPLOY_ENABLED -R <owner>/<repo> -b true
    #    A manual `workflow_dispatch` bypasses this, so it never blocks a
    #    deliberate run.
    #
    # 2. A failed build must not deploy. workflow_run fires on completion of ANY
    #    conclusion, including failure, so that check is load-bearing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AZURE_DEPLOY_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
          # History, not just the tip — "Resolve the images to deploy" below
          # walks backwards looking for a commit that actually has images.
          fetch-depth: 50

      # ---------------------------------------------------------------------
      # TWO different SHAs, and conflating them is a real failure.
      #
      #   manifest_sha — the commit whose k8s/ + terraform/ this run deploys.
      #                  Always HEAD of whatever was checked out.
      #   image_sha    — the newest ancestor of HEAD that has images in GHCR.
      #
      # They differ because the build workflow is PATH-FILTERED to apps/,
      # services/, packages/ and the lockfiles. That is correct — a manifest or
      # Terraform edit changes no image, and rebuilding 20 images (each
      # installing its own workspace closure) to publish identical bytes is
      # waste. The consequence is that an infra-only commit publishes NOTHING,
      # so pinning to HEAD would roll out a tag that was never pushed and every
      # Deployment would sit in ImagePullBackOff — for a commit that touched no
      # application code at all.
      #
      # `docker buildx imagetools inspect` is the existence check: it reads the
      # manifest from the registry without pulling any layers.
      # ---------------------------------------------------------------------
      - name: Resolve the images to deploy
        id: sha
        run: |
          MANIFEST_SHA=$(git rev-parse HEAD)
          echo "manifest_sha=$MANIFEST_SHA" >> "$GITHUB_OUTPUT"

          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          REPO='ghcr.io/${{ github.repository }}'
          IMAGE_SHA=''
          for sha in $(git rev-list -n 50 HEAD); do
            if docker buildx imagetools inspect "$REPO/api-rest:$sha" >/dev/null 2>&1; then
              IMAGE_SHA="$sha"
              break
            fi
            echo "no images for $sha"
          done

          if [ -z "$IMAGE_SHA" ]; then
            echo "::error::No commit in the last 50 has images in $REPO. Run the build workflow first."
            exit 1
          fi

          echo "image_sha=$IMAGE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$IMAGE_SHA" = "$MANIFEST_SHA" ]; then
            echo "Deploying $MANIFEST_SHA (manifests and images)."
          else
            echo "::notice::Manifests from $MANIFEST_SHA; images from $IMAGE_SHA (no source changed since)."
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get cluster credentials
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER" \
            --overwrite-existing
          kubectl version --client

      # ---------------------------------------------------------------------
      # Secrets. Recreated every deploy from repository secrets so the cluster
      # never holds a value that has been rotated in GitHub.
      #
      # `create --dry-run | apply` is the idempotent form: plain `create` fails
      # on the second run, and `apply` alone cannot build a Secret from literals.
      # ---------------------------------------------------------------------
      - name: Sync secrets
        env:
          APP_SECRETS: ${{ secrets.SPARX_APP_SECRETS_ENV }}
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          if [ -z "$APP_SECRETS" ]; then
            echo "::error::SPARX_APP_SECRETS_ENV is empty. See k8s/azure/README.md."
            exit 1
          fi

          # A dotenv blob, so one repo secret carries the whole bundle rather
          # than ~30 individually-managed ones.
          printf '%s' "$APP_SECRETS" > /tmp/app.env
          kubectl create secret generic sparx-app-secrets -n "$NAMESPACE" \
            --from-env-file=/tmp/app.env \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/app.env

          kubectl create secret generic typesense-secrets -n "$NAMESPACE" \
            --from-literal=api-key="$TYPESENSE_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Pull secret for the private GHCR namespace. GITHUB_TOKEN is scoped to
          # this run, so it is refreshed on every deploy by construction.
          kubectl create secret docker-registry ghcr -n "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username='${{ github.actor }}' \
            --docker-password='${{ secrets.GITHUB_TOKEN }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      # ---------------------------------------------------------------------
      # Cloudflare Tunnel.
      #
      # This is what makes the platform REACHABLE. Without it cloudflared runs
      # with no configuration, connects to nothing, and every public hostname
      # stays dark however healthy the pods look.
      #
      # A LOCALLY-managed tunnel: the ingress rule lives here, not in the
      # Cloudflare dashboard. One catch-all to Caddy, which already routes ~20
      # hostnames by Host header — a dashboard-managed tunnel would mean
      # re-entering every one of them and keeping two sources of truth in sync.
      #
      # EXACTLY ONE RULE, and no trailing `http_status:404`. cloudflared requires
      # the LAST rule to be a catch-all and refuses to start if any EARLIER rule
      # is one; a hostname-less rule matches everything, so a 404 placed after it
      # is unreachable and cloudflared rejects the whole config:
      #     Rule #1 is matching the hostname '', but this will match every
      #     hostname, meaning the rules which follow it will never be triggered.
      # The Caddy rule already IS the required terminal catch-all. Adding the
      # conventional 404 line below it does not make the config more defensive,
      # it makes it invalid — and a tunnel that will not start means every
      # hostname stays dark while the pods all look healthy.
      # ---------------------------------------------------------------------
      - name: Configure Cloudflare Tunnel
        env:
          TUNNEL_CREDENTIALS: ${{ secrets.CLOUDFLARE_TUNNEL_CREDENTIALS }}
        run: |
          if [ -z "$TUNNEL_CREDENTIALS" ]; then
            echo "::warning::CLOUDFLARE_TUNNEL_CREDENTIALS is unset — cloudflared will not connect and no public hostname will resolve. Everything else still deploys."
            exit 0
          fi

          printf '%s' "$TUNNEL_CREDENTIALS" > /tmp/creds.json
          TUNNEL_ID=$(python3 -c "import json;print(json.load(open('/tmp/creds.json'))['TunnelID'])")

          kubectl create secret generic cloudflared-credentials -n "$NAMESPACE"             --from-file=credentials.json=/tmp/creds.json             --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/creds.json

          cat > /tmp/cf-config.yaml <<CFG
          tunnel: $TUNNEL_ID
          credentials-file: /etc/cloudflared/creds/credentials.json
          no-autoupdate: true
          ingress:
            - service: http://caddy.$NAMESPACE.svc.cluster.local:80
          CFG
          kubectl create configmap cloudflared-config -n "$NAMESPACE"             --from-file=config.yaml=/tmp/cf-config.yaml             --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/cf-config.yaml

          # The pods mount both by fixed name, so a change here needs a restart
          # to be picked up. Ignored when the Deployment does not exist yet.
          kubectl rollout restart deployment/cloudflared -n "$NAMESPACE" 2>/dev/null || true

      # ---------------------------------------------------------------------
      # Database roles.
      #
      # `sparx_app` — the unprivileged NOBYPASSRLS role every application
      # connection uses — comes from a Docker-image entrypoint convention
      # (packages/db/docker/init/01-roles.sql) that a MANAGED Postgres will never
      # run. The server is VNet-private, so it also cannot be created from a
      # laptop. Doing it as an in-cluster Job is the only automated path.
      #
      # Idempotent, so it is safe on every deploy.
      # ---------------------------------------------------------------------
      # `github.event_name != 'workflow_dispatch'` first, and NOT
      # `inputs.run_migrations != false`. On a workflow_run there are no inputs,
      # so `inputs.run_migrations` is null — and GitHub compares mismatched types
      # by casting both to a number, where null and false are both 0. The
      # expression that reads as "unless explicitly turned off" therefore
      # evaluates FALSE on exactly the automatic path, and this step plus the
      # migration below were silently skipped on the first real deploy. The pods
      # rolled out fine and then crashlooped on `sparx_app` authentication,
      # because the role the whole platform connects as had never been created.
      - name: Ensure database roles
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_migrations }}
        run: |
          kubectl create configmap db-bootstrap-roles -n "$NAMESPACE" \
            --from-file=azure-bootstrap.sql=packages/db/sql/azure-bootstrap.sql \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl delete job db-roles -n "$NAMESPACE" --ignore-not-found
          kubectl apply -n "$NAMESPACE" -f - <<'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-roles
          spec:
            backoffLimit: 1
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                enableServiceLinks: false
                containers:
                  - name: psql
                    image: postgres:18-alpine
                    command: ['sh', '-c']
                    args:
                      - psql "$AUTH_DATABASE_URL" -v ON_ERROR_STOP=1 -v app_password="$SPARX_APP_PASSWORD" -f /sql/azure-bootstrap.sql
                    env:
                      - name: AUTH_DATABASE_URL
                        valueFrom:
                          secretKeyRef: { name: sparx-app-secrets, key: AUTH_DATABASE_URL }
                      - name: SPARX_APP_PASSWORD
                        valueFrom:
                          secretKeyRef: { name: sparx-app-secrets, key: SPARX_APP_PASSWORD }
                    volumeMounts:
                      - { name: sql, mountPath: /sql, readOnly: true }
                volumes:
                  - name: sql
                    configMap: { name: db-bootstrap-roles }
          YAML
          kubectl wait --for=condition=complete job/db-roles -n "$NAMESPACE" --timeout=300s \
            || { kubectl logs job/db-roles -n "$NAMESPACE" --tail=50; exit 1; }

      - name: Run migrations
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_migrations }}
        run: |
          kubectl delete job db-migrate -n "$NAMESPACE" --ignore-not-found
          kubectl apply -n "$NAMESPACE" -f - <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-migrate
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                enableServiceLinks: false
                imagePullSecrets: [{ name: ghcr }]
                containers:
                  - name: migrate
                    # image_sha, not manifest_sha: the migration runner is an
                    # IMAGE, so it has to be one that was actually published.
                    image: ghcr.io/${{ github.repository }}/db:${{ steps.sha.outputs.image_sha }}
                    envFrom:
                      - configMapRef: { name: sparx-app-env }
                      - secretRef: { name: sparx-app-secrets }
                    env:
                      # Migrations and the hand-edited RLS SQL run as the OWNER
                      # role, not the RLS-constrained role the apps use.
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef: { name: sparx-app-secrets, key: AUTH_DATABASE_URL }
          YAML
          kubectl wait --for=condition=complete job/db-migrate -n "$NAMESPACE" --timeout=900s \
            || { kubectl logs job/db-migrate -n "$NAMESPACE" --tail=80; exit 1; }

      # ---------------------------------------------------------------------
      # Roll out. Pin every image to this SHA — never `latest`, so a rollback is
      # a real thing and a node cannot serve a stale cached layer.
      # ---------------------------------------------------------------------
      - name: Pin images and apply
        run: |
          SHA='${{ steps.sha.outputs.image_sha }}'
          REPO='ghcr.io/${{ github.repository }}'

          # Rewrite the placeholder tag in place rather than shelling out to
          # `kustomize edit`. Two reasons, both learned the hard way:
          #
          #   1. `kustomize edit set image OLD=NEW:TAG` matches on the name as it
          #      appears in the MANIFESTS, not the one it rewrites TO. This step
          #      used to pass the ghcr name, which matched no existing entry, so
          #      kustomize APPENDED a dead one and left the real mapping on
          #      `newTag: latest`. Every "pinned" rollout shipped a mutable tag
          #      and `kubectl rollout undo` had nothing to roll back to. It
          #      failed silently because appending is a legitimate operation.
          #   2. `kustomize` is not part of kubectl and is not guaranteed on the
          #      runner. `kubectl kustomize` BUILDS but has no `edit`, so there
          #      was no fallback — only an unpinned deploy that exits 0.
          #
          # Every entry in k8s/azure/kustomization.yaml carries `newTag: latest`
          # as its placeholder, so one substitution covers all 19, and the guard
          # below is what actually enforces the result.
          sed -i "s|^\( *newTag: \)latest$|\1$SHA|" k8s/azure/kustomization.yaml

          # Prove the pin landed before applying. A silent no-op here is
          # invisible until someone wonders why a rollback did nothing.
          #
          # Scoped to OUR images. `caddy:2-alpine` and `cloudflare/cloudflared:
          # latest` are upstream third-party tags that this overlay does not
          # rewrite and should not — matching on a bare `:latest` would fail
          # every deploy on cloudflared.
          UNPINNED=$(kubectl kustomize k8s/azure \
            | grep -E "^ *image: ($REPO/|sparx/)" \
            | grep -vE ":[0-9a-f]{40}$" | sort -u || true)
          if [ -n "$UNPINNED" ]; then
            echo "::error::Unpinned sparx image survived the rewrite:"
            echo "$UNPINNED"
            exit 1
          fi

          kubectl apply -k k8s/azure

      - name: Wait for rollout
        run: |
          # Deployments only — StatefulSets and Jobs have their own lifecycles.
          #
          # One `rollout status` per Deployment, in PARALLEL. `deployment --all`
          # is not a thing (`error: unknown flag: --all`), and looping serially
          # would multiply the timeout by 21 in the worst case even though the
          # rollouts themselves are concurrent. 2 vCPU means a cold start of 20
          # containers is minutes, not seconds, so the timeout is generous.
          mkdir -p /tmp/rollout
          for d in $(kubectl get deploy -n "$NAMESPACE" -o name); do
            name="${d#deployment.apps/}"
            kubectl rollout status "$d" -n "$NAMESPACE" --timeout=15m \
              > "/tmp/rollout/$name.log" 2>&1 &
          done

          # `wait -n` reaps whichever finishes first; the exit codes are
          # collected rather than short-circuited so ONE stuck Deployment does
          # not hide the state of the other twenty.
          failed=0
          for _ in $(kubectl get deploy -n "$NAMESPACE" -o name); do
            wait -n || failed=1
          done

          for f in /tmp/rollout/*.log; do
            printf '%-28s %s\n' "$(basename "$f" .log)" "$(tail -n1 "$f")"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more Deployments did not roll out."
            kubectl get pods -n "$NAMESPACE" \
              --field-selector=status.phase!=Running -o wide || true
            kubectl get events -n "$NAMESPACE" \
              --sort-by=.lastTimestamp | tail -30 || true
            exit 1
          fi

      - name: Report
        if: always()
        run: |
          {
            echo '### Deployed'
            echo ''
            echo '| | commit |'
            echo '| --- | --- |'
            echo '| manifests | `${{ steps.sha.outputs.manifest_sha }}` |'
            echo '| images | `${{ steps.sha.outputs.image_sha }}` |'
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"
          kubectl get pods -n "$NAMESPACE" -o wide >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
