# Deploys the platform to AKS (aks-sparx-prod-cus, centralus).
#
# Authenticates to Azure by OIDC — no stored credential. The three `vars` below
# are ids, not secrets; the trust is established by the federated credential in
# terraform/bootstrap-azure, which Entra matches against this repo and ref.
#
# Runs AFTER the image build, not beside it: rolling out a SHA whose images do
# not exist yet is the single most common way this kind of pipeline fails.
name: Deploy (Azure)

on:
  # Application code → build first, deploy after. The build is path-filtered to
  # apps/, services/, packages/ and the lockfiles.
  workflow_run:
    workflows: ['Build images (GHCR)']
    types: [completed]
    branches: [main]

  # Deployment-shaping changes that build NO image. Without this trigger a
  # manifest-only commit was undeployable: it matched none of the build's path
  # filters, so no build ran, so no `workflow_run` fired, so this workflow never
  # started — and the change sat on main looking merged while the cluster kept
  # serving the old manifests. Every path below changes what gets applied
  # without changing a single byte of any image.
  #
  # The `prepare` job already handles this case correctly and always did: it
  # resolves `image_sha` by walking back to the newest ancestor that actually
  # has images in GHCR, precisely so an infra-only commit does not roll out a
  # tag that was never pushed. The logic anticipated the deploy; the trigger to
  # reach it was missing.
  #
  # A commit touching BOTH application code and these paths fires both triggers
  # and deploys twice. The `deploy-azure` concurrency group serialises them and
  # the image build's run lands second with the newer images, so it converges —
  # one redundant rollout is a better failure than a silently undeployed
  # manifest.
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy-azure.yml'
      - '.github/workflows/db-migrate-azure.yml'
      - '.github/scripts/**'
      # Bundle sources. A bundle-only commit changes no image path, so without
      # this the deploy never fires and step 2b never publishes it.
      - 'marketplace-catalog/**'

  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy (blank = the current ref)'
        required: false
        type: string
      environment:
        description: 'Target environment'
        required: false
        default: prod
        type: choice
        options: [prod]
      run_migrations:
        description: 'Run database migrations before rolling out'
        required: false
        default: true
        type: boolean
      run_data:
        description: 'Apply platform data (seed + marketplace ingest) after rolling out'
        required: false
        default: true
        type: boolean

concurrency:
  # Never two rollouts at once — the second would fight the first's
  # `rollout status` and could interleave `kubectl apply` writes.
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to request the OIDC token
  packages: read

env:
  # Environment as a VALUE, not part of the filename. This workflow is named for
  # its PROVIDER; `prod` is simply the only environment on Azure today, and
  # adding staging is a new option plus these three values rather than a second
  # deploy-azure-staging.yml maintained in parallel.
  ENVIRONMENT: ${{ inputs.environment || 'prod' }}
  RESOURCE_GROUP: rg-sparx-prod-cus
  CLUSTER: aks-sparx-prod-cus
  NAMESPACE: sparx-prod

# FOUR JOBS, one of which is a REUSABLE WORKFLOW.
#
#   prepare  → secrets, tunnel, and the image SHA everything else pins to
#   migrate  → db-migrate-azure.yml, the same workflow you can dispatch alone
#   rollout  → pin images, apply, wait
#   data     → platform seed + marketplace ingest (step 2b)
#
# `data` closes a hole in the pipeline rather than adding a feature. The first
# three take infrastructure and containers to a running state and stop there:
# `migrate` moves the SCHEMA and nothing ever put a row in it. Platform content
# could therefore be committed, merged and deployed while never appearing on the
# platform — which is what happened to the marketplace catalog. See the job.
#
# The migration used to be two steps inlined here. Extracting it is what lets
# `DB Migrate (Azure)` exist as a peer of `DB Migrate (GCP)` without a second
# copy of the Jobs drifting out of sync — GitHub only allows `uses:` at the JOB
# level, so the split is the price of having one definition.
#
# Ordering is not incidental: secrets must exist before the migration reads
# them, and the migration must finish before pods start, or new code meets the
# old schema.
jobs:
  prepare:
    # Two independent guards.
    #
    # 1. AZURE_DEPLOY_ENABLED — an explicit opt-in repository variable. Until the
    #    `SPARX_APP_SECRETS_ENV` and `TYPESENSE_API_KEY` secrets and the `prod`
    #    Environment exist, an automatic deploy can only fail at the secret step,
    #    having already created a namespace. Rather than let the first push to
    #    main go red for a predictable reason, deployment stays off until it is
    #    turned on:
    #        gh variable set AZURE_DEPLOY_ENABLED -R <owner>/<repo> -b true
    #    A manual `workflow_dispatch` bypasses this, so it never blocks a
    #    deliberate run.
    #
    # 2. A failed build must not deploy. workflow_run fires on completion of ANY
    #    conclusion, including failure, so that check is load-bearing.
    #
    # The `push` arm is spelled as its own STRING comparison rather than folded
    # into the conclusion check. On a push event `github.event.workflow_run` does
    # not exist, so `…conclusion == 'success'` is false and a condition relying
    # on it alone skips the job silently — which is the same class of bug that
    # made `inputs.run_migrations != false` skip every migration on a
    # workflow_run (mismatched types both cast to 0, so `null != false` is
    # FALSE). Comparing `github.event_name` to a literal has no coercion in it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AZURE_DEPLOY_ENABLED == 'true' &&
       (github.event_name == 'push' ||
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    environment: prod

    # Resolved once and handed downstream. The migrate and rollout jobs run on
    # fresh runners with no shared filesystem, so re-deriving these would mean
    # re-walking GHCR twice and risking two jobs pinning different SHAs.
    outputs:
      manifest_sha: ${{ steps.sha.outputs.manifest_sha }}
      image_sha: ${{ steps.sha.outputs.image_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
          # History, not just the tip — "Resolve the images to deploy" below
          # walks backwards looking for a commit that actually has images.
          fetch-depth: 50

      # ---------------------------------------------------------------------
      # TWO different SHAs, and conflating them is a real failure.
      #
      #   manifest_sha — the commit whose k8s/ + terraform/ this run deploys.
      #                  Always HEAD of whatever was checked out.
      #   image_sha    — the newest ancestor of HEAD that has images in GHCR.
      #
      # They differ because the build workflow is PATH-FILTERED to apps/,
      # services/, packages/ and the lockfiles. That is correct — a manifest or
      # Terraform edit changes no image, and rebuilding 20 images (each
      # installing its own workspace closure) to publish identical bytes is
      # waste. The consequence is that an infra-only commit publishes NOTHING,
      # so pinning to HEAD would roll out a tag that was never pushed and every
      # Deployment would sit in ImagePullBackOff — for a commit that touched no
      # application code at all.
      #
      # `docker buildx imagetools inspect` is the existence check: it reads the
      # manifest from the registry without pulling any layers.
      # ---------------------------------------------------------------------
      - name: Resolve the images to deploy
        id: sha
        run: |
          MANIFEST_SHA=$(git rev-parse HEAD)
          echo "manifest_sha=$MANIFEST_SHA" >> "$GITHUB_OUTPUT"

          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          REPO='ghcr.io/${{ github.repository }}'
          IMAGE_SHA=''
          for sha in $(git rev-list -n 50 HEAD); do
            if docker buildx imagetools inspect "$REPO/api-rest:$sha" >/dev/null 2>&1; then
              IMAGE_SHA="$sha"
              break
            fi
            echo "no images for $sha"
          done

          if [ -z "$IMAGE_SHA" ]; then
            echo "::error::No commit in the last 50 has images in $REPO. Run the build workflow first."
            exit 1
          fi

          echo "image_sha=$IMAGE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$IMAGE_SHA" = "$MANIFEST_SHA" ]; then
            echo "Deploying $MANIFEST_SHA (manifests and images)."
          else
            echo "::notice::Manifests from $MANIFEST_SHA; images from $IMAGE_SHA (no source changed since)."
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get cluster credentials
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER" \
            --overwrite-existing
          kubectl version --client

      # ---------------------------------------------------------------------
      # Secrets. Recreated every deploy from repository secrets so the cluster
      # never holds a value that has been rotated in GitHub.
      #
      # `create --dry-run | apply` is the idempotent form: plain `create` fails
      # on the second run, and `apply` alone cannot build a Secret from literals.
      # ---------------------------------------------------------------------
      - name: Sync secrets
        env:
          APP_SECRETS: ${{ secrets.SPARX_APP_SECRETS_ENV }}
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          if [ -z "$APP_SECRETS" ]; then
            echo "::error::SPARX_APP_SECRETS_ENV is empty. See k8s/azure/README.md."
            exit 1
          fi

          # A dotenv blob, so one repo secret carries the whole bundle rather
          # than ~30 individually-managed ones.
          printf '%s' "$APP_SECRETS" > /tmp/app.env

          # KEY_B64=<base64> → KEY=<decoded>, for values a dotenv line cannot
          # carry safely.
          #
          # Not hypothetical: OPERATOR_AUTH_SECRET ends with a CARRIAGE RETURN
          # (45 bytes, not 44) in both GCP Secret Manager and the cluster. Better
          # Auth uses the secret's exact bytes as key material for the encrypted
          # TOTP secrets and backup codes, so that trailing \r is load-bearing —
          # drop it and every operator's authenticator AND their backup codes
          # stop verifying, which is precisely the failure this deploy is
          # repairing. A trailing \r before a newline is invisible in a browser
          # textarea and does not survive a copy-paste, so round-tripping the raw
          # value through a repo secret is a trap that re-arms itself every time
          # the blob is edited. STRIPE_WEBHOOK_SECRET_SPARX_PAY is the same shape.
          #
          # base64 has no such ambiguity. Prefer it for ANY secret with leading
          # or trailing whitespace rather than trying to preserve the whitespace.
          # The _B64 keys are NEVER decoded into the env file. They are held back
          # and written straight into the Secret's `data` field after it is
          # created, because `data` is itself base64 — so the bytes reach the
          # kubelet without passing through a single text parser.
          #
          # Decoding them here would defeat the point. `--from-env-file` reads
          # LINES, and a value whose last byte is \r is indistinguishable from a
          # CRLF line ending to any such parser; trimming it is the reasonable
          # thing for a text format to do, and it would silently reconstruct the
          # exact 44-byte secret that broke 2FA in the first place. Shell text
          # tools do the same: grep and cut both ate the \r while this was being
          # verified, which is how the bug hid for so long.
          grep -v '_B64=' /tmp/app.env > /tmp/app.env.plain || true
          grep '_B64=' /tmp/app.env > /tmp/app.env.b64 || true
          B64_COUNT=$(wc -l < /tmp/app.env.b64 | tr -d ' ')

          # OPERATOR_DATABASE_URL — derived when absent, never silently omitted.
          #
          # apps/admin talks to the wize_admin schema as `wize_operator`, a
          # different role from the one in DATABASE_URL. GCP carried this as its
          # own `operator-database-url` secret (terraform/envs/prod/main.tf) and
          # Azure never got an equivalent, so the var was simply missing — and
          # packages/operator-auth/src/db.ts falls back to a LOCALHOST dev
          # default when it is unset. The admin pod therefore dialled
          # 127.0.0.1:5544 in-cluster and every sign-in returned 500. Nothing
          # else failed, so the console looked deployed and healthy.
          #
          # Deriving it is sound rather than a guess: packages/db/sql/azure-bootstrap.sql
          # sets wize_operator's password from the SAME app_password as sparx_app
          # ("ALTER ROLE wize_operator ... PASSWORD :'app_password'"), so on this
          # provider the two differ only by role name. Supplying
          # OPERATOR_DATABASE_URL explicitly in SPARX_APP_SECRETS_ENV overrides
          # this entirely, which is what to do the moment those passwords diverge.
          if ! grep -q '^OPERATOR_DATABASE_URL' /tmp/app.env; then
            DB_URL=$(grep -m1 '^DATABASE_URL=' /tmp/app.env.plain | cut -d= -f2-)
            if [ -z "$DB_URL" ]; then
              echo "::error::DATABASE_URL missing from SPARX_APP_SECRETS_ENV; cannot derive OPERATOR_DATABASE_URL."
              exit 1
            fi
            OP_URL=$(printf '%s' "$DB_URL" | sed 's#://sparx_app:#://wize_operator:#')
            case "$OP_URL" in
              *\?*) OP_URL="$OP_URL&schema=wize_admin" ;;
              *)    OP_URL="$OP_URL?schema=wize_admin" ;;
            esac
            printf 'OPERATOR_DATABASE_URL=%s\n' "$OP_URL" >> /tmp/app.env.plain
            echo "OPERATOR_DATABASE_URL not supplied; derived it from DATABASE_URL as wize_operator."
          fi

          kubectl create secret generic sparx-app-secrets -n "$NAMESPACE" \
            --from-env-file=/tmp/app.env.plain \
            --dry-run=client -o yaml | kubectl apply -f -

          # Graft the whitespace-bearing values in as RAW BASE64. A Secret's
          # `data` field is base64 by definition, so the kubelet writes exactly
          # the bytes the repo secret carried — no line parsing, no trimming,
          # nothing left to lose them.
          if [ "$B64_COUNT" -gt 0 ]; then
            PATCH='{"data":{'
            SEP=''
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              key=${line%%=*}
              PATCH="$PATCH$SEP\"${key%_B64}\":\"${line#*=}\""
              SEP=','
            done < /tmp/app.env.b64
            PATCH="$PATCH}}"
            printf '%s' "$PATCH" > /tmp/app.b64.patch
            kubectl patch secret sparx-app-secrets -n "$NAMESPACE" \
              --type=merge --patch-file=/tmp/app.b64.patch
            rm -f /tmp/app.b64.patch
            echo "Applied $B64_COUNT base64 value(s) straight to the Secret's data field."
          fi

          rm -f /tmp/app.env /tmp/app.env.plain /tmp/app.env.b64

          kubectl create secret generic typesense-secrets -n "$NAMESPACE" \
            --from-literal=api-key="$TYPESENSE_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Pull secret for the private GHCR namespace. GITHUB_TOKEN is scoped to
          # this run, so it is refreshed on every deploy by construction.
          kubectl create secret docker-registry ghcr -n "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username='${{ github.actor }}' \
            --docker-password='${{ secrets.GITHUB_TOKEN }}' \
            --dry-run=client -o yaml | kubectl apply -f -

  # The middle of the pipeline, and a WORKFLOW rather than two steps so that
  # `DB Migrate (Azure)` is a real peer of `DB Migrate (GCP)` — dispatchable
  # on its own to re-run a failed migration or bring a restored database
  # forward, with no second copy of the Jobs to drift out of sync.
  #
  # `secrets: inherit` is required, not decorative: a called workflow
  # inherits nothing by default, and this one needs the OIDC variables and
  # GITHUB_TOKEN to reach both Azure and GHCR.
  migrate:
    needs: prepare
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_migrations }}
    uses: ./.github/workflows/db-migrate-azure.yml
    with:
      image_sha: ${{ needs.prepare.outputs.image_sha }}
      environment: ${{ inputs.environment || 'prod' }}
    secrets: inherit

  rollout:
    needs: [prepare, migrate]
    # `always()` plus explicit result checks, because a `needs` on a SKIPPED
    # job skips this one too — and run_migrations=false is a legitimate way
    # to deploy. Skipped is acceptable; failed or cancelled is not, and
    # rolling out new code over an un-migrated schema is the exact failure
    # this ordering exists to prevent.
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.migrate.result != 'failure' && needs.migrate.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get cluster credentials
        run: |
          az aks get-credentials --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER" --overwrite-existing

      # ---------------------------------------------------------------------
      # Roll out. Pin every image to this SHA — never `latest`, so a rollback is
      # a real thing and a node cannot serve a stale cached layer.
      # ---------------------------------------------------------------------
      - name: Pin images and apply
        run: |
          SHA='${{ needs.prepare.outputs.image_sha }}'
          REPO='ghcr.io/${{ github.repository }}'

          # Rewrite the placeholder tag in place rather than shelling out to
          # `kustomize edit`. Two reasons, both learned the hard way:
          #
          #   1. `kustomize edit set image OLD=NEW:TAG` matches on the name as it
          #      appears in the MANIFESTS, not the one it rewrites TO. This step
          #      used to pass the ghcr name, which matched no existing entry, so
          #      kustomize APPENDED a dead one and left the real mapping on
          #      `newTag: latest`. Every "pinned" rollout shipped a mutable tag
          #      and `kubectl rollout undo` had nothing to roll back to. It
          #      failed silently because appending is a legitimate operation.
          #   2. `kustomize` is not part of kubectl and is not guaranteed on the
          #      runner. `kubectl kustomize` BUILDS but has no `edit`, so there
          #      was no fallback — only an unpinned deploy that exits 0.
          #
          # Every entry in k8s/azure/kustomization.yaml carries `newTag: latest`
          # as its placeholder, so one substitution covers all 19, and the guard
          # below is what actually enforces the result.
          sed -i "s|^\( *newTag: \)latest$|\1$SHA|" k8s/azure/kustomization.yaml

          # Prove the pin landed before applying. A silent no-op here is
          # invisible until someone wonders why a rollback did nothing.
          #
          # Scoped to OUR images. `caddy:2-alpine` and `cloudflare/cloudflared:
          # latest` are upstream third-party tags that this overlay does not
          # rewrite and should not — matching on a bare `:latest` would fail
          # every deploy on cloudflared.
          UNPINNED=$(kubectl kustomize k8s/azure \
            | grep -E "^ *image: ($REPO/|sparx/)" \
            | grep -vE ":[0-9a-f]{40}$" | sort -u || true)
          if [ -n "$UNPINNED" ]; then
            echo "::error::Unpinned sparx image survived the rewrite:"
            echo "$UNPINNED"
            exit 1
          fi

          kubectl apply -k k8s/azure

      - name: Wait for rollout
        run: |
          # Deployments only — StatefulSets and Jobs have their own lifecycles.
          #
          # One `rollout status` per Deployment, in PARALLEL. `deployment --all`
          # is not a thing (`error: unknown flag: --all`), and looping serially
          # would multiply the timeout by 21 in the worst case even though the
          # rollouts themselves are concurrent. 2 vCPU means a cold start of 20
          # containers is minutes, not seconds, so the timeout is generous.
          mkdir -p /tmp/rollout
          for d in $(kubectl get deploy -n "$NAMESPACE" -o name); do
            name="${d#deployment.apps/}"
            kubectl rollout status "$d" -n "$NAMESPACE" --timeout=15m \
              > "/tmp/rollout/$name.log" 2>&1 &
          done

          # `wait -n` reaps whichever finishes first; the exit codes are
          # collected rather than short-circuited so ONE stuck Deployment does
          # not hide the state of the other twenty.
          failed=0
          for _ in $(kubectl get deploy -n "$NAMESPACE" -o name); do
            wait -n || failed=1
          done

          for f in /tmp/rollout/*.log; do
            printf '%-28s %s\n' "$(basename "$f" .log)" "$(tail -n1 "$f")"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more Deployments did not roll out."
            kubectl get pods -n "$NAMESPACE" \
              --field-selector=status.phase!=Running -o wide || true
            kubectl get events -n "$NAMESPACE" \
              --sort-by=.lastTimestamp | tail -30 || true
            exit 1
          fi

      # ---------------------------------------------------------------------
      # The ingress cutover. RUNS LAST, AND ONLY DEMOLISHES WHAT IT HAS ALREADY
      # REPLACED.
      #
      # These two steps used to sit in `prepare`, which was a genuine
      # foot-gun: `prepare` runs BEFORE the rollout applies the new Service, so
      # the tunnel — the only thing making the platform reachable — was deleted
      # before its replacement existed. If the LoadBalancer then failed to get an
      # address for ANY reason (the reserved public IP not created yet, an Azure
      # control-plane degradation, a quota refusal), the platform went dark and
      # stayed dark, with the deploy reporting success.
      #
      # Now the tunnel is retired only after `kubectl get svc caddy` reports an
      # actual address. Every ordering is safe:
      #
      #   Terraform not applied yet → Service pending → tunnel KEPT, platform
      #     stays up on the tunnel, warning in the summary.
      #   Terraform applied, LB has an address → tunnel retired.
      #   Cluster never had a tunnel → deletes are no-ops.
      #
      # The cost of being wrong in the safe direction is one redundant
      # cloudflared Deployment until the next deploy. The cost of being wrong in
      # the other direction is the whole platform.
      # ---------------------------------------------------------------------
      - name: Resolve the ingress address
        id: ingress
        run: |
          # AKS provisions a Standard Load Balancer from the `type: LoadBalancer`
          # Service in k8s/ingress and writes the address into `status`. Nothing
          # in this repo asks Azure for one — that is the portability contract,
          # and why the same manifests work unchanged on GKE and EKS.
          for _ in $(seq 1 30); do
            IP=$(kubectl get svc caddy -n "$NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            [ -n "$IP" ] && break
            sleep 10
          done

          if [ -z "$IP" ]; then
            echo "ip=" >> "$GITHUB_OUTPUT"
            echo "::warning::caddy has no LoadBalancer address after 5m. The Cloudflare Tunnel is being KEPT so the platform stays reachable. Most likely the reserved public IP does not exist yet — run 'terraform apply' in terraform/envs/azure (creates azurerm_public_ip.ingress), then re-run this deploy."
            {
              echo '### Ingress — NOT cut over'
              echo ''
              echo 'The `caddy` Service has no LoadBalancer address, so the tunnel was left in place and the platform is still reachable through it.'
              echo ''
              echo 'Fix: `terraform apply` in `terraform/envs/azure` to create `azurerm_public_ip.ingress`, then re-run this deploy.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          {
            echo '### Ingress'
            echo ''
            echo "\`$IP\` — point DNS here."
            echo ''
            echo '| Record | Mode | Why |'
            echo '| --- | --- | --- |'
            echo '| `*.sparx.zone` | DNS-only | on-demand ACME needs the challenge to reach the origin |'
            echo '| `media-direct.sparx.works` | DNS-only | social fetchers reject Cloudflare’s 206 on a Range request |'
            echo '| everything else | proxied | Full (strict) |'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only once the replacement is demonstrably serving. cloudflared is no
      # longer part of this overlay, so `kubectl apply -k` will not recreate it —
      # but apply does not PRUNE, so a Deployment left by an earlier revision of
      # this workflow keeps running and holding a second, now-unrouted path to
      # Caddy until something deletes it explicitly.
      - name: Retire the Cloudflare Tunnel
        if: steps.ingress.outputs.ip != ''
        run: |
          for r in deployment/cloudflared configmap/cloudflared-config secret/cloudflared-credentials; do
            kubectl delete "$r" -n "$NAMESPACE" --ignore-not-found
          done
          echo "Tunnel retired — ingress is ${{ steps.ingress.outputs.ip }}."

      - name: Report
        if: always()
        run: |
          {
            echo '### Deployed'
            echo ''
            echo '| | commit |'
            echo '| --- | --- |'
            echo '| manifests | `${{ needs.prepare.outputs.manifest_sha }}` |'
            echo '| images | `${{ needs.prepare.outputs.image_sha }}` |'
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"
          kubectl get pods -n "$NAMESPACE" -o wide >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

  # ---------------------------------------------------------------------------
  # STEP 2b — DATA. The stage this pipeline did not have.
  #
  # Infrastructure, then containers, then DATA, then it is running. `migrate`
  # only moves the SCHEMA; nothing in this workflow ever put a row in it. So the
  # platform's own content — the marketplace catalog, the global component
  # library, the starter legal documents, the theme and component bundles under
  # marketplace-catalog/ — could be committed, reviewed, merged and deployed
  # while remaining completely absent from the running platform. That is not a
  # hypothetical: marketplace_themes held ZERO rows against 20 committed theme
  # bundles, on BOTH clouds, and /market/themes served its empty state to every
  # visitor for a month. Nothing was broken. There was simply no step that
  # published it.
  #
  # Both halves are idempotent — every write is an upsert or a version-guarded
  # artifact — which is precisely what lets this run unattended on every deploy
  # instead of being a workflow someone has to remember to dispatch. A deploy
  # that changes no data re-upserts a few hundred rows and exits.
  #
  # AFTER the rollout, not before. The ingest writes artifacts to the sparx-media
  # PVC and is pinned by podAffinity to api-rest's node, so it wants the new
  # api-rest pod already settled — including the fsGroup that makes that volume
  # writable at all. Running data before the rollout would have it race the pod
  # it depends on.
  #
  # A failure here fails the deploy. The previous behaviour — platform data
  # applied by a hand-run workflow, errors logged as warnings — is exactly how a
  # green pipeline and an empty catalog were true at the same time.
  # ---------------------------------------------------------------------------
  data:
    needs: [prepare, rollout]
    if: >-
      always() && needs.rollout.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_data)
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get cluster credentials
        run: |
          az aks get-credentials --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER" --overwrite-existing

      # Platform rows resolved from the in-code registries: the sparx-core
      # marketplace catalog, the global platform_components library, and starter
      # legal pages for any tenant that predates the legal-seed-worker.
      #
      # prisma/seed-platform.ts, NOT prisma/seed.ts — the latter provisions a
      # demo tenant with an invented parts catalog and fake orders, which is why
      # seeding was never wired into a deploy and why the platform data trapped
      # alongside it never shipped. packages/db/prisma/platform-seed.ts holds the
      # split.
      - name: Seed platform data
        env:
          IMAGE: ghcr.io/${{ github.repository }}/db:${{ needs.prepare.outputs.image_sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export IMAGE RUN_ID
          envsubst '$IMAGE $RUN_ID' \
            < k8s/azure/db-seed-platform-job.yaml > /tmp/seed-job.yaml
          kubectl apply -f /tmp/seed-job.yaml
          ./.github/scripts/await-job.sh "db-seed-platform-${RUN_ID}" "$NAMESPACE" 900
          kubectl -n "$NAMESPACE" logs "job/db-seed-platform-${RUN_ID}" -c seed \
            --tail=-1 --ignore-errors=true || true

      # Bundle-backed listings (docs/85): compiles every bundle under
      # marketplace-catalog/, writes its artifact to storage and upserts a thin
      # catalog row. The api-rest image is used because its Dockerfile bakes
      # marketplace-catalog/ in — which is also why that directory is now part of
      # build-images-ghcr.yml's path filter. Without it a bundle-only commit
      # publishes no image, `prepare` pins to an older SHA, and this would ingest
      # whichever bundles happened to be baked into the last code change.
      - name: Ingest marketplace bundles
        env:
          IMAGE: ghcr.io/${{ github.repository }}/api-rest:${{ needs.prepare.outputs.image_sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export IMAGE RUN_ID
          envsubst '$IMAGE $RUN_ID' \
            < k8s/azure/marketplace-ingest-job.yaml > /tmp/ingest-job.yaml
          kubectl apply -f /tmp/ingest-job.yaml
          ./.github/scripts/await-job.sh "marketplace-ingest-${RUN_ID}" "$NAMESPACE" 1800
          kubectl -n "$NAMESPACE" logs "job/marketplace-ingest-${RUN_ID}" -c ingest \
            --tail=-1 --ignore-errors=true || true

      # What actually landed, counted from the database rather than inferred from
      # a green Job. "Ran successfully and wrote nothing" is the failure this
      # whole stage exists to make impossible to miss again.
      - name: Report what is published
        if: always()
        run: |
          kubectl -n "$NAMESPACE" delete job catalog-count --ignore-not-found
          kubectl apply -n "$NAMESPACE" -f - <<'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: catalog-count
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                enableServiceLinks: false
                containers:
                  - name: psql
                    image: postgres:18-alpine
                    command: ['sh', '-c']
                    args:
                      - >-
                        psql "$AUTH_DATABASE_URL" -tA -F' ' -c
                        "select 'themes', count(*) from marketplace_themes
                         union all select 'blueprints', count(*) from marketplace_blueprints
                         union all select 'components', count(*) from marketplace_components
                         union all select 'integrations', count(*) from marketplace_integrations
                         union all select 'platform_components', count(*) from platform_components
                         order by 1"
                    env:
                      - name: AUTH_DATABASE_URL
                        valueFrom:
                          secretKeyRef: { name: sparx-app-secrets, key: AUTH_DATABASE_URL }
          YAML
          ./.github/scripts/await-job.sh catalog-count "$NAMESPACE" 300 || true
          {
            echo '### Platform data'
            echo ''
            echo '| catalog | rows |'
            echo '| --- | --- |'
            kubectl -n "$NAMESPACE" logs job/catalog-count --tail=-1 --ignore-errors=true \
              | awk 'NF==2 { print "| " $1 " | " $2 " |" }'
          } >> "$GITHUB_STEP_SUMMARY"
