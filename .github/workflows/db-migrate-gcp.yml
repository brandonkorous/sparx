# Database migration pipeline — CLOUD SQL. The Azure sibling is
# db-migrate-azure.yml.
#
# NAMED FOR THE PROVIDER, NOT THE ENVIRONMENT — it was `db-migrate.yml`, an
# unqualified name that read as "the migration pipeline" when it is in fact one
# provider's. That ambiguity had teeth: on 2026-07-31 a
# `packages/db/scripts/**` edit matched the path filter below and this ran green
# against Cloud SQL while the platform was being migrated to Azure, touching the
# fallback database nobody meant to touch. It was a no-op only because Cloud SQL
# was already ahead of the repo. A name that says GCP would have made the run
# entry obvious at a glance.
#
# Trigger: push to main that touches the schema or a migration file, OR
# manual run via workflow_dispatch (with optional RUN_SEED toggle).
#
# Flow:
#   1. Authenticate to GCP via Workload Identity Federation (no service
#      account key — the brandonkorous/sparx repo is bound to sparx-deployer).
#   2. Build the @sparx/db migration runner image, push to Artifact Registry.
#   3. Fetch fleet credentials via Connect Gateway and apply the K8s Job
#      manifest (envsubst injects the image tag + RUN_SEED flag).
#   4. Wait for the Job to complete and stream its logs back into the run.

name: DB Migrate (GCP)

# MANUAL ONLY while GCP is the FALLBACK rather than the live target.
#
# THE OFF SWITCH IS THE BRANCH NAME BELOW. `__disabled__` does not exist, so the
# push trigger can never match; the rest of the trigger is intact, real YAML,
# and says exactly what this would run on. Re-arm by changing that one word back
# to `main`.
#
# Why in the FILE rather than `gh workflow disable`: GitHub keys a workflow's
# disabled state to its FILE PATH, so a rename produces a brand-new workflow
# that arrives ENABLED whatever the old one was. This file was `db-migrate.yml`.
# Worse, a DELETED path counts as a CHANGED path, so the stale
# `.github/workflows/db-migrate.yml` entry in the list below matched the very
# commit that renamed it — the rename would have migrated Cloud SQL on its way
# past, against the cluster deliberately held in reserve. Out-of-band state
# cannot protect a file that is moving; a filter inside the file can.
#
# Commenting the block out would also work and is worse: commented YAML is
# validated by nothing, so it silently rots until the day someone needs it.
#
# The standing reason, independent of the rename: automatic migrations against a
# standby nobody is deploying to is how a fallback drifts without anyone
# deciding it should — which already happened once (see the header).
on:
  push:
    branches: [__disabled__]
    paths:
      - 'packages/db/prisma/schema.prisma'
      - 'packages/db/prisma/migrations/**'
      - 'packages/db/sql/**'
      - 'packages/db/scripts/run-migrations.ts'
      - 'packages/db/scripts/backfill-builder-class.ts'
      - 'packages/db/scripts/backfill-property-name.ts'
      - 'packages/db/Dockerfile'
      - 'k8s/sparx-prod/db-migrate-job.yaml'
      - '.github/workflows/db-migrate-gcp.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: prod
        type: choice
        options: [prod]
      run_seed:
        description: 'Run the dev seed after migrations complete'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      run_backfill:
        description: 'Run the backfills — box→class (docs/61) and Property.name fill + brand_override.businessName strip (tenant↔site, docs/49). Both idempotent. The sf-→st- prefix normalizer is GONE: st-* is retired, so it would rewrite the retired prefix back in.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      resolve_migration:
        description: 'Mark this migration as rolled-back before applying (used to clear P3009 failures). Migration directory name, e.g. 20260528100000_unified_content_model'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation OIDC token

env:
  # Environment as a value, not a filename — see the header. `prod` is the only
  # one on GCP today; adding staging is a new option plus these values.
  ENVIRONMENT: ${{ inputs.environment || 'prod' }}
  PROJECT_ID: sparxworks
  REGION: us-central1
  CLUSTER: sparx-prod-autopilot
  AR_REPO: us-central1-docker.pkg.dev/sparxworks/sparx
  IMAGE_NAME: db-migrate

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/631794111842/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: sparx-deployer@sparxworks.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build migration runner image
        run: |
          set -euo pipefail
          IMAGE="${AR_REPO}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build \
            -f packages/db/Dockerfile \
            -t "$IMAGE" \
            -t "${AR_REPO}/${IMAGE_NAME}:latest" \
            .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push image to Artifact Registry
        run: |
          docker push "$IMAGE"
          docker push "${AR_REPO}/${IMAGE_NAME}:latest"

      - name: Get GKE credentials via Connect Gateway
        # Fleet membership lives at `global` (terraform/modules/gke/main.tf).
        run: |
          gcloud container fleet memberships get-credentials "$CLUSTER" --location global

      # If RESOLVE_MIGRATION is set, first run the resolve Job to mark the
      # named migration row as rolled-back in `_prisma_migrations`. The main
      # migrate Job that follows will then retry that migration cleanly.
      # Touches only the `_prisma_migrations` table; safe to run blind.
      - name: Resolve failed migration (optional)
        if: github.event.inputs.resolve_migration != ''
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-resolve
          RESOLVE_MIGRATION: ${{ github.event.inputs.resolve_migration }}
        run: |
          set -euo pipefail
          export IMAGE RUN_ID RESOLVE_MIGRATION
          envsubst < k8s/sparx-prod/db-migrate-resolve-job.yaml > /tmp/resolve-job.yaml
          echo "--- Rendered resolve manifest ---"
          cat /tmp/resolve-job.yaml
          kubectl apply -f /tmp/resolve-job.yaml
          RESOLVE_JOB="db-migrate-resolve-${RUN_ID}"
          echo "Streaming logs from $RESOLVE_JOB…"
          # Wait for pod to be tail-able, then follow logs until container exits.
          for _ in $(seq 1 120); do
            POD=$(kubectl -n sparx-prod get pod -l "batch.kubernetes.io/job-name=${RESOLVE_JOB}" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$POD" ]; then
              STATE=$(kubectl -n sparx-prod get pod "$POD" -o jsonpath='{.status.containerStatuses[?(@.name=="resolve")].state}' 2>/dev/null || true)
              if echo "$STATE" | grep -qE 'running|terminated'; then
                break
              fi
            fi
            sleep 5
          done
          kubectl -n sparx-prod logs -f "$POD" -c resolve --tail=-1 --ignore-errors=true || true
          kubectl -n sparx-prod wait --for=condition=Complete --timeout=5m "job/${RESOLVE_JOB}"

      - name: Render + apply migration Job
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          RUN_SEED: ${{ github.event.inputs.run_seed || 'false' }}
          RUN_BACKFILL: ${{ github.event.inputs.run_backfill || 'false' }}
        run: |
          set -euo pipefail
          export IMAGE RUN_ID RUN_SEED RUN_BACKFILL
          envsubst < k8s/sparx-prod/db-migrate-job.yaml > /tmp/job.yaml
          echo "--- Rendered manifest ---"
          cat /tmp/job.yaml
          kubectl apply -f /tmp/job.yaml
          echo "JOB_NAME=db-migrate-${RUN_ID}" >> "$GITHUB_ENV"

      - name: Wait for Job + stream logs
        run: |
          set -euo pipefail
          POD=""
          # Wait up to 10 min for a pod to appear and reach a state where its
          # logs are tail-able. PodScheduled isn't enough (container can still
          # be PodInitializing); we wait until the migrate container is either
          # Running OR Terminated (already finished). cluster-autoscaler /
          # node-auto-provisioning can take several minutes on a cold cluster.
          for _ in $(seq 1 120); do
            POD=$(kubectl -n sparx-prod get pod -l "batch.kubernetes.io/job-name=${JOB_NAME}" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$POD" ]; then
              STATE=$(kubectl -n sparx-prod get pod "$POD" -o jsonpath='{.status.containerStatuses[?(@.name=="migrate")].state}' 2>/dev/null || true)
              if echo "$STATE" | grep -qE 'running|terminated'; then
                break
              fi
            fi
            sleep 5
          done

          if [ -z "$POD" ]; then
            echo "Pod never appeared for job/${JOB_NAME}"
            kubectl -n sparx-prod describe "job/${JOB_NAME}" || true
            exit 1
          fi
          echo "Streaming logs from pod $POD…"

          # `kubectl logs -f` exits when the migrate container terminates.
          # Run it in foreground; ignore-errors covers the empty-log edge case.
          kubectl -n sparx-prod logs -f "$POD" -c migrate --tail=-1 --ignore-errors=true || true

          # The Job's Complete condition flips a few seconds after the
          # migrate container terminates; wait at most 5m for that.
          if ! kubectl -n sparx-prod wait --for=condition=Complete --timeout=5m "job/${JOB_NAME}"; then
            echo "Job did not complete successfully — final state:"
            kubectl -n sparx-prod describe "job/${JOB_NAME}" || true
            kubectl -n sparx-prod logs "$POD" -c migrate --tail=-1 --ignore-errors=true || true
            exit 1
          fi
          echo "Job completed successfully."
