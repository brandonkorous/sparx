name: Auto tag

# On every push to main, analyze conventional-commit messages since the last
# v* tag and push a new tag if there's something releasable.
#
# TAGGING ONLY. It no longer dispatches anything — see the note at the bottom of
# this file. A tag marks a release; it does not decide who deploys it.
#
# Bump rules (driven by mathieudutour/github-tag-action's defaults):
#   feat: / feat(scope):           → minor
#   fix:  / perf:                  → patch
#   feat!: / footer BREAKING CHANGE → major
#   chore / docs / refactor / ci / build / test / style → no bump
#
# If no releasable commits exist, the workflow runs but creates no tag.
# Force a release manually with workflow_dispatch + the bump input.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force a specific bump (overrides commit analysis)'
        required: false
        type: choice
        default: 'auto'
        options: ['auto', 'patch', 'minor', 'major']

permissions:
  contents: write # push the tag
  # `actions: write` is gone with the dispatch job it existed for. Nothing here
  # starts another workflow any more, so the token should not be able to.

concurrency:
  # Don't race multiple tagging runs on rapid pushes.
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag || steps.tag_forced.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history for conventional-commit analysis

      # Path A: commit-driven (push events, or workflow_dispatch with bump=auto).
      - name: Tag from conventional commits
        id: tag
        if: "github.event_name == 'push' || github.event.inputs.bump == 'auto'"
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false # no implicit bump for non-conventional commits
          tag_prefix: v
          release_branches: main
          fetch_all_tags: true

      # Path B: human forced a specific bump via workflow_dispatch.
      - name: Tag with forced bump
        id: tag_forced
        if: "github.event_name == 'workflow_dispatch' && github.event.inputs.bump != 'auto'"
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ github.event.inputs.bump }}
          tag_prefix: v
          release_branches: main
          fetch_all_tags: true

      - name: No-op summary if nothing to release
        if: steps.tag.outputs.new_tag == '' && steps.tag_forced.outputs.new_tag == ''
        run: echo "::notice::No releasable commits since last tag — skipping tag creation."

# NO DISPATCH JOB. This used to end by running `gh workflow run
# build-images-gcp.yml --ref $TAG`, which pushed to Artifact Registry and needed a
# live GCP project — so every releasable commit produced one guaranteed-red
# run once the platform moved to AKS.
#
# Removing it rather than gating it, because there is nothing left for it to
# do. Each provider now builds on its own terms:
#
#   Azure — build-images-ghcr.yml triggers on the push itself, path-filtered
#           to source. It never wanted a tag; dispatching per tag would only
#           have double-built the same commit.
#   GCP   — build-images-gcp.yml is a manual fallback. Dispatch it yourself when
#           you actually intend to rebuild GKE.
#
# Note that a never-matching trigger filter (the `__disabled__` sentinel used
# in the GCP workflows) would NOT have covered this: a sentinel blocks `push`,
# and `gh workflow run` fires `workflow_dispatch`, which is a different door.
# The only way to stop an explicit dispatch is to stop dispatching.
#
# Tags themselves still get cut — they mark releases regardless of who deploys.
