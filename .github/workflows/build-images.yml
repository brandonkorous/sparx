name: Build & push images

on:
  # Builds are driven by TAGS, never by raw pushes to main. auto-tag.yml runs on
  # every push to main, creates the release tag when there's something
  # releasable, and dispatches this workflow against that tag (the
  # workflow_dispatch trigger below). A GITHUB_TOKEN-pushed tag does not fire the
  # `tags: ['v*']` trigger on its own, which is why auto-tag dispatches
  # explicitly; the `tags` trigger stays as a safety net for a human manually
  # pushing a v* tag. There is deliberately NO `branches: [main]` trigger: it
  # double-built every releasable commit (once on the push, once on the
  # dispatched tag) and only ever produced SHA-tagged images that nothing
  # deploys — deploy-prod.yml rolls out tags, not main-branch SHAs.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      service:
        description: 'Single service to rebuild (leave blank for all)'
        required: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  PROJECT_ID: sparxworks
  REGION: us-central1
  AR_REPO: sparx
  # OIDC federation — same values used by db-migrate.yml. These are public
  # identifiers (no credential value); WIF binds the brandonkorous/sparx repo
  # to the sparx-deployer SA via the github-pool provider.
  WIF_PROVIDER: projects/631794111842/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOYER_SA: sparx-deployer@sparxworks.iam.gserviceaccount.com

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Comment a service back in once its Dockerfile lands at apps/<name>/Dockerfile
        # or services/<name>/Dockerfile. Until then these jobs will fail fast on the
        # "Dockerfile missing" check.
        service:
          - web # @sparx/web — marketing site
          - api-rest
          - api-graphql
          - api-mcp
          - mcp-site # @sparx/mcp-site — shopper-facing MCP (docs/113)
          # dashboard decommissioned 2026-07-22 — the workbench replaced it at
          # app.sparx.works. Its image is no longer built or deployed.
          - workbench # @sparx/workbench — the operator app; now serves app.sparx.works (replaced the dashboard)
          - admin # @sparx/admin — WizeWorks operator console (docs/apps/admin/build-plan.md)
          - site
          - market # @sparx/market — the first-party sparx.market storefront (docs/106 §4.7)
          - media-worker
          - email-worker
          - push-worker
          - markup-recompute-worker
          - automation-worker
          - commerce-indexer
          - legal-seed-worker
          - domain-worker
          - dropship-worker
          - billing-worker
          - webhook-worker
          - channel-sync-worker
    steps:
      - uses: actions/checkout@v4

      - name: Locate Dockerfile
        id: dockerfile
        run: |
          for candidate in apps/${{ matrix.service }}/Dockerfile services/${{ matrix.service }}/Dockerfile; do
            if [ -f "$candidate" ]; then
              echo "path=$candidate" >> $GITHUB_OUTPUT
              echo "context=$(dirname $candidate)" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "No Dockerfile found for ${{ matrix.service }} — skipping." >&2
          exit 0  # soft skip while services are still being scaffolded

      - name: Bail out if Dockerfile not found
        if: steps.dockerfile.outputs.path == ''
        run: |
          echo "::notice::Skipping ${{ matrix.service }} — Dockerfile not yet present."
          exit 0

      - uses: google-github-actions/auth@v2
        if: steps.dockerfile.outputs.path != ''
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.dockerfile.outputs.path != ''

      - name: Configure Docker for Artifact Registry
        if: steps.dockerfile.outputs.path != ''
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Compute tags
        if: steps.dockerfile.outputs.path != ''
        id: tags
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/${{ matrix.service }}"
          echo "sha_tag=$IMAGE:${{ github.sha }}" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version_tag=$IMAGE:$VERSION" >> $GITHUB_OUTPUT
            echo "latest_tag=$IMAGE:latest" >> $GITHUB_OUTPUT
            # Human-readable release stamped into the app bundles (APP_VERSION
            # build-arg). Tag builds get the version, main-branch builds get the
            # short SHA. Only the Next.js apps consume it; other Dockerfiles
            # ignore the unused build-arg.
            echo "app_version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "app_version=${GITHUB_SHA::12}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.dockerfile.outputs.path != ''

      - name: Build & push
        if: steps.dockerfile.outputs.path != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          provenance: false
          # Every NEXT_PUBLIC_* value is INLINED into the client bundle at build
          # time, so it has to be a build-arg — setting it on the pod is too late.
          # These are repo VARIABLES (Settings → Variables), not secrets: a Stripe
          # publishable key is public by design and ships in the browser bundle.
          # A Dockerfile that doesn't declare a matching ARG just ignores it.
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.app_version }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_MARKET_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_MARKET_STRIPE_PUBLISHABLE_KEY }}
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.version_tag }}
            ${{ steps.tags.outputs.latest_tag }}
          # mode=min exports only the final image layers, not every
          # intermediate. mode=max regularly hangs uploading the heavy
          # Next.js layers to GitHub Actions Cache (the image itself
          # had already been pushed to AR by the time we noticed).
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=min,scope=${{ matrix.service }}

      - name: Trivy scan
        if: steps.dockerfile.outputs.path != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.sha_tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0' # report only — flip to '1' once base images are stable

  # Gate the production rollout on a green build. Dispatching deploy-prod here
  # (instead of firing it from auto-tag in parallel with this build) closes the
  # race where deploy ran `kubectl set image :<tag>` before the image existed →
  # ImagePullBackOff and a timed-out rollout (what red-flagged v0.77.0's deploy).
  # `needs: build` only resolves to success once every matrix service is pushed,
  # so a broken build never reaches production. Tag refs only — pushes to main
  # build images but don't deploy.
  dispatch-deploy:
    name: Dispatch production deploy
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatch deploy-prod.yml
    steps:
      - name: Trigger deploy-prod on the built tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "All images built & pushed for $TAG — dispatching deploy-prod.yml"
          gh workflow run deploy-prod.yml --repo "$GH_REPO" --ref "$TAG"
