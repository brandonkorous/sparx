# One-off operations. NOT part of a release, deliberately and permanently.
#
# ---------------------------------------------------------------------------
# Why these are not in release.yml
# ---------------------------------------------------------------------------
#
# A release pipeline describes how the platform ships. It should read as four
# stages — infrastructure, data, containers, cleanup — and nothing else. The
# moment a task name like "purge themes" or "backfill tenant CRM records"
# appears in it, the pipeline stops being a description of shipping and becomes
# a list of chores that happen to run in order, and every future chore has an
# obvious place to be added.
#
# This is where those live. It is a SINGLE workflow with a `task` input rather
# than one file per chore, because the chores are all the same shape — run a
# script inside the cluster, against the app's own environment, as a Job — and
# the six files this replaces differed only in an image, a path, and which of
# them remembered to require a typed confirmation.
#
# Adding a chore here is adding a row to the case statement. It never touches
# the release.
#
# ---------------------------------------------------------------------------
# Why in-cluster
# ---------------------------------------------------------------------------
#
# psql-sparx-prod-cus has public access DISABLED and lives in the VNet, so
# nothing outside the cluster can reach the database. Every task runs as a Job
# with the same ConfigMap and Secret the live pods use, which is also what makes
# a task behave in production the way it behaved locally.
name: Ops

# MANUAL ONLY. Nothing here is safe to fire on a push, and nothing here is on a
# schedule — a destructive task on a timer is how you find out about it from the
# consequences.
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        required: true
        type: choice
        # EVERY MARKETPLACE TASK IS GONE FROM THIS LIST, and nothing replaced them.
        # There were four: an ingest to publish first-party listings, and purges to
        # retract a theme, a component or a blueprint. api-rest publishes sparx's whole
        # catalog on boot and retracts by absence, so publishing is no longer something
        # anyone triggers and removal is deleting the source — both happen in the commit
        # that changes the catalog.
        #
        # Worth stating because the purges were BUILT and then never run: 25 of
        # production's 96 component listings were retired or orphaned rows that a
        # destructive workflow could have removed and nobody remembered to.
        options:
          # Backfills platform CRM records for tenants that predate the worker.
          - platform-crm-backfill
          # DESTRUCTIVE. Deletes every page on a site that is still entirely on the
          # legacy sparx-builder tier and re-seeds it onto silica. Dry-runs by default.
          - retire-legacy-site-tier
          # Copies the media PVC into Azure Blob storage. Read-only on the disk;
          # writes to Blob. Dry-runs by default. Safe to re-run — it skips blobs
          # that already exist.
          - migrate-media-to-blob
      environment:
        description: 'Where to run it'
        required: false
        default: prod
        type: choice
        options: [prod]
      image_sha:
        description: 'Commit SHA of the image to run (blank = latest released)'
        required: false
        type: string
      apply:
        description: 'Actually write. Unticked, reversible tasks report what they WOULD do.'
        required: false
        default: false
        type: boolean
      confirm:
        description: 'For a purge: type the task name exactly to confirm'
        required: false
        type: string

concurrency:
  # Shares the RELEASE group. A purge interleaved with a seed, or a backfill
  # running while migrations apply, is a data race with no lock underneath it —
  # so an ops task and a release simply never run at the same time.
  group: release-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'prod' }}
    timeout-minutes: 60
    env:
      RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP || 'rg-sparx-prod-cus' }}
      CLUSTER: ${{ vars.AKS_CLUSTER || 'aks-sparx-prod-cus' }}
      NAMESPACE: ${{ vars.K8S_NAMESPACE || 'sparx-prod' }}
      OVERLAY: ${{ vars.K8S_OVERLAY || 'k8s/azure' }}
      TASK: ${{ inputs.task }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # A typed confirmation, for the tasks that destroy data.
      #
      # Checked BEFORE authenticating to anything, so a mistyped purge costs
      # nothing and touches nothing. Upserts and backfills are not gated.
      #
      # The `*-purge-*` prefix inherits this gate automatically, which is the contract
      # for adding a destructive task without anyone having to remember to build one.
      # `retire-legacy-site-tier` is named for what it does rather than bent to fit that
      # prefix, so it is listed explicitly — and it gates on APPLY only, because unlike a
      # purge it has a real dry run that is worth running freely.
      # ---------------------------------------------------------------------
      - name: Confirm a destructive task
        run: |
          set -euo pipefail
          case "$TASK" in
            marketplace-purge-*)
              if [ '${{ inputs.confirm }}' != "$TASK" ]; then
                echo "::error::$TASK deletes catalog rows and their stored artifacts. Re-run with confirm set to exactly: $TASK"
                exit 1
              fi
              if [ '${{ inputs.apply }}' != 'true' ]; then
                echo "::error::$TASK has no dry run — it either purges or it does nothing. Tick 'apply' to proceed."
                exit 1
              fi
              echo "Confirmed: $TASK"
              ;;
            retire-legacy-site-tier)
              # Unticked it only REPORTS, so the confirmation is required exactly when a
              # write is being asked for. This deletes tenants' authored pages and cannot
              # be undone — there is no `.bx-*` → silica translator, so the trees are not
              # recoverable from anywhere once they are gone.
              if [ '${{ inputs.apply }}' = 'true' ] && [ '${{ inputs.confirm }}' != "$TASK" ]; then
                echo "::error::$TASK PERMANENTLY DELETES authored site content for every legacy-only property and replaces it with the starter. Run it without 'apply' first to see exactly which sites and pages. To write, re-run with confirm set to exactly: $TASK"
                exit 1
              fi
              echo "Confirmed: $TASK (apply=${{ inputs.apply }})"
              ;;
            *)
              echo "$TASK is idempotent; no confirmation required."
              ;;
          esac

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get cluster credentials
        run: |
          az aks get-credentials --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER" --overwrite-existing

      # ---------------------------------------------------------------------
      # Which image, and what to run inside it.
      #
      # Default to `latest`, which the release moves to whatever it just
      # deployed — so an ops task run with no arguments runs the code that is
      # actually live. A SHA pins it to a specific release instead, which is
      # what you want when re-running a task from a ref that has since been
      # superseded.
      # ---------------------------------------------------------------------
      - name: Resolve the task
        id: task
        run: |
          set -euo pipefail
          TAG='${{ inputs.image_sha }}'
          [ -n "$TAG" ] || TAG='latest'
          REPO='ghcr.io/${{ github.repository }}'

          case "$TASK" in
            platform-crm-backfill)
              image="$REPO/platform-crm-worker:$TAG"
              # WORKDIR is /app/services/platform-crm-worker. The script reports
              # what it would change unless --apply is passed, which is why this
              # task honours the `apply` input.
              if [ '${{ inputs.apply }}' = 'true' ]; then
                command='["node","--import","tsx","scripts/backfill-tenants.ts","--apply"]'
              else
                command='["node","--import","tsx","scripts/backfill-tenants.ts"]'
              fi
              ;;
            retire-legacy-site-tier)
              image="$REPO/api-rest:$TAG"
              # WORKDIR is /app/services/api-rest. Unticked it reports the sites and
              # pages it WOULD delete and writes nothing.
              if [ '${{ inputs.apply }}' = 'true' ]; then
                command='["node","--import","tsx","src/scripts/retire-legacy-site-tier.ts","--apply"]'
              else
                command='["node","--import","tsx","src/scripts/retire-legacy-site-tier.ts"]'
              fi
              ;;
            migrate-media-to-blob)
              image="$REPO/api-rest:$TAG"
              # WORKDIR is /app/services/api-rest. Unticked it lists what it WOULD
              # copy and writes nothing. Needs the media PVC — see MOUNT_MEDIA below.
              if [ '${{ inputs.apply }}' = 'true' ]; then
                command='["node","--import","tsx","src/scripts/migrate-media-to-blob.ts","--apply"]'
              else
                command='["node","--import","tsx","src/scripts/migrate-media-to-blob.ts"]'
              fi
              ;;
            *)
              echo "::error::Unknown task '$TASK'."
              exit 1
              ;;
          esac

          {
            echo "image=$image"
            echo "command=$command"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Ops — \`$TASK\`"
            echo ''
            echo '| | |'
            echo '| --- | --- |'
            echo "| image | \`$image\` |"
            echo "| namespace | \`$NAMESPACE\` |"
            echo "| apply | \`${{ inputs.apply }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # The generic case: an image, a command, the app's environment.
      #
      # Connects as the OWNER role, like the seed and the migration and for the
      # same reason: the marketplace tables are FORCE-RLS with a policy that
      # only admits a no-tenant write, and the app role does not ERROR on those
      # — it is silently filtered, which is the failure mode that hides itself.
      #
      # QUOTED heredoc, so bash performs no expansion inside it. Unquoted, it
      # would run command substitution on any BACKTICK in the body, including
      # ones sitting in YAML comments — which has already produced a kubectl
      # parse error pointing at a line nobody wrote.
      # ---------------------------------------------------------------------
      - name: Run the task

        env:
          IMAGE: ${{ steps.task.outputs.image }}
          COMMAND: ${{ steps.task.outputs.command }}
        run: |
          set -euo pipefail
          JOB="ops-${TASK}-${RUN_ID}"

          # Only the media migration needs the PVC, and it needs it for the same
          # reason api-rest does: the bytes it is copying out live on that volume.
          # Every other task gets an empty string here, so the rendered Job is
          # byte-for-byte what it was before this existed.
          #
          # fsGroup matches api-rest's — the tarball this volume was restored from
          # carries uids that exist nowhere in the cluster, so without it the files
          # are unreadable and the migration copies nothing while reporting success.
          MEDIA_MOUNT=""
          MEDIA_VOLUME=""
          MEDIA_SECURITY=""
          MEDIA_CREDS=""
          if [ "$TASK" = 'migrate-media-to-blob' ]; then
            # The storage credentials come from AZURE, not from sparx-app-secrets.
            #
            # This matters for ORDERING, which is the whole point of the task. The app
            # secret only carries AZURE_STORAGE_* once a release has derived them — and
            # that same release rolls the containers, so the platform starts READING from
            # Blob in the same run. Sourcing the migration's credentials from that secret
            # would mean the bytes can only be copied AFTER the switch that depends on
            # them, leaving a window where every image 404s against an empty container.
            #
            # Reading them here instead lets the copy run while the platform is still
            # serving from the PVC, which is what the script's own header asks for and
            # what makes the cutover seamless rather than merely quick.
            #
            # Exactly one storage account lives in the app resource group (the Terraform
            # state account is in a different one), so this needs no name to be kept in
            # sync — but it ASSERTS that, because silently picking the wrong account
            # would write 21 MB of media somewhere nobody looks.
            ACCOUNTS=$(az storage account list --resource-group "$RESOURCE_GROUP" --query '[].name' -o tsv)
            COUNT=$(printf '%s\n' "$ACCOUNTS" | grep -c . || true)
            if [ "$COUNT" -ne 1 ]; then
              echo "::error::Expected exactly one storage account in $RESOURCE_GROUP, found $COUNT: $(printf '%s ' $ACCOUNTS)"
              exit 1
            fi
            ST_ACCOUNT="$ACCOUNTS"
            ST_KEY=$(az storage account keys list --resource-group "$RESOURCE_GROUP" \
              --account-name "$ST_ACCOUNT" --query '[0].value' -o tsv)
            if [ -z "$ST_KEY" ]; then
              echo "::error::Could not read a key for storage account $ST_ACCOUNT."
              exit 1
            fi

            # Held in a Secret rather than inlined as `value:` — the rendered manifest is
            # echoed to the run log below, and a Job's pod spec is readable by anything
            # with `get jobs`. Deleted in the cleanup step whatever happens.
            CREDS_SECRET="ops-media-creds-${RUN_ID}"
            kubectl create secret generic "$CREDS_SECRET" -n "$NAMESPACE" \
              --from-literal=AZURE_STORAGE_ACCOUNT="$ST_ACCOUNT" \
              --from-literal=AZURE_STORAGE_KEY="$ST_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "Media storage: migrating into account $ST_ACCOUNT."

            # Double-quoted (not $'…') so $CREDS_SECRET expands; the body needs no escapes.
            MEDIA_CREDS="
                      - name: AZURE_STORAGE_ACCOUNT
                        valueFrom:
                          secretKeyRef: { name: $CREDS_SECRET, key: AZURE_STORAGE_ACCOUNT }
                      - name: AZURE_STORAGE_KEY
                        valueFrom:
                          secretKeyRef: { name: $CREDS_SECRET, key: AZURE_STORAGE_KEY }"

            MEDIA_MOUNT=$'
                    volumeMounts:
                      - name: media
                        mountPath: /media
                        readOnly: true'
            MEDIA_VOLUME=$'
                volumes:
                  - name: media
                    persistentVolumeClaim:
                      claimName: sparx-media'
            MEDIA_SECURITY=$'
                securityContext:
                  fsGroup: 1000
                  fsGroupChangePolicy: OnRootMismatch'
          fi

          export JOB IMAGE COMMAND MEDIA_MOUNT MEDIA_VOLUME MEDIA_SECURITY MEDIA_CREDS

          envsubst '$JOB $IMAGE $COMMAND $TASK $MEDIA_MOUNT $MEDIA_VOLUME $MEDIA_SECURITY $MEDIA_CREDS' > /tmp/job.yaml <<'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            labels:
              app.kubernetes.io/name: ops
              app.kubernetes.io/part-of: sparx
              app.kubernetes.io/component: ${TASK}
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 3600
            template:
              spec:
                restartPolicy: Never
                enableServiceLinks: false
                imagePullSecrets: [{ name: ghcr }]${MEDIA_SECURITY}
                containers:
                  - name: task
                    image: ${IMAGE}
                    command: ${COMMAND}
                    envFrom:
                      - configMapRef: { name: sparx-app-env }
                      - secretRef: { name: sparx-app-secrets }
                    env:
                      - name: NODE_ENV
                        value: production
                      - name: SERVICE_NAME
                        value: ${TASK}
                      - name: LOG_LEVEL
                        value: info
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef: { name: sparx-app-secrets, key: AUTH_DATABASE_URL }${MEDIA_CREDS}
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      runAsGroup: 1000
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ['ALL']
                      seccompProfile:
                        type: RuntimeDefault
                    resources:
                      requests: { cpu: '100m', memory: '384Mi' }
                      limits: { memory: '1Gi' }${MEDIA_MOUNT}${MEDIA_VOLUME}
          YAML

          echo '--- Rendered manifest ---'
          cat /tmp/job.yaml
          kubectl apply -n "$NAMESPACE" -f /tmp/job.yaml
          ./.github/scripts/await-job.sh "$JOB" "$NAMESPACE" 1800
          kubectl -n "$NAMESPACE" logs "job/$JOB" -c task \
            --tail=-1 --ignore-errors=true || true

      # A storage account key outliving the run that needed it is how a short-lived
      # credential becomes a permanent one. `always()` — the Job failing is exactly
      # when the secret would otherwise be left behind.
      - name: Drop the one-off storage credentials
        if: always() && inputs.task == 'migrate-media-to-blob'
        run: |
          kubectl delete secret "ops-media-creds-${RUN_ID}" -n "$NAMESPACE" --ignore-not-found
