# Database migration pipeline — AZURE. The GCP sibling is db-migrate-gcp.yml.
#
# NAMED FOR THE PROVIDER, NOT THE ENVIRONMENT, and matched to its sibling on
# purpose. Provider dictates the mechanics (auth, registry, how you reach the
# cluster); environment is a VALUE that varies inside a provider. Four files
# named `deploy-prod` / `deploy-staging` / `deploy-azure-prod` /
# `deploy-azure-staging` is the shape this avoids — two files plus an input do
# the same work, and running both providers at once becomes a toggle rather
# than a rewrite.
#
# REUSABLE, so there is exactly one definition of "migrate the Azure database".
# deploy-azure.yml calls it via `uses:` between syncing secrets and rolling out
# — migrations MUST land before pods start, or the new code meets the old
# schema. Dispatching it directly runs the same thing without a rollout, which
# is what you want to re-run a failed migration or bring a restored database
# forward.
#
# Two Jobs, in this order, both in-cluster because psql-sparx-prod-cus has
# public access DISABLED and lives in the VNet:
#
#   db-roles   — sql/azure-bootstrap.sql. Creates AND grants, unlike the Cloud
#                SQL script which only grants (there, `gcloud sql users create`
#                made the roles out of band; Azure has no equivalent).
#                Idempotent, so it runs every time.
#   db-migrate — the @sparx/db runner image. It reads DATABASE_URL from the
#                environment and skips Secret Manager and the Cloud SQL Auth
#                Proxy entirely, because GCP_PROJECT_ID is absent here.
name: DB Migrate (Azure)

on:
  workflow_call:
    inputs:
      image_sha:
        description: 'Commit SHA of the db image to run (must exist in GHCR)'
        required: true
        type: string
      environment:
        required: false
        default: prod
        type: string
  workflow_dispatch:
    inputs:
      image_sha:
        description: 'Commit SHA of the db image (blank = newest ancestor with images)'
        required: false
        type: string
      environment:
        description: 'Target environment'
        required: false
        default: prod
        type: choice
        options: [prod]

concurrency:
  # Shared with deploy-azure.yml — a migration racing a rollout, or two
  # migrations at once, would interleave DDL against one database.
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: read

env:
  ENVIRONMENT: ${{ inputs.environment || 'prod' }}
  RESOURCE_GROUP: rg-sparx-prod-cus
  CLUSTER: aks-sparx-prod-cus
  NAMESPACE: sparx-prod

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          # Enough history for the fallback resolution below.
          fetch-depth: 50

      # When called from deploy-azure.yml the SHA is passed in, already resolved
      # against GHCR. When dispatched directly it is usually blank, so resolve
      # it the same way: the newest ancestor of HEAD that actually has images.
      # Pinning to HEAD would be wrong for the same reason it is wrong there —
      # the image build is path-filtered, so an infra-only commit publishes
      # nothing and HEAD may have no image at all.
      - name: Resolve the db image
        id: sha
        run: |
          REPO='ghcr.io/${{ github.repository }}'
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          REQUESTED='${{ inputs.image_sha }}'
          if [ -n "$REQUESTED" ]; then
            if ! docker buildx imagetools inspect "$REPO/db:$REQUESTED" >/dev/null 2>&1; then
              echo "::error::No db image for $REQUESTED in $REPO."
              exit 1
            fi
            echo "value=$REQUESTED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for sha in $(git rev-list -n 50 HEAD); do
            if docker buildx imagetools inspect "$REPO/db:$sha" >/dev/null 2>&1; then
              echo "value=$sha" >> "$GITHUB_OUTPUT"
              echo "Using db image from $sha"
              exit 0
            fi
          done
          echo "::error::No commit in the last 50 has a db image. Run the build workflow first."
          exit 1

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get cluster credentials
        run: |
          az aks get-credentials --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER" --overwrite-existing

      # ---------------------------------------------------------------------
      # `sparx_app` — the unprivileged NOBYPASSRLS role every application
      # connection uses — comes from a Docker-image entrypoint convention
      # (packages/db/docker/init/01-roles.sql) that a MANAGED Postgres will
      # never run, and the server is VNet-private so it cannot be created from a
      # laptop either. An in-cluster Job is the only automated path.
      # ---------------------------------------------------------------------
      - name: Ensure database roles
        run: |
          kubectl create configmap db-bootstrap-roles -n "$NAMESPACE" \
            --from-file=azure-bootstrap.sql=packages/db/sql/azure-bootstrap.sql \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl delete job db-roles -n "$NAMESPACE" --ignore-not-found
          kubectl apply -n "$NAMESPACE" -f - <<'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-roles
          spec:
            backoffLimit: 1
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                enableServiceLinks: false
                containers:
                  - name: psql
                    image: postgres:18-alpine
                    command: ['sh', '-c']
                    args:
                      - psql "$AUTH_DATABASE_URL" -v ON_ERROR_STOP=1 -v app_password="$SPARX_APP_PASSWORD" -f /sql/azure-bootstrap.sql
                    env:
                      - name: AUTH_DATABASE_URL
                        valueFrom:
                          secretKeyRef: { name: sparx-app-secrets, key: AUTH_DATABASE_URL }
                      - name: SPARX_APP_PASSWORD
                        valueFrom:
                          secretKeyRef: { name: sparx-app-secrets, key: SPARX_APP_PASSWORD }
                    volumeMounts:
                      - { name: sql, mountPath: /sql, readOnly: true }
                volumes:
                  - name: sql
                    configMap: { name: db-bootstrap-roles }
          YAML
          ./.github/scripts/await-job.sh db-roles "$NAMESPACE" 300

      - name: Run migrations
        run: |
          kubectl delete job db-migrate -n "$NAMESPACE" --ignore-not-found
          kubectl apply -n "$NAMESPACE" -f - <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-migrate
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                enableServiceLinks: false
                imagePullSecrets: [{ name: ghcr }]
                containers:
                  - name: migrate
                    image: ghcr.io/${{ github.repository }}/db:${{ steps.sha.outputs.value }}
                    envFrom:
                      - configMapRef: { name: sparx-app-env }
                      - secretRef: { name: sparx-app-secrets }
                    env:
                      # Migrations and the hand-edited RLS SQL run as the OWNER
                      # role, not the RLS-constrained role the apps use. This
                      # explicit `env` deliberately OVERRIDES the DATABASE_URL
                      # that `envFrom` pulls in as sparx_app — explicit env wins
                      # over envFrom in Kubernetes, and that ordering is what
                      # makes the runner connect with owner rights.
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef: { name: sparx-app-secrets, key: AUTH_DATABASE_URL }
          YAML
          ./.github/scripts/await-job.sh db-migrate "$NAMESPACE" 1200
