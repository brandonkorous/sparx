# Marketplace ingest — publishes the first-party bundles under
# marketplace-catalog/ into prod object storage + the catalog rows (docs/85 §14).
#
# Manual only (workflow_dispatch). Pushing bundles to `main` ships the SOURCES;
# prod storage + the marketplace stay empty until this runs with the prod env
# (GCS bucket + Cloud SQL). The runtime is already DB-first, so the moment this
# completes every item appears in the dashboard /marketplace and /v1/blueprints.
#
# Self-contained, mirroring db-migrate.yml: it BUILDS the api-rest image from the
# current ref (with marketplace-catalog/ baked in via the Dockerfile COPY) and
# pushes it under a distinct `marketplace-ingest-<sha>` tag — it does NOT touch
# :latest or the deployed tag, and it does not depend on a deploy having run since
# the bundles changed. Then it applies the one-off Job and streams its logs.
#
# Idempotent: re-running the same bundle version is a no-op write (artifacts are
# immutable per version). Bump a bundle's sparx.json version to publish an update,
# then run this again.

name: Marketplace Ingest

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation OIDC token

env:
  PROJECT_ID: sparxworks
  REGION: us-central1
  CLUSTER: sparx-prod-autopilot
  AR_REPO: us-central1-docker.pkg.dev/sparxworks/sparx
  IMAGE_NAME: api-rest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/631794111842/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: sparx-deployer@sparxworks.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # Build the api-rest image with marketplace-catalog/ baked in (the
      # Dockerfile COPYs it). Tagged distinctly so it never clobbers the
      # deployed :latest / :<sha> images that deploy-prod.yml manages.
      - name: Build api-rest image (with bundles)
        run: |
          set -euo pipefail
          IMAGE="${AR_REPO}/${IMAGE_NAME}:marketplace-ingest-${GITHUB_SHA}"
          docker build \
            -f services/api-rest/Dockerfile \
            -t "$IMAGE" \
            .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push image to Artifact Registry
        run: docker push "$IMAGE"

      - name: Get GKE credentials via Connect Gateway
        # Fleet membership lives at `global` (terraform/modules/gke/main.tf).
        run: |
          gcloud container fleet memberships get-credentials "$CLUSTER" --location global

      - name: Render + apply ingest Job
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export IMAGE RUN_ID
          envsubst < k8s/sparx-prod/marketplace-ingest-job.yaml > /tmp/ingest-job.yaml
          echo "--- Rendered manifest ---"
          cat /tmp/ingest-job.yaml
          kubectl apply -f /tmp/ingest-job.yaml
          echo "JOB_NAME=marketplace-ingest-${RUN_ID}" >> "$GITHUB_ENV"

      - name: Wait for Job + stream logs
        run: |
          set -euo pipefail
          POD=""
          # Wait up to 10 min for a pod to appear and reach a tail-able state.
          # cluster-autoscaler / node-auto-provisioning can take several minutes
          # on a cold cluster.
          for _ in $(seq 1 120); do
            POD=$(kubectl -n sparx-prod get pod -l "batch.kubernetes.io/job-name=${JOB_NAME}" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$POD" ]; then
              STATE=$(kubectl -n sparx-prod get pod "$POD" -o jsonpath='{.status.containerStatuses[?(@.name=="ingest")].state}' 2>/dev/null || true)
              if echo "$STATE" | grep -qE 'running|terminated'; then
                break
              fi
            fi
            sleep 5
          done

          if [ -z "$POD" ]; then
            echo "Pod never appeared for job/${JOB_NAME}"
            kubectl -n sparx-prod describe "job/${JOB_NAME}" || true
            exit 1
          fi
          echo "Streaming logs from pod $POD…"

          kubectl -n sparx-prod logs -f "$POD" -c ingest --tail=-1 --ignore-errors=true || true

          # The Job's Complete condition flips a few seconds after the ingest
          # container terminates; wait at most 5m for that.
          if ! kubectl -n sparx-prod wait --for=condition=Complete --timeout=5m "job/${JOB_NAME}"; then
            echo "Job did not complete successfully — final state:"
            kubectl -n sparx-prod describe "job/${JOB_NAME}" || true
            kubectl -n sparx-prod logs "$POD" -c ingest --tail=-1 --ignore-errors=true || true
            exit 1
          fi
          echo "Job completed successfully."
