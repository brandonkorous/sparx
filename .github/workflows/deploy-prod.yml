name: Deploy to production

# Triggered by a v* tag push (from release-please) or manual workflow_dispatch.
# Rolls out the image for the resolved tag to each Deployment that exists in
# the cluster, then runs a smoke check.
#
# Migrations are NOT part of this workflow — db-migrate.yml owns them and
# runs on every push to main that touches the schema. By the time a tag is
# released and this workflow runs, migrations have already been applied.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sha:
        description: 'Image tag/sha to deploy (default: current commit)'
        required: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: sparxworks
  REGION: us-central1
  CLUSTER: sparx-prod-autopilot
  NAMESPACE: sparx-prod
  AR_REPO: sparx
  WIF_PROVIDER: projects/631794111842/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOYER_SA: sparx-deployer@sparxworks.iam.gserviceaccount.com

jobs:
  deploy:
    name: Rollout
    runs-on: ubuntu-latest
    # Phases fan out (see the rollout steps), so the job is bounded by the
    # slowest SINGLE service, not the fleet sum. 30 leaves ample headroom as
    # the fleet grows — a serial rollout blew the old 20-minute cap once the
    # Cloud Run worker count climbed (v1.164.0/v1.165.0 both timed out).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      # Connect Gateway routes through Google's proxy and works against the
      # private GKE endpoint. `get-gke-credentials@v2` returns the public IP
      # which is unreachable from the runner — that's what caused the i/o
      # timeout against 35.255.x.x in earlier runs.
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE credentials via Connect Gateway
        # Fleet membership lives at `global` (terraform/modules/gke/main.tf).
        run: gcloud container fleet memberships get-credentials "$CLUSTER" --location global

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.sha || github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Rollout image to each app & worker
        run: |
          IMAGE_BASE="$REGION-docker.pkg.dev/${{ env.PROJECT_ID }}/$AR_REPO"
          # Update only the Deployments that currently exist. Skipping unknown
          # services keeps the workflow green during phased rollouts.
          # dashboard decommissioned 2026-07-22 — the workbench replaced it at
          # app.sparx.works. (The kubectl-get guard below would self-skip it once
          # the Deployment is torn down, but drop it from the list too.)
          #
          # `set image` is instant; the wait is `rollout status`. Set every image
          # first, then wait for all rollouts CONCURRENTLY so this phase costs the
          # slowest single deployment, not their sum. Per-service logs are captured
          # and replayed under a group so parallel output stays attributable.
          tmp=$(mktemp -d)
          rolling=()
          for svc in web api-rest api-graphql api-mcp mcp-site workbench site market \
                     media-worker \
                     email-worker domain-worker dropship-worker billing-worker webhook-worker; do
            if kubectl get deployment "$svc" -n $NAMESPACE >/dev/null 2>&1; then
              echo "::notice::Rolling out $svc"
              kubectl set image deployment/$svc \
                $svc=$IMAGE_BASE/$svc:${{ steps.tag.outputs.tag }} \
                -n $NAMESPACE
              rolling+=("$svc")
            else
              echo "::notice::Skipping $svc — Deployment not present in cluster yet."
            fi
          done
          pids=()
          for svc in "${rolling[@]}"; do
            kubectl rollout status deployment/$svc -n $NAMESPACE --timeout=5m >"$tmp/$svc.log" 2>&1 &
            pids+=($!)
          done
          fail=0
          for i in "${!rolling[@]}"; do
            svc="${rolling[$i]}"
            echo "::group::$svc rollout"
            if wait "${pids[$i]}"; then
              cat "$tmp/$svc.log" 2>/dev/null || true
              echo "OK: $svc"
            else
              cat "$tmp/$svc.log" 2>/dev/null || true
              echo "::error::rollout failed for $svc"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      # The admin console lives in the wize-admin namespace (docs/apps/admin/
      # build-plan.md §2 D2), not sparx-prod, so the loop above (`-n $NAMESPACE`)
      # doesn't reach it. Roll it separately. Skips silently until the Deployment
      # exists (first bring-up is via bootstrap.yml components=wize-admin).
      - name: Rollout admin console (wize-admin namespace)
        run: |
          IMAGE_BASE="$REGION-docker.pkg.dev/${{ env.PROJECT_ID }}/$AR_REPO"
          if kubectl get deployment admin -n wize-admin >/dev/null 2>&1; then
            echo "::group::Rolling out admin (wize-admin)"
            kubectl set image deployment/admin \
              admin=$IMAGE_BASE/admin:${{ steps.tag.outputs.tag }} \
              -n wize-admin
            kubectl rollout status deployment/admin -n wize-admin --timeout=5m
            echo "::endgroup::"
          else
            echo "::notice::Skipping admin — Deployment not present in wize-admin yet."
          fi

      # Cloud Run services live outside the cluster — they don't show up in
      # `kubectl get deployment`. Roll their image with `gcloud run services
      # update`. TF's cloud-run-worker module sets lifecycle.ignore_changes
      # on image, so this drift is expected and won't be reverted on the
      # next `terraform apply`. Skips silently if the service doesn't exist
      # yet (Cloud Run returns non-zero, we tolerate it).
      - name: Rollout image to each Cloud Run service
        run: |
          IMAGE_BASE="$REGION-docker.pkg.dev/${{ env.PROJECT_ID }}/$AR_REPO"
          # Each `gcloud run services update` waits for its OWN revision to go
          # healthy (~1-2 min). Serially across the whole worker fleet that blew
          # the job timeout (v1.164.0/v1.165.0 were cancelled mid-list here), so
          # fan them all out and wait for the set — bounded by the slowest one.
          # Per-service logs are captured and replayed under a group afterwards.
          tmp=$(mktemp -d)
          pids=()
          names=()
          for svc in email-worker media-worker commerce-indexer legal-seed-worker automation-worker \
                     push-worker markup-recompute-worker channel-sync-worker domain-worker dropship-worker \
                     social-worker; do
            if gcloud run services describe "$svc" --region="$REGION" --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
              echo "::notice::Rolling out $svc (Cloud Run)"
              gcloud run services update "$svc" \
                --region="$REGION" \
                --project="${{ env.PROJECT_ID }}" \
                --image="$IMAGE_BASE/$svc:${{ steps.tag.outputs.tag }}" \
                --quiet >"$tmp/$svc.log" 2>&1 &
              pids+=($!)
              names+=("$svc")
            else
              echo "::notice::Skipping $svc — Cloud Run service not present yet."
            fi
          done
          fail=0
          for i in "${!names[@]}"; do
            svc="${names[$i]}"
            echo "::group::$svc (Cloud Run) rollout"
            if wait "${pids[$i]}"; then
              cat "$tmp/$svc.log" 2>/dev/null || true
              echo "OK: $svc"
            else
              cat "$tmp/$svc.log" 2>/dev/null || true
              echo "::error::Cloud Run rollout failed for $svc"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Smoke test
        run: |
          # Hit /health on the public endpoints. Will only succeed once
          # Cloudflare is live and DNS resolves.
          for host in api.sparx.works app.sparx.works mcp.sparx.works; do
            if curl -fsSL --max-time 10 "https://$host/health" >/dev/null; then
              echo "OK: $host"
            else
              echo "::warning::smoke check failed for $host (expected during pre-DNS phase)"
            fi
          done
