# Platform-CRM backfill (docs/140 §7).
#
# Puts tenants that signed up BEFORE the platform-crm-worker existed onto sparx's
# own signup board — plus anything published while the Pub/Sub subscriptions did
# not yet exist, since a subscription only receives what is published after it is
# created.
#
# Trigger: workflow_dispatch only — human-gated, like bootstrap.yml. There is no
# push trigger by design: this is a maintenance action, not a deploy.
#
# Flow:
#   1. Authenticate to GCP via Workload Identity Federation (no service-account
#      key — the repo is bound to sparx-deployer, same as db-migrate).
#   2. Execute the `platform-crm-backfill` Cloud Run job and wait for it.
#   3. Stream the execution's logs back into the run so the outcome is in the
#      run record rather than in someone's terminal.
#
# DRY RUN BY DEFAULT. The job's Terraform-declared args omit `--apply`, so the
# default mode reports what it would touch and writes nothing. `apply` overrides
# the args at execution time — the safe default stays in Terraform state, so
# choosing `apply` here never causes drift.
#
# Why a Cloud Run job rather than a packages/db backfill run by db-migrate: the
# mirror writes THROUGH the CRM service layer under RLS, so it has to run as the
# worker's own identity on the worker's own image. The db-migrate backfills run
# as the migration owner doing raw data rewrites. See docs/140 §7 + D9.
#
# The job runs `:latest`, so ship the worker image BEFORE running this — a
# backfill against a stale image runs stale code.

name: Platform CRM Backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run reports what it would touch and writes nothing. apply performs the backfill (idempotent — re-running updates the same contact + deal).'
        required: true
        default: 'dry-run'
        type: choice
        options: ['dry-run', 'apply']

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation OIDC token

# One backfill at a time. Two concurrent executions would race on the same
# contacts and deals — the writes are idempotent, so the result would still be
# correct, but the logs become impossible to read and the Cloud Run job would
# queue an execution behind one already holding the DB connections.
concurrency:
  group: platform-crm-backfill
  cancel-in-progress: false

env:
  PROJECT_ID: sparxworks
  REGION: us-central1
  JOB_NAME: platform-crm-backfill

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # the job itself is capped at 1800s + one retry
    steps:
      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/631794111842/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: sparx-deployer@sparxworks.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Execute backfill job
        id: execute
        run: |
          set -euo pipefail
          MODE='${{ github.event.inputs.mode }}'
          echo "::notice::Running the platform-CRM backfill in ${MODE} mode"

          # `apply` overrides the container args for THIS execution only. The
          # entrypoint is `node`, so the args carry the loader + script path too.
          ARGS=()
          if [ "$MODE" = 'apply' ]; then
            ARGS+=(--args=--import,tsx,scripts/backfill-tenants.ts,--apply)
          fi

          # Capture the execution name even when the job exits non-zero, so the
          # log step below can still report what happened.
          set +e
          gcloud run jobs execute "$JOB_NAME" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --wait \
            "${ARGS[@]}" 2>&1 | tee /tmp/execute.log
          STATUS=${PIPESTATUS[0]}
          set -e

          EXECUTION=$(grep -oE "${JOB_NAME}-[a-z0-9]+" /tmp/execute.log | head -1 || true)
          echo "execution=$EXECUTION" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Backfill logs
        if: steps.execute.outputs.execution != ''
        run: |
          set -euo pipefail
          echo "::group::Execution ${{ steps.execute.outputs.execution }}"
          # The worker logs structured JSON to stderr; pull both streams and show
          # the backfill's own lines rather than the CRM event chatter.
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND labels.\"run.googleapis.com/execution_name\"=\"${{ steps.execute.outputs.execution }}\"" \
            --project="$PROJECT_ID" \
            --limit=500 \
            --freshness=1h \
            --order=asc \
            --format='value(jsonPayload.msg,jsonPayload.tenantId,jsonPayload.slug,jsonPayload.reason,jsonPayload.err,textPayload)' \
            || echo 'Could not read execution logs.'
          echo "::endgroup::"

      - name: Report outcome
        run: |
          set -euo pipefail
          if [ '${{ steps.execute.outputs.status }}' != '0' ]; then
            echo "::error::Backfill execution failed — see the logs above. The mirror is idempotent, so re-running after a fix is safe."
            exit 1
          fi
          if [ '${{ github.event.inputs.mode }}' = 'dry-run' ]; then
            echo "::notice::Dry run complete. Nothing was written. Re-run with mode=apply to perform the backfill."
          else
            echo "::notice::Backfill applied."
          fi
