# Builds every platform image and pushes it to GHCR.
#
# Replaces the Artifact Registry path in build-images.yml, which depended on the
# GCP project. GHCR is free for this repo's packages and needs no credential
# beyond the automatic GITHUB_TOKEN — one less secret than the registry it
# replaces.
#
# TAGGING: every image gets the commit SHA, and main additionally gets `latest`.
# The deploy workflow rolls out the SHA, never `latest` — that is what makes
# `kubectl rollout undo` meaningful and stops a node serving a stale layer.
name: Build images (GHCR)

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-images-ghcr.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Build a single image (blank = all)'
        required: false
        type: string

concurrency:
  # One build per ref. A newer push makes an in-flight build irrelevant, and
  # these are expensive — each image installs its own workspace closure.
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One failing image must not cancel the other 19 — a partial set is still
      # useful, and the failure is usually specific to one Dockerfile.
      fail-fast: false
      # Free runners give 20 concurrent jobs; 6 keeps headroom for other
      # workflows while still finishing a cold build in a reasonable time.
      max-parallel: 6
      matrix:
        include:
          # Apps + APIs (k8s/apps)
          - { name: api-rest, dockerfile: services/api-rest/Dockerfile }
          - { name: api-graphql, dockerfile: services/api-graphql/Dockerfile }
          - { name: api-mcp, dockerfile: services/api-mcp/Dockerfile }
          - { name: mcp-site, dockerfile: services/mcp-site/Dockerfile }
          - { name: workbench, dockerfile: apps/workbench/Dockerfile }
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: site, dockerfile: apps/site/Dockerfile }
          - { name: market, dockerfile: apps/market/Dockerfile }
          # Workers, formerly Cloud Run (k8s/self-hosted/workers.yaml)
          - { name: email-worker, dockerfile: services/email-worker/Dockerfile }
          - { name: push-worker, dockerfile: services/push-worker/Dockerfile }
          - { name: markup-recompute-worker, dockerfile: services/markup-recompute-worker/Dockerfile }
          - { name: media-worker, dockerfile: services/media-worker/Dockerfile }
          - { name: commerce-indexer, dockerfile: services/commerce-indexer/Dockerfile }
          - { name: channel-sync-worker, dockerfile: services/channel-sync-worker/Dockerfile }
          - { name: social-worker, dockerfile: services/social-worker/Dockerfile }
          - { name: legal-seed-worker, dockerfile: services/legal-seed-worker/Dockerfile }
          - { name: platform-crm-worker, dockerfile: services/platform-crm-worker/Dockerfile }
          - { name: domain-worker, dockerfile: services/domain-worker/Dockerfile }
          - { name: dropship-worker, dockerfile: services/dropship-worker/Dockerfile }
          # Migration runner, invoked as a Job by the deploy workflow.
          - { name: db, dockerfile: packages/db/Dockerfile }

    steps:
      - uses: actions/checkout@v4

      # Skip everything if a single service was requested and this is not it.
      # Cheaper than a second job to compute a dynamic matrix.
      - name: Should this image build?
        id: gate
        run: |
          want='${{ inputs.service }}'
          if [ -z "$want" ] || [ "$want" = '${{ matrix.name }}' ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.name }} — only '$want' requested."
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.build == 'true'

      - uses: docker/login-action@v3
        if: steps.gate.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # No stored secret — GITHUB_TOKEN is minted per run and scoped by the
          # `packages: write` permission above.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          # ALWAYS the repo root. Every Dockerfile COPYs from the workspace root
          # (pnpm-workspace.yaml plus its packages/* closure), so building from
          # inside a service directory fails on the first COPY.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          # Registry-backed cache, keyed per image. Each Dockerfile runs its own
          # `pnpm install --filter`, so layers are not shared between images and a
          # per-image cache scope is what actually helps.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
