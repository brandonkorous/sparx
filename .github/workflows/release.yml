# THE RELEASE PIPELINE. There is one, and this is it.
#
# ---------------------------------------------------------------------------
# The order, which is the entire design
# ---------------------------------------------------------------------------
#
#   build           the images this release will deploy
#   1 infrastructure   terraform apply, then the cluster's own resources
#   2 data             schema, then rows
#   3 containers       roll the application images
#   4 cleanup          prune what this release made obsolete
#
# Each stage depends on the one above it and nothing else. Read top to bottom
# and you have read the deployment.
#
# WHY DATA COMES BEFORE CONTAINERS. Schema before code is uncontroversial — new
# code must never meet an old schema. Rows are the same argument and were the
# same bug: `migrate` moves the schema and nothing ever put a row in it, so the
# marketplace catalog could be committed, reviewed, merged and deployed while
# remaining entirely absent from the running platform. `marketplace_themes` held
# ZERO rows against 20 committed theme bundles and /market/themes served its
# empty state for a month. Nothing was broken; there was no step that published
# it. Data is a deploy stage, so it is a stage, and a stage that fails fails the
# release — which the hand-run predecessor did not, since it logged warnings and
# let "the pipeline is green" and "the catalog is empty" both be true.
#
# Putting it BEFORE the rollout is what makes that guarantee real: if the seed
# fails, the old containers are still serving and no new code ever meets data
# that was never written. Running it afterwards means discovering the data is
# wrong from a release that has already shipped.
#
# The data Jobs need a namespace, `sparx-app-env` and the `sparx-media` PVC to
# exist. Those are infrastructure, so they are applied by stage 1
# (k8s/azure/infra) rather than riding along with the Deployments — see
# k8s/azure/infra/kustomization.yaml. That split is what lets this order hold on
# a cluster that has never been deployed, instead of only on one that already
# has yesterday's pods on it.
#
# ---------------------------------------------------------------------------
# The destination is a VARIABLE
# ---------------------------------------------------------------------------
#
# A release pipeline describes how to ship, not where. Resource group, cluster
# and namespace are read from environment variables in the `target` job and
# threaded downstream; the literals below are defaults so the current
# deployment keeps working with nothing configured. Adding an environment is
# setting three variables on it, not forking this file.
#
# This replaces a naming convention that had grown to eight files — deploy /
# db-migrate / build / marketplace-ingest, each doubled per cloud — where the
# thing that actually varied was three strings.
#
# ---------------------------------------------------------------------------
# ONE COMMIT, ONE RELEASE, ONE SHA
# ---------------------------------------------------------------------------
#
# `build` runs inside this workflow and builds EVERY image, unfiltered, so
# `github.sha` is the only version this pipeline has. What used to be here
# instead: a separate path-filtered build workflow, a `workflow_run` trigger to
# chain off it, a `manifest_sha` and an `image_sha` that were "not always the
# same", and a loop walking back fifty commits asking GHCR whether each one had
# images. All of that existed to answer "which images do these manifests go
# with" — a question this pipeline does not have, because it builds them.
#
# The path filter was there to avoid rebuilding 22 images to publish identical
# bytes. It is not worth its complexity: this repository is PUBLIC, so Actions
# minutes are free, and every image restores from its own `type=gha` cache scope
# when nothing under it changed. The cost was never money; it was two SHAs.
name: Release

on:
  # Every commit on main is a release. No path filters — a manifest-only commit,
  # a bundle-only commit and a source commit all take the identical path, which
  # is precisely the class of "this change was merged but never deployed" bug
  # that path-filtered triggers kept producing.
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Where to release'
        required: false
        default: prod
        type: choice
        options: [prod]
      # Stage skips, for re-running part of a release. Each defaults to ON, so
      # a dispatch with nothing touched is a full release.
      infrastructure:
        description: 'Stage 1 — apply Terraform + cluster resources'
        required: false
        default: true
        type: boolean
      data:
        description: 'Stage 2 — migrate the schema and seed platform data'
        required: false
        default: true
        type: boolean
      containers:
        description: 'Stage 3 — roll the application images'
        required: false
        default: true
        type: boolean
      allow_infrastructure_destroy:
        description: 'Stage 1 — permit a Terraform plan that DELETES resources'
        required: false
        default: false
        type: boolean
      bump:
        description: 'Version bump (auto = read the conventional commits)'
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'patch', 'minor', 'major', 'none']

concurrency:
  # Never two releases at once: the second would fight the first's
  # `rollout status` and could interleave `kubectl apply` writes.
  group: release-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC, to Azure and to Entra. No stored credential.
  packages: write # build pushes to GHCR; cleanup prunes it
  actions: write # cleanup deletes obsolete workflow runs

jobs:
  # ---------------------------------------------------------------------------
  # Where this release is going. Resolved ONCE.
  #
  # Every downstream job reads these outputs instead of repeating a literal, so
  # retargeting is a variable change rather than a find-and-replace across four
  # jobs. The `environment:` key is what makes environment-scoped variables
  # resolve, which is the mechanism that makes a second environment possible at
  # all.
  # ---------------------------------------------------------------------------
  target:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'prod' }}
    outputs:
      environment: ${{ inputs.environment || 'prod' }}
      resource_group: ${{ steps.resolve.outputs.resource_group }}
      cluster: ${{ steps.resolve.outputs.cluster }}
      namespace: ${{ steps.resolve.outputs.namespace }}
      terraform_dir: ${{ steps.resolve.outputs.terraform_dir }}
      overlay: ${{ steps.resolve.outputs.overlay }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the destination
        id: resolve
        env:
          RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP || 'rg-sparx-prod-cus' }}
          CLUSTER: ${{ vars.AKS_CLUSTER || 'aks-sparx-prod-cus' }}
          NAMESPACE: ${{ vars.K8S_NAMESPACE || 'sparx-prod' }}
          TERRAFORM_DIR: ${{ vars.TERRAFORM_DIR || 'terraform/envs/azure' }}
          OVERLAY: ${{ vars.K8S_OVERLAY || 'k8s/azure' }}
        run: |
          set -euo pipefail

          # The namespace is named in TWO places that must agree: this variable,
          # which every `kubectl -n` below uses, and the `namespace:` field of
          # the kustomize overlays, which stamps it onto every manifest. Reading
          # one and hoping about the other is how a release applies Deployments
          # into `sparx-prod` and then waits for a rollout in `sparx-staging`,
          # succeeding at both and deploying nothing anyone can see.
          #
          # Kustomize has no way to take that value from the environment, so the
          # honest fix is to check rather than to template: a mismatch is a
          # misconfigured environment and it should say so, once, here — not
          # twenty minutes later as a timeout.
          for k in "$OVERLAY/infra" "$OVERLAY/apps"; do
            declared=$(awk '/^namespace:/ { print $2; exit }' "$k/kustomization.yaml")
            if [ "$declared" != "$NAMESPACE" ]; then
              echo "::error::$k/kustomization.yaml declares namespace '$declared' but K8S_NAMESPACE is '$NAMESPACE'."
              exit 1
            fi
          done

          {
            echo "resource_group=$RESOURCE_GROUP"
            echo "cluster=$CLUSTER"
            echo "namespace=$NAMESPACE"
            echo "terraform_dir=$TERRAFORM_DIR"
            echo "overlay=$OVERLAY"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Releasing \`${GITHUB_SHA:0:12}\`"
            echo ''
            echo '| | |'
            echo '| --- | --- |'
            echo "| environment | \`${{ inputs.environment || 'prod' }}\` |"
            echo "| resource group | \`$RESOURCE_GROUP\` |"
            echo "| cluster | \`$CLUSTER\` |"
            echo "| namespace | \`$NAMESPACE\` |"
            echo "| terraform | \`$TERRAFORM_DIR\` |"
            echo "| overlay | \`$OVERLAY\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # BUILD — the artifacts this release deploys.
  #
  # Not a stage of the deployment; the thing the stages deploy. Every image is
  # tagged with this commit's SHA, so stages 2 and 3 name a version rather than
  # discovering one.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # The shared runtime base for every Node service. Built FIRST, because the 17
  # service images below are three lines of metadata on top of it.
  #
  # This is what stops one node from running out of disk. Each service used to
  # run its own `pnpm install --filter`, so seventeen images each carried a
  # near-identical dependency tree that nothing deduplicated — ~880 MB apiece,
  # ~18 GB per release generation. A rollout necessarily holds TWO generations
  # (the pods still serving and the pods coming up), which overran the 110 GB
  # disk on 2026-08-02 and left the whole worker fleet in ImagePullBackOff.
  # Sharing the base means the node stores that tree once per release.
  #
  # Read Dockerfile.base for the two decisions inside it that matter.
  # ---------------------------------------------------------------------------
  base:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the base reference
        id: ref
        run: echo "image=ghcr.io/${{ github.repository }}/base:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push the base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}
            ghcr.io/${{ github.repository }}/base:latest
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
          provenance: false

  build:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      # One failing image must not cancel the other 21 — the failure is almost
      # always specific to one Dockerfile, and seeing all of them fail is worth
      # more than failing fast.
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          # Apps + APIs (k8s/apps)
          - { name: api-rest, dockerfile: services/api-rest/Dockerfile }
          - { name: api-graphql, dockerfile: services/api-graphql/Dockerfile }
          - { name: api-mcp, dockerfile: services/api-mcp/Dockerfile }
          - { name: mcp-site, dockerfile: services/mcp-site/Dockerfile }
          - { name: workbench, dockerfile: apps/workbench/Dockerfile }
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: site, dockerfile: apps/site/Dockerfile }
          - { name: market, dockerfile: apps/market/Dockerfile }
          - { name: admin, dockerfile: apps/admin/Dockerfile }
          # Workers (k8s/self-hosted/workers.yaml)
          - { name: automation-worker, dockerfile: services/automation-worker/Dockerfile }
          - { name: email-worker, dockerfile: services/email-worker/Dockerfile }
          - { name: push-worker, dockerfile: services/push-worker/Dockerfile }
          - {
              name: markup-recompute-worker,
              dockerfile: services/markup-recompute-worker/Dockerfile,
            }
          - { name: media-worker, dockerfile: services/media-worker/Dockerfile }
          - { name: commerce-indexer, dockerfile: services/commerce-indexer/Dockerfile }
          - { name: channel-sync-worker, dockerfile: services/channel-sync-worker/Dockerfile }
          - { name: social-worker, dockerfile: services/social-worker/Dockerfile }
          - { name: legal-seed-worker, dockerfile: services/legal-seed-worker/Dockerfile }
          - { name: platform-crm-worker, dockerfile: services/platform-crm-worker/Dockerfile }
          - { name: domain-worker, dockerfile: services/domain-worker/Dockerfile }
          - { name: dropship-worker, dockerfile: services/dropship-worker/Dockerfile }
          - { name: import-worker, dockerfile: services/import-worker/Dockerfile }
          - { name: inventory-worker, dockerfile: services/inventory-worker/Dockerfile }
          # The migration + seed runner. Not a Deployment — stage 2 runs it as a
          # Job, which is why it is built alongside the images it never joins.
          - { name: db, dockerfile: packages/db/Dockerfile }

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # No stored secret — GITHUB_TOKEN is minted per run and scoped by the
          # `packages: write` permission above.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # ALWAYS the repo root. The Next.js app Dockerfiles COPY from the
          # workspace root, so building from inside an app directory fails on
          # the first COPY. (The Node services no longer copy anything — they
          # inherit it all from the base.)
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Every Node service resolves this to the base built from THIS commit.
          # The five Next.js apps ignore it: they build standalone bundles, are
          # already small (76-121 MB), and share nothing with the service tree.
          build-args: |
            BASE=${{ needs.base.outputs.image }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  # ---------------------------------------------------------------------------
  # STAGE 1 — INFRASTRUCTURE
  #
  # Terraform owns the cloud: the cluster, the managed Postgres, the reserved
  # public IP, DNS, the origin certificate. Then the cluster's own long-lived
  # resources — namespace, secrets, config, the media volume, Typesense, the
  # ingress — are applied from k8s/azure/infra.
  #
  # Both halves are "things that exist and converge", as opposed to stage 3,
  # which is "images that are replaced". That is the line the split follows.
  #
  # Until now NOTHING ran Terraform. It was applied by hand from a laptop, which
  # meant the state of production depended on someone having remembered to, and
  # a manifest referencing `pip-ingress-sparx-prod-cus` could be deployed
  # against a subscription where no such address existed. The remote state
  # backend and the OIDC identity to use it have existed since
  # terraform/bootstrap-azure; the only missing piece was this job.
  # ---------------------------------------------------------------------------
  infrastructure:
    needs: [target, build]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.infrastructure }}
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}
    outputs:
      # Whether this run changed the app Secret. The containers stage rolls on it —
      # env reaches a pod only at start, so a changed secret with no rollout is a
      # release that reports success and changes nothing.
      secrets_changed: ${{ steps.secrets.outputs.changed }}
    env:
      RESOURCE_GROUP: ${{ needs.target.outputs.resource_group }}
      CLUSTER: ${{ needs.target.outputs.cluster }}
      NAMESPACE: ${{ needs.target.outputs.namespace }}
      TERRAFORM_DIR: ${{ needs.target.outputs.terraform_dir }}
      OVERLAY: ${{ needs.target.outputs.overlay }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          # The wrapper rewrites stdout to add its own markers, which breaks
          # `terraform show -json` being piped into jq below.
          terraform_wrapper: false

      # -----------------------------------------------------------------------
      # Terraform runs under the SAME OIDC identity as everything else. The
      # azurerm backend is configured with `use_azuread_auth`, so the state blob
      # is read with the run's Entra token and no storage key exists to leak.
      #
      # ARM_USE_OIDC + the ARM_* ids are what the provider and the backend both
      # read; `azure/login` above has already exchanged the GitHub token, but
      # Terraform does not inherit the CLI's session and needs to be told
      # directly.
      # -----------------------------------------------------------------------
      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          ARM_USE_OIDC: 'true'
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform init -input=false

      # -----------------------------------------------------------------------
      # Plan, then decide. `-detailed-exitcode` gives 0 = no changes, 2 =
      # changes, 1 = error, which is the difference between "nothing to do" and
      # "something to do" without parsing prose.
      #
      # EVERY input this environment takes is passed explicitly from a variable
      # or a secret. A variable left unset silently falls back to the default in
      # variables.tf, and several of those defaults DISABLE things — DNS,
      # the origin certificate — so an unset variable does not mean "leave it
      # alone", it means "plan to delete it". That is exactly what the destroy
      # guard below is for, and why its failure message says to check the
      # variables first.
      # -----------------------------------------------------------------------
      # -----------------------------------------------------------------------
      # Terraform inputs. UNSET MEANS OMITTED, NEVER INVENTED.
      #
      # An unset GitHub secret or variable is an EMPTY STRING, and empty is not
      # the same as absent: `TF_VAR_x=""` OVERRIDES the default in variables.tf.
      # For a bool that is not even parseable; for the Cloudflare token, whose
      # LENGTH the provider validates at plan time, it fails the plan outright.
      #
      # So every input below is written only when it actually has a value, and
      # anything missing falls through to variables.tf — which is the only
      # source that knows what this environment was applied with.
      #
      # THIS IS NOT A STYLE CHOICE. The first run of this pipeline defaulted the
      # two Cloudflare booleans to "true whenever a token exists", reasoning that
      # a token implies intent. It does not. `cloudflare_origin_ca_enabled` is
      # deliberately a SEPARATE variable from `cloudflare_enabled` precisely so
      # DNS stays appliable with a token that cannot sign certificates
      # (origin-ca.tf, and the 1016 it names). Forcing it on planned ten
      # additive resources — an origin certificate, an Access application and
      # policy, and four sparx.email records — and Cloudflare refused six of
      # them, failing the release at `apply` with two orphaned TLS resources
      # left in state.
      #
      # A default guessed here silently overrides a decision someone made
      # deliberately over there. Guess nothing.
      # -----------------------------------------------------------------------
      - name: Resolve Terraform inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ENABLED: ${{ vars.CLOUDFLARE_ENABLED }}
          CLOUDFLARE_ORIGIN_CA_ENABLED: ${{ vars.CLOUDFLARE_ORIGIN_CA_ENABLED }}
          OPERATOR_ACCESS_EMAILS: ${{ vars.OPERATOR_ACCESS_EMAILS }}
          DKIM_SELECTOR: ${{ vars.SPARX_EMAIL_DKIM_SELECTOR }}
          DKIM_VALUE: ${{ vars.SPARX_EMAIL_DKIM_VALUE }}
          LOCATION: ${{ vars.AZURE_LOCATION }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ENVIRONMENT: ${{ needs.target.outputs.environment }}
        run: |
          set -euo pipefail

          # $1 = terraform variable name, $2 = value. Empty $2 writes nothing.
          put() {
            [ -n "$2" ] || { echo "  (omitted) $1 — variables.tf default applies"; return 0; }
            echo "TF_VAR_$1=$2" >> "$GITHUB_ENV"
            case "$1" in
              *token*|*key*|*password*) echo "  set $1" ;;
              *) echo "  set $1=$2" ;;
            esac
          }

          put subscription_id             "$SUBSCRIPTION_ID"
          put environment                 "$ENVIRONMENT"
          put location                    "$LOCATION"
          put cloudflare_api_token        "$CLOUDFLARE_API_TOKEN"
          put cloudflare_enabled          "$CLOUDFLARE_ENABLED"
          put cloudflare_origin_ca_enabled "$CLOUDFLARE_ORIGIN_CA_ENABLED"
          put operator_access_emails      "$OPERATOR_ACCESS_EMAILS"
          put sparx_email_dkim_selector   "$DKIM_SELECTOR"
          put sparx_email_dkim_value      "$DKIM_VALUE"

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          ARM_USE_OIDC: 'true'
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          terraform plan -input=false -lock-timeout=5m -detailed-exitcode -out=tfplan \
            && code=0 || code=$?

          case "$code" in
            0) echo 'changes=false' >> "$GITHUB_OUTPUT" ;;
            2) echo 'changes=true'  >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

          terraform show -json tfplan > tfplan.json

      # -----------------------------------------------------------------------
      # THE GUARD. A pipeline that can silently delete the production database
      # is not automation, it is a loaded weapon on a timer.
      #
      # Terraform records an intent per resource as a list of actions. `delete`
      # alone is a destroy; `["delete","create"]` or `["create","delete"]` is a
      # REPLACEMENT, which destroys the existing resource and is the more
      # dangerous of the two precisely because the summary line says "1 to
      # change" in casual reading. Both are refused.
      #
      # Additive plans apply unattended, which is the common case and the whole
      # point. Anything destructive stops the release with the resources named,
      # and re-running by hand with `allow_infrastructure_destroy` is a
      # deliberate act by someone who has read them.
      # -----------------------------------------------------------------------
      - name: Refuse a destructive plan
        if: steps.plan.outputs.changes == 'true'
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          set -euo pipefail
          DESTRUCTIVE=$(jq -r '
            [ .resource_changes[]?
              | select(.change.actions | index("delete"))
              | "\(.change.actions | join("+"))\t\(.address)" ]
            | .[]' tfplan.json)

          {
            echo '### Terraform plan'
            echo ''
            terraform show -no-color tfplan | tail -c 60000 | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$DESTRUCTIVE" ]; then
            echo 'Plan is additive — applying.'
            exit 0
          fi

          echo "$DESTRUCTIVE"
          if [ '${{ inputs.allow_infrastructure_destroy }}' = 'true' ]; then
            echo '::warning::Applying a plan that DESTROYS the resources above — allow_infrastructure_destroy was set.'
            exit 0
          fi

          {
            echo ''
            echo '> [!CAUTION]'
            echo '> **The release stopped: this plan destroys infrastructure.**'
            echo ''
            echo '| action | resource |'
            echo '| --- | --- |'
            printf '%s\n' "$DESTRUCTIVE" | awk -F'\t' '{ print "| `" $1 "` | `" $2 "` |" }'
            echo ''
            echo 'A `delete` that nobody asked for is almost always a Terraform *variable* that is'
            echo 'unset in this environment, not a real intent to remove something — an unset'
            echo 'variable takes the default in `variables.tf`, and several of those defaults turn'
            echo 'features off. Check those first.'
            echo ''
            echo 'If the deletion is genuinely wanted, re-run this workflow manually with'
            echo '**allow_infrastructure_destroy** ticked.'
          } >> "$GITHUB_STEP_SUMMARY"

          echo '::error::Terraform plan would DESTROY resources. Stopping the release. See the run summary.'
          exit 1

      - name: Terraform apply
        if: steps.plan.outputs.changes == 'true'
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          ARM_USE_OIDC: 'true'
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan

      - name: Get cluster credentials
        run: |
          az aks get-credentials --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER" --overwrite-existing
          kubectl version --client

      # -----------------------------------------------------------------------
      # Secrets. Recreated every release from Azure Key Vault (or, until the
      # cutover, the SPARX_APP_SECRETS_ENV repo blob), so the cluster never holds
      # a value that has been rotated at the source.
      #
      # `create --dry-run | apply` is the idempotent form: plain `create` fails
      # on the second run, and `apply` alone cannot build a Secret from
      # literals.
      #
      # This is stage 1 rather than stage 2 because the migration, the seed and
      # the ingest all read these — the schema cannot be moved before the
      # credential to move it with exists.
      #
      # The vault is created by terraform/bootstrap-azure, NOT by the environment
      # this job applies: that apply and this read happen in the same job, so a
      # vault created there would be empty the first time anything looked at it —
      # and a `terraform destroy` of the cluster must never take the secrets with
      # it. Reading it needs `Key Vault Secrets User`, which bootstrap grants to
      # this identity; subscription Contributor does NOT include the data plane.
      # -----------------------------------------------------------------------
      - name: Sync secrets
        id: secrets
        env:
          # The source of the bundle is chosen by AZURE_KEY_VAULT_NAME — see the
          # branch below. Both inputs are declared because the cutover keeps the
          # blob available as a one-variable rollback.
          KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
          APP_SECRETS: ${{ secrets.SPARX_APP_SECRETS_ENV }}
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
          # For `terraform output` below — the media storage credentials are read
          # back out of the state this job just applied.
          ARM_USE_OIDC: 'true'
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          # WHERE THE BUNDLE COMES FROM.
          #
          # `AZURE_KEY_VAULT_NAME` set → Key Vault is the source of truth. Unset →
          # the legacy `SPARX_APP_SECRETS_ENV` repo blob. Cutover is setting one
          # repository variable; rollback is unsetting it, and the blob path below
          # is byte-for-byte what it always was so that rollback is a true one.
          #
          # A SET-BUT-EMPTY VAULT FAILS THE RELEASE rather than falling back to the
          # blob. That is deliberate and matches EVENT_BROKER's throw-on-unset: a
          # silent fallback turns a configuration mistake into a half-populated
          # Secret that deploys successfully and then fails somewhere unrelated,
          # hours later, looking like an application bug.
          #
          # WHY A VAULT AT ALL. GitHub secrets are WRITE ONLY — nothing can read one
          # back — so adding a single key meant rebuilding all ~30 from a copy kept
          # elsewhere and hoping `gh secret set`, which REPLACES, got every one of
          # them right. Key Vault makes each secret its own readable, versioned
          # object: adding one is `az keyvault secret set`, and nothing else moves.
          if [ -n "$KEY_VAULT_NAME" ]; then
            echo "App secrets: source is Key Vault '$KEY_VAULT_NAME'."

            # Disabled secrets are skipped, which is how a secret is retired
            # without being destroyed — disable it, release, then delete once a
            # green run proves nothing needed it.
            NAMES=$(az keyvault secret list --vault-name "$KEY_VAULT_NAME" \
                      --query "[?attributes.enabled].name" -o tsv)
            if [ -z "$NAMES" ]; then
              echo "::error::Key Vault '$KEY_VAULT_NAME' holds no enabled secrets." \
                   "Load it with k8s/scripts/sync-secrets.ps1 BEFORE setting the" \
                   "AZURE_KEY_VAULT_NAME repository variable, or unset that variable" \
                   "to fall back to SPARX_APP_SECRETS_ENV."
              exit 1
            fi

            # kebab-case → SCREAMING_SNAKE. Bijective, and that is not an accident:
            # vault names allow only [0-9a-zA-Z-] while env names never contain a
            # hyphen, so the mapping round-trips with nothing to disambiguate.
            #
            # Values are streamed through a FILE and `jq -j`, never through $(…),
            # because command substitution strips trailing newlines — the exact
            # class of silent truncation the _B64 convention further down exists to
            # defeat. `jq -j` writes the raw value and adds nothing of its own.
            : > /tmp/app.env
            KV_COUNT=0
            for name in $NAMES; do
              env_name=$(printf '%s' "$name" | tr 'a-z-' 'A-Z_')
              az keyvault secret show --vault-name "$KEY_VAULT_NAME" \
                --name "$name" -o json > /tmp/kv-one.json
              printf '%s=' "$env_name" >> /tmp/app.env
              jq -j '.value' /tmp/kv-one.json >> /tmp/app.env
              printf '\n' >> /tmp/app.env
              KV_COUNT=$((KV_COUNT + 1))
            done
            rm -f /tmp/kv-one.json
            echo "App secrets: read $KV_COUNT secret(s) from Key Vault."
          else
            if [ -z "$APP_SECRETS" ]; then
              echo "::error::SPARX_APP_SECRETS_ENV is empty and AZURE_KEY_VAULT_NAME is unset," \
                   "so there is no source for the app secrets. See k8s/azure/README.md."
              exit 1
            fi
            echo "App secrets: source is the SPARX_APP_SECRETS_ENV repo blob." \
                 "Set the AZURE_KEY_VAULT_NAME repository variable to move to Key Vault."

            # A dotenv blob, so one repo secret carries the whole bundle rather
            # than ~30 individually-managed ones.
            printf '%s' "$APP_SECRETS" > /tmp/app.env
          fi

          # KEY_B64=<base64> → KEY=<decoded>, for values a dotenv line cannot
          # carry safely.
          #
          # Not hypothetical: OPERATOR_AUTH_SECRET ends with a CARRIAGE RETURN
          # (45 bytes, not 44). Better Auth uses the secret's exact bytes as key
          # material for the encrypted TOTP secrets and backup codes, so that
          # trailing \r is load-bearing — drop it and every operator's
          # authenticator AND their backup codes stop verifying. A trailing \r
          # before a newline is invisible in a browser textarea and does not
          # survive a copy-paste, so round-tripping the raw value through a repo
          # secret is a trap that re-arms itself every time the blob is edited.
          # STRIPE_WEBHOOK_SECRET_SPARX_PAY is the same shape.
          #
          # base64 has no such ambiguity. Prefer it for ANY secret with leading
          # or trailing whitespace rather than trying to preserve the whitespace.
          # The _B64 keys are NEVER decoded into the env file. They are held back
          # and written straight into the Secret's `data` field after it is
          # created, because `data` is itself base64 — so the bytes reach the
          # kubelet without passing through a single text parser.
          #
          # Decoding them here would defeat the point. `--from-env-file` reads
          # LINES, and a value whose last byte is \r is indistinguishable from a
          # CRLF line ending to any such parser; trimming it is the reasonable
          # thing for a text format to do, and it would silently reconstruct the
          # exact 44-byte secret that broke 2FA in the first place. Shell text
          # tools do the same: grep and cut both ate the \r while this was being
          # verified, which is how the bug hid for so long.
          grep -v '_B64=' /tmp/app.env > /tmp/app.env.plain || true
          grep '_B64=' /tmp/app.env > /tmp/app.env.b64 || true
          B64_COUNT=$(wc -l < /tmp/app.env.b64 | tr -d ' ')

          # OPERATOR_DATABASE_URL — derived when absent, never silently omitted.
          #
          # apps/admin talks to the wize_admin schema as `wize_operator`, a
          # different role from the one in DATABASE_URL. When the var is unset,
          # packages/operator-auth/src/db.ts falls back to a LOCALHOST dev
          # default — so the admin pod dialled 127.0.0.1:5544 in-cluster and
          # every sign-in returned 500, while the console looked deployed and
          # healthy.
          #
          # Deriving it is sound rather than a guess: packages/db/sql/azure-bootstrap.sql
          # sets wize_operator's password from the SAME app_password as
          # sparx_app, so on this provider the two differ only by role name.
          # Supplying OPERATOR_DATABASE_URL explicitly in SPARX_APP_SECRETS_ENV
          # overrides this entirely, which is what to do the moment those
          # passwords diverge.
          if ! grep -q '^OPERATOR_DATABASE_URL' /tmp/app.env; then
            DB_URL=$(grep -m1 '^DATABASE_URL=' /tmp/app.env.plain | cut -d= -f2-)
            if [ -z "$DB_URL" ]; then
              echo "::error::DATABASE_URL missing from SPARX_APP_SECRETS_ENV; cannot derive OPERATOR_DATABASE_URL."
              exit 1
            fi
            OP_URL=$(printf '%s' "$DB_URL" | sed 's#://sparx_app:#://wize_operator:#')
            case "$OP_URL" in
              *\?*) OP_URL="$OP_URL&schema=wize_admin" ;;
              *)    OP_URL="$OP_URL?schema=wize_admin" ;;
            esac
            printf 'OPERATOR_DATABASE_URL=%s\n' "$OP_URL" >> /tmp/app.env.plain
            echo "OPERATOR_DATABASE_URL not supplied; derived it from DATABASE_URL as wize_operator."
          fi

          # AZURE_STORAGE_ACCOUNT / AZURE_STORAGE_KEY — read out of the state this
          # job just applied, not copied by hand.
          #
          # These two select the media storage backend. api-rest, media-worker and
          # packages/media each take Azure Blob when BOTH are present and fall through
          # to the LOCAL DISK backend when either is missing — the backend written for
          # a laptop. That fallback is silent by design and it has already cost us
          # once: when GCP was retired `GCS_MEDIA_BUCKET` went away, all three services
          # dropped to local disk, and production media lived on a single ReadWriteOnce
          # Azure Disk for months. Nothing failed. Nothing logged. api-rest and
          # media-worker just quietly had to be pinned to the same node, because a RWO
          # volume mounts on exactly one.
          #
          # So this is DERIVED rather than supplied. Terraform owns the account and
          # rotating the key is a `terraform apply` — round-tripping it through a
          # textarea in the repo secret would mean every rotation silently reverts the
          # platform to laptop mode until someone notices images have stopped loading.
          # Supplying either key explicitly in SPARX_APP_SECRETS_ENV still wins, which
          # is the escape hatch for pointing an environment at a different account.
          # Both or neither — a half-supplied pair is the one input that reproduces the
          # original bug, since the backends require BOTH and go quietly to disk otherwise.
          HAVE_ACCOUNT=$(grep -c '^AZURE_STORAGE_ACCOUNT' /tmp/app.env || true)
          HAVE_KEY=$(grep -c '^AZURE_STORAGE_KEY' /tmp/app.env || true)
          if [ "$HAVE_ACCOUNT" -ne 0 ] && [ "$HAVE_KEY" -eq 0 ]; then
            echo "::error::SPARX_APP_SECRETS_ENV sets AZURE_STORAGE_ACCOUNT without AZURE_STORAGE_KEY." \
                 "The media backends need both and fall back to local disk with either missing." \
                 "Supply both, or neither and let Terraform provide them."
            exit 1
          fi
          if [ "$HAVE_KEY" -ne 0 ] && [ "$HAVE_ACCOUNT" -eq 0 ]; then
            echo "::error::SPARX_APP_SECRETS_ENV sets AZURE_STORAGE_KEY without AZURE_STORAGE_ACCOUNT." \
                 "The media backends need both and fall back to local disk with either missing." \
                 "Supply both, or neither and let Terraform provide them."
            exit 1
          fi

          if [ "$HAVE_ACCOUNT" -eq 0 ]; then
            ST_ACCOUNT=$(terraform -chdir="$TERRAFORM_DIR" output -raw media_storage_account 2>/dev/null || true)
            ST_KEY=$(terraform -chdir="$TERRAFORM_DIR" output -raw media_storage_key 2>/dev/null || true)
            if [ -z "$ST_ACCOUNT" ] || [ -z "$ST_KEY" ]; then
              echo "::error::Could not read media_storage_account/media_storage_key from $TERRAFORM_DIR." \
                   "Media would fall back to local disk. Either this Terraform environment does not" \
                   "define the media storage account, or set AZURE_STORAGE_ACCOUNT + AZURE_STORAGE_KEY" \
                   "explicitly in SPARX_APP_SECRETS_ENV."
              exit 1
            fi
            printf 'AZURE_STORAGE_ACCOUNT=%s\n' "$ST_ACCOUNT" >> /tmp/app.env.plain
            printf 'AZURE_STORAGE_KEY=%s\n'     "$ST_KEY"     >> /tmp/app.env.plain
            echo "Media storage: derived AZURE_STORAGE_ACCOUNT=$ST_ACCOUNT from Terraform state."
          else
            echo "Media storage: AZURE_STORAGE_ACCOUNT supplied explicitly; leaving Terraform's value unused."
          fi

          # Did the app's SECRETS actually change? The containers stage decides whether
          # to roll by diffing runtime PATHS (apps/ services/ packages/ k8s/), which is
          # right for code and blind to environment: a pod reads its env once, at start,
          # so a value that changes here reaches nothing until something restarts it.
          #
          # That blindness is not hypothetical — it is how this very step's Azure storage
          # derivation first shipped. The release went green, the Secret carried both
          # values, and every pod kept running with them unset, still serving media off
          # the local disk. A stage that succeeds while the thing it exists to change
          # does not change is the failure mode this pipeline is built to refuse.
          #
          # Compared BEFORE the apply, against the live Secret, so it needs no stored
          # state — same trick the rollout guard uses when it reads the deployed tag off
          # the cluster. Missing Secret (a first release) counts as changed.
          LIVE_HASH=$(kubectl get secret sparx-app-secrets -n "$NAMESPACE" \
            -o jsonpath='{.data}' 2>/dev/null | sha256sum | cut -d' ' -f1 || true)

          kubectl create secret generic sparx-app-secrets -n "$NAMESPACE" \
            --from-env-file=/tmp/app.env.plain \
            --dry-run=client -o yaml | kubectl apply -f -

          # Graft the whitespace-bearing values in as RAW BASE64. A Secret's
          # `data` field is base64 by definition, so the kubelet writes exactly
          # the bytes the repo secret carried — no line parsing, no trimming,
          # nothing left to lose them.
          if [ "$B64_COUNT" -gt 0 ]; then
            PATCH='{"data":{'
            SEP=''
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              key=${line%%=*}
              PATCH="$PATCH$SEP\"${key%_B64}\":\"${line#*=}\""
              SEP=','
            done < /tmp/app.env.b64
            PATCH="$PATCH}}"
            printf '%s' "$PATCH" > /tmp/app.b64.patch
            kubectl patch secret sparx-app-secrets -n "$NAMESPACE" \
              --type=merge --patch-file=/tmp/app.b64.patch
            rm -f /tmp/app.b64.patch
            echo "Applied $B64_COUNT base64 value(s) straight to the Secret's data field."
          fi

          rm -f /tmp/app.env /tmp/app.env.plain /tmp/app.env.b64

          # Read back AFTER the base64 graft, so the comparison covers the Secret as the
          # kubelet will actually serve it rather than only the dotenv half.
          NEW_HASH=$(kubectl get secret sparx-app-secrets -n "$NAMESPACE" \
            -o jsonpath='{.data}' 2>/dev/null | sha256sum | cut -d' ' -f1 || true)
          if [ "$LIVE_HASH" = "$NEW_HASH" ] && [ -n "$LIVE_HASH" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'App secrets unchanged.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'App secrets CHANGED — the containers stage will roll so pods pick them up.'
          fi

          kubectl create secret generic typesense-secrets -n "$NAMESPACE" \
            --from-literal=api-key="$TYPESENSE_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Pull secret for the GHCR namespace. GITHUB_TOKEN is scoped to this
          # run, so it is refreshed on every release by construction.
          kubectl create secret docker-registry ghcr -n "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username='${{ github.actor }}' \
            --docker-password='${{ secrets.GITHUB_TOKEN }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      # -----------------------------------------------------------------------
      # The cluster's long-lived resources: namespace, `sparx-app-env`, the
      # media volume, Typesense, and the Caddy ingress.
      #
      # This is what the 39 KB `bootstrap.yml` dispatch used to be — fifteen
      # hand-picked component names someone had to remember to run, on the one
      # cloud this platform no longer deploys to. It runs on every release now,
      # because everything in it is idempotent and the distinction it was
      # drawing ("platform pods are not app rollouts") is expressed by the
      # overlay split instead of by a human choosing from a dropdown.
      # -----------------------------------------------------------------------
      - name: Apply cluster infrastructure
        run: |
          set -euo pipefail
          kubectl apply -k "$OVERLAY/infra"
          kubectl -n "$NAMESPACE" rollout status deployment/caddy --timeout=10m
          kubectl -n "$NAMESPACE" rollout status statefulset/typesense --timeout=10m

      # The address the platform answers on. Reported here rather than after the
      # rollout because it belongs to the infrastructure that owns it, and
      # because a missing address is a stage-1 fault worth seeing before the
      # release spends twenty minutes on stages 2 and 3.
      - name: Report the ingress address
        run: |
          set -euo pipefail
          IP=''
          for _ in $(seq 1 30); do
            IP=$(kubectl get svc caddy -n "$NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            [ -n "$IP" ] && break
            sleep 10
          done

          if [ -z "$IP" ]; then
            echo "::error::The caddy Service has no LoadBalancer address after 5m. DNS points at nothing."
            kubectl describe svc caddy -n "$NAMESPACE" || true
            exit 1
          fi

          {
            echo '### Ingress'
            echo ''
            echo "\`$IP\` — DNS points here."
            echo ''
            echo '| Record | Mode | Why |'
            echo '| --- | --- | --- |'
            echo '| `*.sparx.zone` | DNS-only | on-demand ACME needs the challenge to reach the origin |'
            echo '| `media-direct.sparx.works` | DNS-only | social fetchers reject Cloudflare’s 206 on a Range request |'
            echo '| everything else | proxied | Full (strict) |'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # STAGE 2 — DATA. Schema, then rows.
  #
  # Everything here runs as an in-cluster Job, because psql-sparx-prod-cus has
  # public access DISABLED and lives in the VNet: the only thing that can reach
  # it is already inside the cluster.
  #
  #   roles    packages/db/sql/azure-bootstrap.sql. `sparx_app` — the
  #            unprivileged NOBYPASSRLS role every application connection uses —
  #            comes from a Docker-image entrypoint convention that a MANAGED
  #            Postgres will never run. Idempotent, so it runs every time.
  #   schema   `prisma migrate deploy` from the db image.
  #   rows     prisma/seed-platform.ts (the marketplace ingest that used to follow
  #            it is gone — api-rest publishes its own catalog on boot).
  #
  # All four connect as the OWNER role, not the RLS-constrained one. The
  # marketplace tables are FORCE-RLS with a policy that only admits a no-tenant
  # write, and the app role does not ERROR on those — it is silently filtered,
  # which is the failure mode that hides itself.
  #
  # Every write is an upsert or a version-guarded immutable artifact, which is
  # what makes running this on every release correct rather than merely
  # tolerable. A release that changes no data re-upserts a few hundred rows and
  # exits.
  # ---------------------------------------------------------------------------
  data:
    needs: [target, build, infrastructure]
    # `always()` with explicit result checks: a SKIPPED infrastructure stage is
    # a legitimate way to re-run just the data (`infrastructure: false` on a
    # dispatch), but a FAILED one must not be followed by writes to a database
    # whose schema pipeline never ran.
    if: >-
      always() && needs.build.result == 'success' &&
      needs.infrastructure.result != 'failure' && needs.infrastructure.result != 'cancelled' &&
      (github.event_name != 'workflow_dispatch' || inputs.data)
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}
    env:
      RESOURCE_GROUP: ${{ needs.target.outputs.resource_group }}
      CLUSTER: ${{ needs.target.outputs.cluster }}
      NAMESPACE: ${{ needs.target.outputs.namespace }}
      OVERLAY: ${{ needs.target.outputs.overlay }}
      IMAGE_DB: ghcr.io/${{ github.repository }}/db:${{ github.sha }}
      IMAGE_API: ghcr.io/${{ github.repository }}/api-rest:${{ github.sha }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get cluster credentials
        run: |
          az aks get-credentials --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER" --overwrite-existing

      # -----------------------------------------------------------------------
      # Refresh the registry pull secret WITH THIS JOB'S TOKEN.
      #
      # `GITHUB_TOKEN` expires when the job that minted it finishes. Stage 1
      # writes this Secret, so by the time stage 2 creates a Job the credential
      # in the cluster is already dead — the kubelet presents it and GHCR
      # answers `403 Forbidden` on the token endpoint. The pod then sits in
      # ImagePullBackOff until await-job.sh gives up twenty minutes later, and
      # the symptom reads like a slow migration rather than an auth failure.
      #
      # The packages are PRIVATE (an anonymous manifest fetch 404s), so this is
      # not optional. Every job that causes a pull refreshes the secret first;
      # the token is only ever valid inside the job that asked for it.
      # -----------------------------------------------------------------------
      - name: Refresh the registry pull secret
        run: |
          kubectl create secret docker-registry ghcr -n "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username='${{ github.actor }}' \
            --docker-password='${{ secrets.GITHUB_TOKEN }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure database roles
        run: |
          set -euo pipefail
          kubectl create configmap db-bootstrap-roles -n "$NAMESPACE" \
            --from-file=azure-bootstrap.sql=packages/db/sql/azure-bootstrap.sql \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl delete job db-roles -n "$NAMESPACE" --ignore-not-found
          # QUOTED heredoc. Everything inside is literal YAML or a GitHub
          # expression, and GitHub substitutes those before bash ever sees this
          # — so nothing needs shell expansion and allowing it is pure downside.
          #
          # Unquoted, bash performs command substitution on BACKTICKS inside the
          # body, INCLUDING ones sitting in YAML comments. That is not
          # hypothetical: a comment naming the `env` and `envFrom` fields in
          # backticks was executed, splicing the entire process environment into
          # the manifest, and kubectl died on "could not find expected ':'"
          # pointing at a line nobody wrote.
          kubectl apply -n "$NAMESPACE" -f - <<'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-roles
          spec:
            backoffLimit: 1
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                enableServiceLinks: false
                containers:
                  - name: psql
                    image: postgres:18-alpine
                    command: ['sh', '-c']
                    args:
                      - psql "$AUTH_DATABASE_URL" -v ON_ERROR_STOP=1 -v app_password="$SPARX_APP_PASSWORD" -f /sql/azure-bootstrap.sql
                    env:
                      - name: AUTH_DATABASE_URL
                        valueFrom:
                          secretKeyRef: { name: sparx-app-secrets, key: AUTH_DATABASE_URL }
                      - name: SPARX_APP_PASSWORD
                        valueFrom:
                          secretKeyRef: { name: sparx-app-secrets, key: SPARX_APP_PASSWORD }
                    volumeMounts:
                      - { name: sql, mountPath: /sql, readOnly: true }
                volumes:
                  - name: sql
                    configMap: { name: db-bootstrap-roles }
          YAML
          ./.github/scripts/await-job.sh db-roles "$NAMESPACE" 300

      - name: Migrate the schema
        run: |
          set -euo pipefail
          kubectl delete job db-migrate -n "$NAMESPACE" --ignore-not-found
          kubectl apply -n "$NAMESPACE" -f - <<'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-migrate
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                enableServiceLinks: false
                imagePullSecrets: [{ name: ghcr }]
                containers:
                  - name: migrate
                    image: ghcr.io/${{ github.repository }}/db:${{ github.sha }}
                    envFrom:
                      - configMapRef: { name: sparx-app-env }
                      - secretRef: { name: sparx-app-secrets }
                    env:
                      # Migrations and the hand-edited RLS SQL run as the OWNER
                      # role, not the RLS-constrained role the apps use. This
                      # explicit env entry deliberately OVERRIDES the
                      # DATABASE_URL that envFrom pulls in as sparx_app —
                      # explicit env wins over envFrom in Kubernetes, and that
                      # ordering is what makes the runner connect with owner
                      # rights.
                      #
                      # No backticks in here, deliberately, even though the
                      # heredoc is quoted. They are one `<<YAML` away from being
                      # executed again.
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef: { name: sparx-app-secrets, key: AUTH_DATABASE_URL }
          YAML
          ./.github/scripts/await-job.sh db-migrate "$NAMESPACE" 1200

      - name: Seed platform data
        run: |
          set -euo pipefail
          IMAGE="$IMAGE_DB" envsubst '$IMAGE $RUN_ID' \
            < "$OVERLAY/jobs/db-seed-platform.yaml" > /tmp/seed-job.yaml
          kubectl apply -n "$NAMESPACE" -f /tmp/seed-job.yaml
          ./.github/scripts/await-job.sh "db-seed-platform-${RUN_ID}" "$NAMESPACE" 900
          kubectl -n "$NAMESPACE" logs "job/db-seed-platform-${RUN_ID}" -c seed \
            --tail=-1 --ignore-errors=true || true

      # NOTE — THE MARKETPLACE INGEST USED TO RUN HERE, and it is gone rather than
      # moved. api-rest now publishes sparx's own themes, components and blueprints
      # itself, on BOOT, into the same rows a collaborator's upload will write.
      #
      # A release stage was the wrong shape for it three separate ways. It was a
      # step someone had to remember, so an environment could be behind — and one
      # was, for a month. It could only ADD, so a bundle deleted from the repo left
      # its listing live forever (production served 25 such rows). And it mounted the
      # media volume separately from the service, so a missing mount let it write
      # every object to its own container filesystem, exit 0, and leave catalog rows
      # pointing at keys that resolved to nothing.
      #
      # Publishing at boot answers all three: it cannot be skipped, it retracts by
      # absence, and the process writing the media is the process that serves it.
      #
      # The catalog COUNTS moved with it, to the end of stage 3 — they exist to catch
      # "ran green and wrote nothing", and the thing that writes the catalog is now
      # the rolled pods, so counting before the rollout would report the old release.

  # ---------------------------------------------------------------------------
  # STAGE 3 — CONTAINERS. The only stage that replaces anything.
  # ---------------------------------------------------------------------------
  containers:
    needs: [target, build, infrastructure, data]
    if: >-
      always() && needs.build.result == 'success' &&
      needs.infrastructure.result != 'failure' && needs.infrastructure.result != 'cancelled' &&
      needs.data.result != 'failure' && needs.data.result != 'cancelled' &&
      (github.event_name != 'workflow_dispatch' || inputs.containers)
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}
    env:
      RESOURCE_GROUP: ${{ needs.target.outputs.resource_group }}
      CLUSTER: ${{ needs.target.outputs.cluster }}
      NAMESPACE: ${{ needs.target.outputs.namespace }}
      OVERLAY: ${{ needs.target.outputs.overlay }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The change check below diffs against the SHA the cluster is running,
          # which is not reachable from a depth-1 clone.
          fetch-depth: 0

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get cluster credentials
        run: |
          az aks get-credentials --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER" --overwrite-existing

      # Same reason as the data stage: `GITHUB_TOKEN` expires with the job that
      # minted it, and every pod rolled below pulls a private image. See the
      # comment there.
      - name: Refresh the registry pull secret
        run: |
          kubectl create secret docker-registry ghcr -n "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username='${{ github.actor }}' \
            --docker-password='${{ secrets.GITHUB_TOKEN }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      # -----------------------------------------------------------------------
      # Does anything the CONTAINERS run actually differ from what is deployed?
      #
      # Every release retags all 22 images with its own SHA, which is what buys
      # the one-SHA simplicity. The side effect is that the tag changes even when
      # the bytes do not, so a docs-only commit would rewrite every pod template
      # and roll the entire platform — including api-rest, which is `Recreate`
      # and therefore briefly DOWN. The old path-filtered build avoided that by
      # accident (it published nothing, so the previous tag was re-applied and
      # nothing moved); losing it should not mean losing the behaviour.
      #
      # The comparison point is the cluster itself — the tag api-rest is running
      # IS the last released SHA — so this needs no stored state, no marker
      # branch and no extra API. If that SHA is missing or unreadable (a first
      # release, a hand-rolled image, a force-push that orphaned it), the answer
      # is "roll", because rolling unnecessarily costs a minute and skipping
      # wrongly ships nothing while reporting success.
      # -----------------------------------------------------------------------
      - name: Has anything to deploy changed?
        id: changed
        run: |
          set -euo pipefail

          # ONE write to $GITHUB_OUTPUT, at the end. Writing the same key twice
          # and trusting the later line to win is undocumented behaviour, and
          # the thing it would silently decide here is whether production rolls.
          roll=true
          reason=''

          DEPLOYED=$(kubectl -n "$NAMESPACE" get deploy api-rest \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null | sed 's/.*://' || true)

          # A changed Secret settles it before the path diff is even consulted: the
          # images may be byte-identical and the pods still need restarting, because a
          # container reads its environment once and never again.
          if [ '${{ needs.infrastructure.outputs.secrets_changed }}' = 'true' ]; then
            echo 'value=true' >> "$GITHUB_OUTPUT"
            echo 'Rolling — the app secrets changed this release; pods must restart to read them.'
            exit 0
          fi

          case "$DEPLOYED" in
            *[!0-9a-f]* | '')
              reason="api-rest is not running a SHA-tagged image ('$DEPLOYED')" ;;
            '${{ github.sha }}')
              reason='already running this commit; rolling anyway to converge manifest drift' ;;
            *)
              if ! git cat-file -e "$DEPLOYED^{commit}" 2>/dev/null; then
                reason="deployed commit $DEPLOYED is not in this history"
              # Everything that can change what a container IS or how it runs.
              # NOT a build filter — the images were built regardless; this only
              # decides whether the CLUSTER needs to move.
              elif git diff --quiet "$DEPLOYED" '${{ github.sha }}' -- \
                     apps services packages k8s pnpm-lock.yaml pnpm-workspace.yaml \
                     marketplace-catalog; then
                roll=false
                reason="nothing under apps/ services/ packages/ k8s/ changed since ${DEPLOYED:0:12}"
              else
                reason="runtime paths changed since ${DEPLOYED:0:12}"
              fi ;;
          esac

          echo "value=$roll" >> "$GITHUB_OUTPUT"

          if [ "$roll" = 'true' ]; then
            echo "Rolling — $reason."
          else
            echo "Skipping the rollout — $reason."
            {
              echo '### Containers'
              echo ''
              echo "Skipped: $reason. The pods were left alone rather than rolled onto an"
              echo 'image built from identical sources.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pin images and apply
        if: steps.changed.outputs.value == 'true'
        run: |
          set -euo pipefail
          SHA='${{ github.sha }}'
          REPO='ghcr.io/${{ github.repository }}'

          # Rewrite the placeholder tag in place rather than shelling out to
          # `kustomize edit`. Two reasons, both learned the hard way:
          #
          #   1. `kustomize edit set image OLD=NEW:TAG` matches on the name as it
          #      appears in the MANIFESTS, not the one it rewrites TO. This step
          #      used to pass the ghcr name, which matched no existing entry, so
          #      kustomize APPENDED a dead one and left the real mapping on
          #      `newTag: latest`. Every "pinned" rollout shipped a mutable tag
          #      and `kubectl rollout undo` had nothing to roll back to. It
          #      failed silently, because appending is a legitimate operation.
          #   2. `kustomize` is not part of kubectl and is not guaranteed on the
          #      runner. `kubectl kustomize` BUILDS but has no `edit`, so there
          #      was no fallback — only an unpinned deploy that exits 0.
          sed -i "s|^\( *newTag: \)latest$|\1$SHA|" "$OVERLAY/apps/kustomization.yaml"

          # Prove the pin landed before applying. A silent no-op here is
          # invisible until someone wonders why a rollback did nothing.
          #
          # Scoped to OUR images: `caddy:2-alpine` and `nats:*` are upstream
          # third-party tags this overlay does not rewrite and should not.
          UNPINNED=$(kubectl kustomize "$OVERLAY/apps" \
            | grep -E "^ *image: ($REPO/|sparx/)" \
            | grep -vE ":[0-9a-f]{40}$" | sort -u || true)
          if [ -n "$UNPINNED" ]; then
            echo "::error::Unpinned sparx image survived the rewrite:"
            echo "$UNPINNED"
            exit 1
          fi

          kubectl apply -k "$OVERLAY/apps"

      - name: Wait for rollout
        if: steps.changed.outputs.value == 'true'
        run: |
          # Deployments only — StatefulSets and Jobs have their own lifecycles.
          #
          # One `rollout status` per Deployment, in PARALLEL. `deployment --all`
          # is not a thing (`error: unknown flag: --all`), and looping serially
          # would multiply the timeout by 21 in the worst case even though the
          # rollouts themselves are concurrent. 2 vCPU means a cold start of 20
          # containers is minutes, not seconds, so the timeout is generous.
          mkdir -p /tmp/rollout
          for d in $(kubectl get deploy -n "$NAMESPACE" -o name); do
            name="${d#deployment.apps/}"
            kubectl rollout status "$d" -n "$NAMESPACE" --timeout=15m \
              > "/tmp/rollout/$name.log" 2>&1 &
          done

          # `wait -n` reaps whichever finishes first; the exit codes are
          # collected rather than short-circuited so ONE stuck Deployment does
          # not hide the state of the other twenty.
          failed=0
          for _ in $(kubectl get deploy -n "$NAMESPACE" -o name); do
            wait -n || failed=1
          done

          for f in /tmp/rollout/*.log; do
            printf '%-28s %s\n' "$(basename "$f" .log)" "$(tail -n1 "$f")"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more Deployments did not roll out."
            kubectl get pods -n "$NAMESPACE" \
              --field-selector=status.phase!=Running -o wide || true
            kubectl get events -n "$NAMESPACE" \
              --sort-by=.lastTimestamp | tail -30 || true
            exit 1
          fi

      - name: Report
        if: always() && steps.changed.outputs.value == 'true'
        run: |
          {
            echo '### Containers'
            echo ''
            echo 'Every image pinned to `${{ github.sha }}`.'
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          kubectl get pods -n "$NAMESPACE" -o wide >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # What actually LANDED, counted from the database rather than inferred from a
      # green rollout. "Ran successfully and wrote nothing" is the failure this
      # exists to make impossible to miss again — `marketplace_themes` held ZERO rows
      # on both clouds for a month while 20 bundles sat committed in the repo.
      #
      # It counts AFTER the rollout because api-rest publishes sparx's catalog on
      # boot: the pods that just came up are what wrote these rows. Counting in the
      # data stage — where this used to live, next to the ingest Job — would report
      # the previous release's numbers and call them this one's.
      #
      # `always()`: a stage that failed part-way is exactly when the real row counts
      # are worth seeing.
      - name: Report what is published
        if: always()
        run: |
          kubectl -n "$NAMESPACE" delete job catalog-count --ignore-not-found
          kubectl apply -n "$NAMESPACE" -f - <<'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: catalog-count
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                enableServiceLinks: false
                containers:
                  - name: psql
                    image: postgres:18-alpine
                    command: ['sh', '-c']
                    args:
                      - >-
                        psql "$AUTH_DATABASE_URL" -tA -F' ' -c
                        "select 'themes', count(*) from marketplace_themes
                         union all select 'blueprints', count(*) from marketplace_blueprints
                         union all select 'components', count(*) from marketplace_components
                         union all select 'integrations', count(*) from marketplace_integrations
                         union all select 'platform_components', count(*) from platform_components
                         order by 1"
                    env:
                      - name: AUTH_DATABASE_URL
                        valueFrom:
                          secretKeyRef: { name: sparx-app-secrets, key: AUTH_DATABASE_URL }
          YAML
          ./.github/scripts/await-job.sh catalog-count "$NAMESPACE" 300 || true
          {
            echo '### Platform data'
            echo ''
            echo '| catalog | rows |'
            echo '| --- | ---: |'
            kubectl -n "$NAMESPACE" logs job/catalog-count --tail=-1 --ignore-errors=true \
              | awk 'NF==2 { print "| " $1 " | " $2 " |" }'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # THE TAG. Cut last, and only when the release actually shipped.
  #
  # This was `auto-tag.yml`, a separate workflow triggered by the same push. It
  # had no `needs` and no `workflow_run`, so it tagged whatever was pushed —
  # which meant a tag asserted "someone pushed a feat: commit", while everyone
  # reads it as "this version shipped".
  #
  # Those are not the same thing, and the gap is not theoretical: v1.195.0 sits
  # on 87dfe7f8, a commit whose image build AND deploy both failed. The version
  # never ran anywhere. Cutting the tag here, behind the stages, makes it mean
  # what it is read to mean — and makes `git tag --points-at` a truthful answer
  # to "what is deployed".
  #
  # `contents: write` is scoped to THIS JOB rather than the workflow. That is
  # the one real argument for keeping tagging separate — the release otherwise
  # runs on `contents: read` while holding cloud OIDC and package write, and it
  # should not also be able to write the repository. Job-level permissions
  # settle it without a second file.
  #
  # A GITHUB_TOKEN-pushed tag does not trigger workflows, which is what we want:
  # the tag marks the release, it does not start another one.
  # ---------------------------------------------------------------------------
  tag:
    needs: [target, base, build, infrastructure, data, containers]
    # Any stage that FAILED means this version did not ship, so it does not get
    # a tag. A SKIPPED stage is fine — `containers` skips itself when nothing
    # runtime-affecting changed, and that is still a completed release.
    #
    # `base` and `build` ARE IN THIS LIST, and leaving them out is how the bug
    # this gate exists to prevent came back. Gating only on the three deploy
    # stages looks sufficient because they are the ones that ship — but `data`
    # and `containers` each carry `needs.build.result == 'success'`, so a failed
    # BUILD does not FAIL them, it SKIPS them, and the line above says a skipped
    # stage is fine. Three skips therefore read as a clean release and got a tag.
    #
    # v1.206.0 and v1.207.0 both sit on commits whose release failed at build and
    # deployed nothing — and because the failure was a build failure, the images
    # for those SHAs do not all exist, so neither tag can be deployed or rolled
    # back to. v1.208.0 was minted the same way and is only true by accident: its
    # release was re-run by hand and passed the second time.
    #
    # Same failure as v1.195.0, through a different door: "did not fail" is not
    # "succeeded" when a stage can be skipped by something upstream dying.
    #
    # `bump: none` is the opt-out for a dispatch that is re-running part of a
    # release and should not mint a version for it.
    if: >-
      always() &&
      needs.base.result == 'success' &&
      needs.build.result == 'success' &&
      needs.infrastructure.result != 'failure' && needs.infrastructure.result != 'cancelled' &&
      needs.data.result != 'failure' && needs.data.result != 'cancelled' &&
      needs.containers.result != 'failure' && needs.containers.result != 'cancelled' &&
      (github.event_name != 'workflow_dispatch' || inputs.bump != 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the tag. Deliberately not granted workflow-wide.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # conventional-commit analysis needs the whole history

      # Bump rules (mathieudutour/github-tag-action defaults):
      #   feat:                           → minor
      #   fix: / perf:                    → patch
      #   feat!: / BREAKING CHANGE footer → major
      #   chore/docs/refactor/ci/build/test/style → no bump
      #
      # `default_bump: false` means a push with no releasable commits cuts no
      # tag at all, rather than silently minting a patch for a docs change.
      - name: Tag the release
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ (github.event_name == 'workflow_dispatch' && inputs.bump != 'auto') && inputs.bump || false }}
          tag_prefix: v
          release_branches: main
          fetch_all_tags: true

      - name: Report
        run: |
          if [ -n '${{ steps.tag.outputs.new_tag }}' ]; then
            {
              echo '### Released'
              echo ''
              echo '`${{ steps.tag.outputs.new_tag }}` — cut after the release succeeded, so it'
              echo 'marks a version that actually shipped.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::notice::No releasable commits since the last tag — no tag cut.'
          fi

  # ---------------------------------------------------------------------------
  # STAGE 4 — CLEANUP. History this release made obsolete.
  #
  # A stage, not a nightly cron, because it is the release that CREATES the
  # garbage: 22 images per commit, ~800 MB for each of the API images,
  # accumulating forever. Pruning belongs to the thing that produced the waste,
  # where its failure is attached to the release that caused it — a separate
  # schedule fails silently, and the first symptom is a bill.
  #
  # That is not hypothetical either. The Artifact Registry equivalent was a
  # manual workflow that defaulted to `dry_run: true`, so the rare time anyone
  # ran it, it deleted nothing. Nobody was watching, and the repository grew to
  # 2.95 TB — roughly $295/month.
  #
  # `if: always()` and never fails the release: a failed prune is a housekeeping
  # problem, and marking a release red because it could not delete an old image
  # would teach everyone to ignore a red release.
  # ---------------------------------------------------------------------------
  cleanup:
    needs: [target, containers]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      # Enough to roll back through several releases. `kubectl rollout undo`
      # only needs the previous one; this is the margin for finding out days
      # later that a release two back was the last good one.
      KEEP_IMAGES: ${{ vars.KEEP_IMAGE_VERSIONS || '5' }}
      KEEP_RUNS: ${{ vars.KEEP_WORKFLOW_RUNS || '50' }}
      # Deletes spent per release. Bounded on purpose — see the prune step.
      MAX_DELETES: ${{ vars.MAX_RUN_DELETES || '300' }}

    steps:
      - name: Prune old image versions
        run: |
          set -euo pipefail
          # Packages are named `sparx/<service>` because the images are pushed
          # as ghcr.io/<owner>/sparx/<service>. The API wants that slash encoded.
          PACKAGES=$(gh api --paginate \
            "/users/$OWNER/packages?package_type=container&per_page=100" \
            --jq '.[].name' | grep '^sparx/' || true)

          if [ -z "$PACKAGES" ]; then
            echo "::warning::No sparx/* container packages found for $OWNER."
            exit 0
          fi

          {
            echo "### Cleanup — images (keeping $KEEP_IMAGES per package)"
            echo ''
            echo '| package | versions | pruned |'
            echo '| --- | ---: | ---: |'
          } >> "$GITHUB_STEP_SUMMARY"

          total=0
          for pkg in $PACKAGES; do
            enc=$(printf '%s' "$pkg" | sed 's#/#%2F#g')

            # Newest first, so everything past $KEEP_IMAGES is a candidate.
            ids=$(gh api --paginate \
              "/users/$OWNER/packages/container/$enc/versions?per_page=100" \
              --jq 'sort_by(.created_at) | reverse | .[].id')
            count=$(echo "$ids" | grep -c . || true)

            # `tail -n +N` starts at the Nth line, so +$((KEEP+1)) is
            # "everything after the newest KEEP".
            stale=$(echo "$ids" | tail -n +$((KEEP_IMAGES + 1)) || true)
            n=$(echo "$stale" | grep -c . || true)

            for id in $stale; do
              # Tolerated: GHCR refuses to delete the last remaining version of
              # a package, and a version can vanish between listing and delete.
              # Neither is a reason to abandon the other twenty-one packages.
              gh api -X DELETE \
                "/users/$OWNER/packages/container/$enc/versions/$id" \
                >/dev/null 2>&1 || echo "  skip $pkg#$id"
            done

            total=$((total + n))
            printf '| %s | %s | %s |\n' "$pkg" "$count" "$n" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Pruned $total image versions.**" >> "$GITHUB_STEP_SUMMARY"

      # Workflow-run history. Nine of the twenty workflows this pipeline
      # replaced no longer exist, and GitHub keeps their runs — and their logs —
      # indefinitely, so the Actions tab stays a list of things that cannot be
      # run. Deleting runs for workflows that are GONE is pure subtraction; the
      # surviving ones are simply trimmed to the newest $KEEP_RUNS.
      - uses: actions/checkout@v4

      - name: Prune old workflow runs
        run: |
          set -euo pipefail
          REPO='${{ github.repository }}'

          {
            echo '### Cleanup — workflow runs'
            echo ''
            echo '| workflow | kept | deleted |'
            echo '| --- | ---: | ---: |'
          } >> "$GITHUB_STEP_SUMMARY"

          # Every workflow GitHub still knows about, and whether its file is
          # still in the tree.
          #
          # The path is the real test, not `state`. A workflow whose FILE has
          # been deleted keeps whatever state it last had — `active` — so
          # GitHub goes on listing it, with all of its runs and all of their
          # logs, indefinitely. Nine of the twenty workflows this pipeline
          # replaced are in exactly that position: gone from the tree, still
          # filling the Actions tab with history for things nobody can run.
          # Those get pruned to nothing; a live workflow keeps its newest
          # $KEEP_RUNS.
          #
          # Written to a FILE rather than piped into the loop: a pipeline puts
          # `while` in a subshell, so the totals it accumulates are discarded
          # when it exits and the summary always reports zero.
          gh api --paginate "/repos/$REPO/actions/workflows" \
            --jq '.workflows[] | "\(.id)\t\(.path)\t\(.name)"' > /tmp/workflows.tsv

          # A BUDGET, because there is no bulk-delete API and each run is one
          # HTTP round trip. Fifteen workflows were deleted in one change, and
          # their accumulated history is thousands of runs — the first version of
          # this step tried to delete all of them in one pass and was still
          # grinding after seven minutes, holding the release open for pure
          # housekeeping.
          #
          # Retention does not need to converge in a single release; it needs to
          # converge. Each release spends a bounded number of deletes and says
          # what is left, so the backlog drains over the next few pushes instead
          # of turning one release into a maintenance window.
          budget=${MAX_DELETES:-300}
          total=0
          remaining=0
          while IFS=$'\t' read -r id path name; do
            [ -n "$id" ] || continue
            if [ -f "$path" ]; then keep="$KEEP_RUNS"; else keep=0; fi

            ids=$(gh api --paginate \
              "/repos/$REPO/actions/workflows/$id/runs?per_page=100" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id' 2>/dev/null || true)

            if [ "$keep" -gt 0 ]; then
              stale=$(echo "$ids" | tail -n +$((keep + 1)) || true)
            else
              stale="$ids"
            fi

            n=$(echo "$stale" | grep -c . || true)
            [ "$n" -eq 0 ] && continue

            deleted=0
            for run in $stale; do
              if [ "$budget" -le 0 ]; then break; fi
              # This run is deleting runs, and its own is the newest of them —
              # but a run that is still in progress cannot be deleted anyway, so
              # the API refuses and the next release collects it. Tolerated for
              # the same reason as a version that vanishes mid-prune.
              gh api -X DELETE "/repos/$REPO/actions/runs/$run" >/dev/null 2>&1 || true
              deleted=$((deleted + 1))
              budget=$((budget - 1))
            done

            total=$((total + deleted))
            remaining=$((remaining + n - deleted))
            if [ -f "$path" ]; then
              printf '| `%s` | %s | %s |\n' "$name" "$keep" "$deleted" >> "$GITHUB_STEP_SUMMARY"
            else
              printf '| `%s` _(file deleted)_ | 0 | %s |\n' "$name" "$deleted" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < /tmp/workflows.tsv

          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ "$remaining" -gt 0 ]; then
            echo "**Pruned $total workflow runs; $remaining still queued for a later release** (budget ${MAX_DELETES:-300}/run)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Pruned $total workflow runs.** Nothing left to collect." >> "$GITHUB_STEP_SUMMARY"
          fi
