name: Build images (GCP)

# Builds every platform image and pushes it to ARTIFACT REGISTRY. The sibling is
# build-images-ghcr.yml.
#
# NAMED FOR THE REGISTRY'S PROVIDER, and note the asymmetry with that sibling —
# it is deliberate. Artifact Registry is a GCP service needing GCP auth, so this
# workflow genuinely is GCP-coupled. GHCR is not Azure's registry; it is
# GitHub's, and GKE could pull the very same images. Calling the other one
# `build-images-azure.yml` would imply you need one build per cloud, which is
# the opposite of true — the deploy and migrate layers are provider-coupled, the
# build layer is REGISTRY-coupled, and one of the two registries happens to be
# cloud-neutral.

on:
  # DISABLED VIA THE TAG PATTERN. `__disabled__` matches no tag we cut (releases
  # are `v*`), so this cannot fire automatically while the platform runs on AKS
  # and pulls from GHCR — see build-images-ghcr.yml, which builds on the push
  # itself and needs no tag. Every run of this one died on
  # `gcloud.auth.docker-helper` after building all 20 images, because Artifact
  # Registry needs a live GCP project. Re-arm by changing that word back to `v*`.
  #
  # The switch lives HERE rather than in `gh workflow disable` because GitHub
  # keys the disabled state to the FILE PATH. This file WAS `build-images.yml`,
  # and it was disabled; renaming it to sit beside its GHCR sibling produced a
  # brand-new workflow that arrived ENABLED and silently undid that. The sentinel
  # is what actually survived the move — a filter inside the file travels with
  # the file.
  #
  # When re-armed, builds are driven by TAGS, never by raw pushes to main.
  # There is deliberately NO `branches: [main]` trigger: it double-built every
  # releasable commit (once on the push, once on the tag) and only ever produced
  # SHA-tagged images that nothing deploys — deploy-gcp.yml rolls out tags, not
  # main-branch SHAs.
  #
  # NOTE: a GITHUB_TOKEN-pushed tag does NOT fire `tags:` on its own. auto-tag.yml
  # used to work around that by dispatching this workflow explicitly; that job is
  # gone (see the note at the bottom of auto-tag.yml), so re-arming the pattern
  # below is not sufficient on its own — restore the dispatch there too, or run
  # this by hand against the tag.
  push:
    tags: ['__disabled__']
  workflow_dispatch:
    inputs:
      service:
        description: 'Single service to rebuild (leave blank for all)'
        required: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  PROJECT_ID: sparxworks
  REGION: us-central1
  AR_REPO: sparx
  # OIDC federation — same values used by db-migrate-gcp.yml. These are public
  # identifiers (no credential value); WIF binds the brandonkorous/sparx repo
  # to the sparx-deployer SA via the github-pool provider.
  WIF_PROVIDER: projects/631794111842/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOYER_SA: sparx-deployer@sparxworks.iam.gserviceaccount.com

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Comment a service back in once its Dockerfile lands at apps/<name>/Dockerfile
        # or services/<name>/Dockerfile. Until then these jobs will fail fast on the
        # "Dockerfile missing" check.
        service:
          - web # @sparx/web — marketing site
          - api-rest
          - api-graphql
          - api-mcp
          - mcp-site # @sparx/mcp-site — shopper-facing MCP (docs/113)
          # dashboard decommissioned 2026-07-22 — the workbench replaced it at
          # app.sparx.works. Its image is no longer built or deployed.
          - workbench # @sparx/workbench — the operator app; now serves app.sparx.works (replaced the dashboard)
          - admin # @sparx/admin — WizeWorks operator console (docs/apps/admin/build-plan.md)
          - site
          - market # @sparx/market — the first-party sparx.market storefront (docs/106 §4.7)
          - media-worker
          - email-worker
          - push-worker
          - markup-recompute-worker
          - automation-worker
          - commerce-indexer
          - legal-seed-worker
          - platform-crm-worker # @sparx/platform-crm-worker — mirrors tenant lifecycle into sparx's own CRM (docs/140)
          - domain-worker
          - dropship-worker
          - billing-worker
          - webhook-worker
          - channel-sync-worker
          - social-worker # @sparx/social-worker — publishes due social posts (docs/133)
    steps:
      - uses: actions/checkout@v4

      - name: Locate Dockerfile
        id: dockerfile
        run: |
          for candidate in apps/${{ matrix.service }}/Dockerfile services/${{ matrix.service }}/Dockerfile; do
            if [ -f "$candidate" ]; then
              echo "path=$candidate" >> $GITHUB_OUTPUT
              echo "context=$(dirname $candidate)" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "No Dockerfile found for ${{ matrix.service }} — skipping." >&2
          exit 0  # soft skip while services are still being scaffolded

      - name: Bail out if Dockerfile not found
        if: steps.dockerfile.outputs.path == ''
        run: |
          echo "::notice::Skipping ${{ matrix.service }} — Dockerfile not yet present."
          exit 0

      - uses: google-github-actions/auth@v2
        if: steps.dockerfile.outputs.path != ''
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.dockerfile.outputs.path != ''

      - name: Configure Docker for Artifact Registry
        if: steps.dockerfile.outputs.path != ''
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Compute tags
        if: steps.dockerfile.outputs.path != ''
        id: tags
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/${{ matrix.service }}"
          echo "sha_tag=$IMAGE:${{ github.sha }}" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version_tag=$IMAGE:$VERSION" >> $GITHUB_OUTPUT
            echo "latest_tag=$IMAGE:latest" >> $GITHUB_OUTPUT
            # Human-readable release stamped into the app bundles (APP_VERSION
            # build-arg). Tag builds get the version, main-branch builds get the
            # short SHA. Only the Next.js apps consume it; other Dockerfiles
            # ignore the unused build-arg.
            echo "app_version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "app_version=${GITHUB_SHA::12}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.dockerfile.outputs.path != ''

      - name: Build & push
        if: steps.dockerfile.outputs.path != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          provenance: false
          # Every NEXT_PUBLIC_* value is INLINED into the client bundle at build
          # time, so it has to be a build-arg — setting it on the pod is too late.
          # These are repo VARIABLES (Settings → Variables), not secrets: a Stripe
          # publishable key is public by design and ships in the browser bundle.
          # A Dockerfile that doesn't declare a matching ARG just ignores it.
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.app_version }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_MARKET_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_MARKET_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.sparx.works' }}
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.version_tag }}
            ${{ steps.tags.outputs.latest_tag }}
          # mode=min exports only the final image layers, not every
          # intermediate. mode=max regularly hangs uploading the heavy
          # Next.js layers to GitHub Actions Cache (the image itself
          # had already been pushed to AR by the time we noticed).
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=min,scope=${{ matrix.service }}

      - name: Trivy scan
        if: steps.dockerfile.outputs.path != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.sha_tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0' # report only — flip to '1' once base images are stable

  # Gate the GKE rollout on a green build. Dispatching the deploy here (instead
  # of firing it from auto-tag in parallel with this build) closes the race where
  # deploy ran `kubectl set image :<tag>` before the image existed →
  # ImagePullBackOff and a timed-out rollout (what red-flagged v0.77.0's deploy).
  # `needs: build` only resolves to success once every matrix service is pushed,
  # so a broken build never reaches the cluster. Tag refs only.
  #
  # UNREACHABLE IN PRACTICE while GCP is the fallback: `build` above can now only
  # start from a manual dispatch, and a dispatch carries a branch ref, not a tag
  # — so `startsWith(github.ref, 'refs/tags/v')` is false and this skips. It is
  # kept wired so that re-arming the sentinel above restores the whole chain in
  # one edit rather than two.
  dispatch-deploy:
    name: Dispatch GKE deploy
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatch deploy-gcp.yml
    steps:
      - name: Trigger the GKE deploy on the built tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # deploy-gcp.yml, renamed from deploy-gcp.yml. A stale filename here
          # is not a comment that reads oddly — it is a dispatch that 404s and
          # fails the job.
          echo "All images built & pushed for $TAG — dispatching deploy-gcp.yml"
          gh workflow run deploy-gcp.yml --repo "$GH_REPO" --ref "$TAG"
