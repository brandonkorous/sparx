# Deployed with wrangler, NOT Terraform — terraform/envs/prod/cloudflare.tf is
# the right long-term home, but its state lives in gs://sparx-terraform-state and
# is unreachable while the GCP project is shut down. Move it into cloudflare.tf
# when that state is re-established or re-imported into a local backend.
#
#   npx wrangler login
#   npx wrangler deploy          # from this directory
#
# This Worker is NOT part of the pnpm workspace (pnpm-workspace.yaml covers only
# apps/*, packages/*, services/*) and is excluded from the repo's ESLint run —
# it targets the Workers runtime, whose globals are not in any tsconfig project
# here. wrangler typechecks and bundles it on deploy.
name = "sparx-media-direct"
main = "src/index.ts"
compatibility_date = "2026-07-31"

# Binds the Worker in front of the media-direct hostname. That record must be a
# PROXIED (orange-cloud) CNAME to the same tunnel as the rest of the platform —
# a Worker route cannot attach to a DNS-only record, which is the whole reason
# the old grey-cloud approach is unavailable here.
#
#   cloudflared tunnel route dns sparx-local media-direct.sparx.works
routes = [
  { pattern = "media-direct.sparx.works/*", zone_name = "sparx.works" }
]

[observability]
enabled = true

# ORIGIN_HOST is intentionally unset: the default behaviour is "same URL, minus
# the range headers", which is what we want while media-direct and media share
# one origin. Set it only if they are ever split.
# [vars]
# ORIGIN_HOST = "media.sparx.works"
