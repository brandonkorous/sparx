packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'
  # Piggles — the sister brand. Its OWN apps + packages only; it consumes the
  # shared platform (@sparx/db, @sparx/auth, @sparx/events, services/*) and
  # contributes nothing back into it. See piggles/CLAUDE.md for the boundary.
  - 'piggles/apps/*'
  - 'piggles/packages/*'

# Single source of truth for the @wizeworks/silicaui family versions. Consuming
# apps reference these as "catalog:" in their package.json (e.g.
# "@wizeworks/silicaui": "catalog:") so a version bump happens in one place, not
# across market/dashboard/site/web. The family is scoped under @wizeworks/* and
# published to the registry — these pins install straight from it (the earlier
# local `pnpm.overrides` link block has been removed). Bump here when a new
# version ships; keep every entry on the same version so the family stays unified.
catalog:
  '@wizeworks/silicaui': ^0.52.0
  '@wizeworks/silicaui-react': ^0.52.0
  '@wizeworks/silicaui-html': ^0.52.0
  '@wizeworks/silicaui-behaviors': ^0.52.0
  '@wizeworks/silicaui-mcp': ^0.52.0
  '@wizeworks/silicaui-editor': ^0.52.0
  '@wizeworks/silicaui-dnd': ^0.52.0
  '@wizeworks/silicaui-panels': ^0.52.0
  '@wizeworks/silicaui-charts': ^0.52.0
  '@wizeworks/silicaui-table': ^0.52.0
  '@wizeworks/silicaui-builder': ^0.52.0
