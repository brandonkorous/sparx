packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

# Single source of truth for the @wizeworks/silicaui family versions. Consuming
# apps reference these as "catalog:" in their package.json (e.g.
# "@wizeworks/silicaui": "catalog:") so a version bump happens in one place, not
# across market/dashboard/site/web. The family is scoped under @wizeworks/* and
# published to the registry — these pins install straight from it (the earlier
# local `pnpm.overrides` link block has been removed). Bump here when a new
# version ships; keep every entry on the same version so the family stays unified.
catalog:
  '@wizeworks/silicaui': ^0.34.2
  '@wizeworks/silicaui-react': ^0.34.2
  '@wizeworks/silicaui-html': ^0.34.2
  '@wizeworks/silicaui-behaviors': ^0.34.2
  '@wizeworks/silicaui-mcp': ^0.34.2
  '@wizeworks/silicaui-editor': ^0.34.2
  '@wizeworks/silicaui-dnd': ^0.34.2
  '@wizeworks/silicaui-panels': ^0.34.2
  '@wizeworks/silicaui-charts': ^0.34.2
  '@wizeworks/silicaui-table': ^0.34.2
  '@wizeworks/silicaui-builder': ^0.34.2
